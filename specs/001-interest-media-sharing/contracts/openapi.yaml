openapi: 3.1.0
info:
  title: Interest-Centred Media Sharing API
  version: 0.1.0
  description: >
    HTTP contract for the interest-centred media sharing app.
    Derived from specs/001-interest-media-sharing/spec.md; every operation cites the
    functional requirements it serves.

    Visibility note: every response that can contain posts has already passed through
    the single visibility boundary described in research.md D6. A caller never receives
    a post excluded by FR-014 to FR-016, on any endpoint (FR-018, SC-009).

servers:
  - url: https://api.example.com/v1

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: People
  - name: Interests
  - name: Posts
  - name: Media
  - name: Feed
  - name: Engagement
  - name: Safety
  - name: Notifications
  - name: Moderation

paths:

# ---------------------------------------------------------------------------
# FEATURE 008 — tracked, NOT yet in this document.
#
# 002's first defect was this document and the server disagreeing about
# publishing: OpenAPI said `uploadIds: string[]`, the server wanted
# `uploads: [{uploadId, key, kind}]`, and any client generated from the contract
# 400s on every publish. Contract tests cannot catch that — both sides generated
# from one document agree with each other by construction. Only a request can.
#
# So this block exists to make the omission VISIBLE while it is still an
# omission. Each line is added below, with its schema, in the SAME commit as the
# code that serves it — never after. Delete a line when it lands.
#
#   Phase A
#     [ ] GET    /notifications                   + readAt populated, unreadCount
#   Phase B
#     [ ] PATCH  /me                              + avatarUploadId (008/FR-017)
#     [ ] (every profile-bearing response)        + avatarUrl, presigned (FR-019)
#     [ ] GET    /search/posts                    008/FR-020..FR-022
#   Phase C
#     [ ] POST   /posts/{postId}/comments         + parentCommentId (FR-023)
#     [ ] PATCH  /posts/{postId}/comments/{id}    008/FR-027
#     [ ] DELETE /posts/{postId}/comments/{id}    008/FR-028
#     [ ] (post + comment)                        + mentions (FR-030)
#     [ ] (media item)                            + altText (FR-034)
#     [ ] PATCH  /posts/{postId}                  + term-row re-index (FR-020)
#     [ ] POST GET DELETE /me/drafts              008/FR-037, FR-038
#   Phase D
#     [ ] PUT DELETE /people/{handle}/mute        008/FR-039, FR-040
#     [ ] PUT    /posts/{postId}/dismiss          008/FR-041, FR-042
#     [ ] PATCH  /me                              + accountPrivacy (FR-043)
#     [ ] GET    /me/follow-requests (+approve/decline)  008/FR-043
#     [ ] GET    /me/moderation-notices           008/FR-046
#     [ ] POST   /appeals, GET /me/appeals        008/FR-047, FR-048
#     [ ] GET PATCH /moderation/appeals           008/FR-047
#   Phase E
#     [ ] POST GET PATCH DELETE /me/collections   008/FR-049, FR-050
#     [ ] PUT DELETE /me/collections/{id}/posts/{postId}  008/FR-051
#     [ ] GET    /me/collections/{id}/posts       008/FR-050
# ---------------------------------------------------------------------------

  /me:
    get:
      tags: [People]
      summary: Current person's profile and preferences
      description: Serves FR-002, FR-049.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SelfProfile' }
        '401': { $ref: '#/components/responses/Unauthorised' }
    patch:
      tags: [People]
      summary: Update display name, avatar, bio, or notification preferences
      description: Serves FR-002, FR-049.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SelfProfile' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [People]
      summary: Delete the current account
      description: >
        Serves FR-003. Returns immediately with the retention outcome; content removal
        and comment anonymisation proceed asynchronously. Followers-only content becomes
        inaccessible as soon as this returns.
      responses:
        '202':
          description: Deletion accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionOutcome' }

  /people/{handle}:
    get:
      tags: [People]
      summary: A person's public profile
      description: >
        Serves FR-038. Includes follower and following counts and the interests they
        post to most. Posts are fetched separately via /people/{handle}/posts.
      parameters:
        - $ref: '#/components/parameters/Handle'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicProfile' }
        '404': { $ref: '#/components/responses/NotFound' }

  /people/{handle}/posts:
    get:
      tags: [People, Posts]
      summary: A person's posts, newest first
      description: Serves FR-038. Filtered to what the caller may see.
      parameters:
        - $ref: '#/components/parameters/Handle'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }

  /people/{handle}/follow:
    put:
      tags: [People]
      summary: Follow a person
      description: >
        Serves FR-037. Idempotent. Following a person gives their posts a bounded
        boost in the caller's ranked feed (007/FR-029). It never admits a post the
        ranking would not otherwise have considered.


        The earlier wording — that a follow does not by itself add their posts to
        the feed, per FR-033 — described the composed feed and is withdrawn with it.
      parameters:
        - $ref: '#/components/parameters/Handle'
      responses:
        '204': { description: Following }
        '409':
          description: Blocked in either direction (FR-044)
    delete:
      tags: [People]
      summary: Unfollow a person
      description: Serves FR-037. Idempotent.
      parameters:
        - $ref: '#/components/parameters/Handle'
      responses:
        '204': { description: Not following }

  /interests:
    get:
      tags: [Interests]
      summary: Browse or search interests
      description: >
        Serves FR-025, FR-026. With `q`, performs type-ahead matching across both
        levels, returning each sub-interest with its parent. With `level=top` and no
        `q`, returns the curated catalogue.
      security: []
      parameters:
        - name: q
          in: query
          schema: { type: string, minLength: 1, maxLength: 50 }
          description: Partial name; results returned as the caller types.
        - name: level
          in: query
          schema: { type: string, enum: [top, sub] }
        - name: parentId
          in: query
          schema: { type: string }
          description: Restrict to sub-interests of this parent (FR-020).
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterestPage' }
    post:
      tags: [Interests]
      summary: Create a sub-interest
      description: >
        Serves FR-022. Any signed-in person may create a sub-interest beneath exactly
        one top-level parent. Rate limited per FR-046. Creating a top-level interest
        requires operator authority (FR-021) and is not exposed here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InterestCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Interest' }
        '409':
          description: >
            A sufficiently similar sub-interest already exists under this parent
            (FR-023). The response carries the candidates so the caller can join one
            instead of creating a duplicate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuplicateInterestCandidates' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /interests/similar:
    get:
      tags: [Interests]
      summary: Near-duplicate check before creating a sub-interest
      description: >
        Serves FR-023. Called as the person types a new sub-interest name so the
        warning appears before submission rather than as a rejection. SC-008 measures
        whether this is effective.
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 50 }
        - name: parentId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuplicateInterestCandidates' }

  /interests/{interestId}:
    get:
      tags: [Interests]
      summary: An interest, with its sub-interests when top-level
      description: >
        Serves FR-025. A merged interest (FR-030) responds 301 to its survivor.
      security: []
      parameters:
        - $ref: '#/components/parameters/InterestId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterestDetail' }
        '301':
          description: Interest was merged into another (FR-030)
          headers:
            Location: { schema: { type: string } }
        '404': { $ref: '#/components/responses/NotFound' }

  /interests/{interestId}/posts:
    get:
      tags: [Interests, Posts]
      summary: Posts in an interest, newest first
      description: >
        Serves FR-024, FR-025. For a top-level interest the response includes posts
        published to its sub-interests. Empty results carry an empty-state hint
        (FR-036).
      security: []
      parameters:
        - $ref: '#/components/parameters/InterestId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        # 004/FR-027, FR-028: `top` REORDERS the set `new` returns. It must not
        # change WHICH posts are returned - SC-009 asserts identical id sets.
        - { name: order, in: query, schema: { type: string, enum: [new, top], default: new } }
        # 004/FR-029: with `q` this is surface 11 of the visibility matrix.
        # Matching happens AFTER filtering, never before.
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }

  /interests/{interestId}/follow:
    put:
      tags: [Interests]
      summary: Follow an interest
      description: >
        Serves FR-027. Following a top-level interest covers all its sub-interests,
        including ones created later (FR-028). Idempotent.
      parameters:
        - $ref: '#/components/parameters/InterestId'
      responses:
        '204': { description: Following }
        '409':
          description: Follow cap reached
    delete:
      tags: [Interests]
      summary: Unfollow an interest
      description: Serves FR-027. Idempotent.
      parameters:
        - $ref: '#/components/parameters/InterestId'
      responses:
        '204': { description: Not following }

  /interests/suggested:
    get:
      tags: [Interests]
      summary: Interests the caller may want to follow
      description: Serves FR-029, and the onboarding path measured by SC-006.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterestPage' }

  /media/uploads:
    post:
      tags: [Media]
      summary: Request a presigned upload target
      description: >
        Serves FR-004, FR-005, FR-008. Size and duration caps are validated here,
        before any bytes move, so the caller learns of a limit up front rather than
        after a long upload. The returned uploadId is quoted when creating the post,
        which is what allows a failed upload to be retried without re-selecting media.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadRequest' }
      responses:
        '201':
          description: Upload target issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadTarget' }
        '413':
          description: Exceeds the size or duration cap (FR-005)
        '415':
          description: Unsupported media type
        '429': { $ref: '#/components/responses/RateLimited' }

  /posts:
    post:
      tags: [Posts]
      summary: Publish a post
      description: >
        Serves FR-004 to FR-007 and FR-013. At least one interest is required; a
        request without one is rejected. Visibility defaults to public. The post is
        created in a processing state and becomes visible to others only once
        derivation completes (FR-009), including the server-side EXIF strip (FR-010).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostCreate' }
      responses:
        '201':
          description: Created, processing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '422':
          description: >
            Validation failed — includes the case of no interest assigned (FR-006).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /posts/{postId}:
    get:
      tags: [Posts]
      summary: A single post
      description: >
        Serves FR-041, FR-042. This is also the share-link target. A post the caller
        may not see returns 404 when it is gone and 403 when it exists but excludes
        them, so the client can show "no longer available" versus "not available to
        you" distinctly.
      security: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '403':
          description: Exists but the caller is not permitted (FR-015, FR-042)
        '404':
          description: Deleted, or never existed (FR-042)
    patch:
      tags: [Posts]
      summary: Edit caption, interests, or visibility
      description: >
        Serves FR-011 and FR-017. A visibility change takes effect on every surface
        immediately, and outstanding share links resolve against the new value.
        Re-filing to a different interest moves the post in one atomic step.
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '403': { description: Not the author }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Posts]
      summary: Delete a post
      description: >
        Serves FR-012. Removes the post from every interest space, feed, and profile.
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '204': { description: Deleted }
        '403': { description: Not the author }

  /feed/home:
    get:
      tags: [Feed]
      summary: The caller's ranked home feed
      description: >
        Serves 001/FR-032, FR-035 and 007/FR-005 through FR-009. **RANKED from the
        caller's behaviour, not composed from what they follow** (007, constitution
        2.0.0). One blended stream: no sections, no per-post explanation of why
        anything is where it is (007/FR-010).


        Ranking proposes candidates; the visibility boundary decides. Every page is
        assembled per request against current state, so a visibility change lands
        here on the first request after it (001/FR-017, SC-009, 007/FR-006).


        Some of every page comes from outside the caller's established signals
        (007/FR-007), so the feed cannot collapse to one interest. A caller with no
        signals and no seed picks still gets a populated page (007/FR-015). If a
        ranking cannot be produced the response is a defensible fallback ordering
        rather than an error (007/FR-009).


        `cursor` is opaque and carries what this session has already been shown, so
        paging never repeats a post and a post published mid-scroll cannot shift the
        reader's position (007/FR-008). A page that under-fills is the end of the feed
        and returns a null cursor. The withdrawn `no_followed_interests` hint is gone:
        a ranked feed is never in that state.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
  /feed/following:
    get:
      tags: [Feed]
      summary: Posts by the people you follow, newest first
      description: >
        008/FR-008, FR-009, FR-010. CHRONOLOGICAL AND UNRANKED, deliberately: it
        exists to be the predictable alternative to the ranked home feed, and if
        it ranked it would be a second "For you".

        Reading it records NO behavioural signal (FR-009). A person who prefers
        this surface must not still be training the feed they are avoiding.

        Bounded by the 200-person follow cap: the fan-out is one query per
        followed author, so without a cap the surface would have no stated worst
        case.

        `emptyStateHint` is `no_follows` for a viewer who follows nobody, and
        null for one whose followed authors have simply not posted - two
        different facts, and only the first gets an explanation.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPage' }
        '401': { $ref: '#/components/responses/Unauthorised' }


  /signals:
    post:
      tags: [Feed]
      summary: Record what the caller did with posts they were shown
      description: >
        Serves 007/FR-003, FR-004. **Written for the authenticated caller only** — the
        subject comes from the token and never from the body.


        The client REPORTS; the server decides what a report is worth. Dwell is clamped
        to 30s and discarded below 3s, one weight is taken per kind per post per
        session, the batch is bounded, and a signal naming a post the caller cannot see
        is rejected rather than merely unweighted — recording it would store the fact
        that this person looked at a post they are not permitted to know exists. Every
        one of those bounds is enforced server-side and tested through the path a
        hostile client would take (constitution 2.0.0, Principle III).


        See `specs/007-ranked-feed-redesign/contracts/signals.md`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignalBatch' }
      responses:
        '200':
          description: Recorded. Counts are per signal, not per request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignalReceipt' }
        '401': { $ref: '#/components/responses/Unauthorised' }

  /me/feed-signals:
    get:
      tags: [Feed]
      summary: What the caller's feed is built from
      description: >
        Serves 007/FR-011. Rendered from THE SAME weights the ranker reads, through the
        same decay function, so the explanation cannot drift from the behaviour it
        describes. An explanation computed separately is one that becomes false without
        anyone noticing.


        This is the account-level disclosure, and it is the ONLY place the product
        explains its ranking: 007/FR-010 forbids a per-post "why am I seeing this" on
        any browse or post surface.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedSignalDisclosure' }
        '401': { $ref: '#/components/responses/Unauthorised' }
    delete:
      tags: [Feed]
      summary: Clear everything the feed has learned about the caller
      description: >
        Serves 007/FR-012. Deletes the weighted profile AND the raw events. Both, or
        the promise is false in a way nobody would notice. Afterwards the feed ranks as
        it would for a new account holding the same seed picks.
      responses:
        '200':
          description: Cleared
          content:
            application/json:
              schema:
                type: object
                required: [cleared]
                properties:
                  cleared: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorised' }

  /me/seed-interests:
    post:
      tags: [Feed]
      summary: The one-time cold-start picks
      description: >
        Serves 007/FR-014. A SEED, not a subscription. These initialise the ranking on
        an account with no behaviour to learn from and are then overtaken by it; they
        are stored under their own item type rather than as interest follows, because
        every later reader treats a follow as a follow and that would quietly recreate
        the subscription feed 007 removes.


        Skipping is allowed and produces a populated feed anyway (007/FR-015).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [interestIds]
              properties:
                interestIds:
                  type: array
                  maxItems: 20
                  items: { type: string }
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [seedInterests]
                properties:
                  seedInterests: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorised' }

  /posts/{postId}/reaction:
    put:
      tags: [Engagement]
      summary: React to a post
      description: >
        Serves FR-039. Idempotent — at most one reaction per person per post, so a
        repeated call does not inflate the count.
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: Reacted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReactionState' }
        '403': { description: Post not visible to the caller }
    delete:
      tags: [Engagement]
      summary: Remove a reaction
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: Reaction removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReactionState' }

  /posts/{postId}/comments:
    get:
      tags: [Engagement]
      summary: Comments on a post
      description: Serves FR-040. Readable exactly when the post is.
      security: []
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentPage' }
        '403': { description: Post not visible to the caller }
    post:
      tags: [Engagement]
      summary: Comment on a post
      description: Serves FR-040. Rate limited per FR-046.
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '403': { description: Post not visible to the caller }
        '429': { $ref: '#/components/responses/RateLimited' }

  /posts/{postId}/share-link:
    post:
      tags: [Engagement]
      summary: Generate a shareable link
      description: >
        Serves FR-041. The link is a stable URL resolving to GET /posts/{postId}; it
        confers no access of its own and is always evaluated against the post's current
        visibility (FR-042).
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '201':
          description: Link issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareLink' }
        '403': { description: Post not visible to the caller }

  /reports:
    post:
      tags: [Safety]
      summary: Report a post, comment, or interest name
      description: Serves FR-043. All three subject types are reportable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportCreate' }
      responses:
        '201':
          description: Report filed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /blocks/{handle}:
    put:
      tags: [Safety]
      summary: Block a person
      description: >
        Serves FR-044. Hides content in both directions, severs any follow either way,
        and prevents further interaction. Previously visible followers-only content is
        withdrawn as a consequence.
      parameters:
        - $ref: '#/components/parameters/Handle'
      responses:
        '204': { description: Blocked }
    delete:
      tags: [Safety]
      summary: Unblock a person
      parameters:
        - $ref: '#/components/parameters/Handle'
      responses:
        '204': { description: Unblocked }

  /notifications:
    get:
      tags: [Notifications]
      summary: The caller's notifications
      description: >
        Serves FR-048. Generation respects both notification preferences and post
        visibility, so a notification never reveals content the recipient cannot open.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }

  /notifications/read:
    put:
      tags: [Notifications]
      summary: Mark every notification read
      description: >
        008/FR-005, FR-006, FR-007. Writes a read WATERMARK for the caller
        (`lastReadAt`), from which each notification's `readAt` is derived.

        Idempotent, which is why it is a PUT: setting the watermark to "now"
        twice is one state, and a retry after a dropped response must not be a
        second event. The timestamp is the SERVER's - a client-supplied one could
        mark notifications read before they arrived.

        Not folded into `GET /notifications`, deliberately: writing on read would
        mutate N rows on a hot path and give a GET side effects.

        Same shape as `PUT /conversations/{conversationId}/read`, which is the
        read watermark this copies.
      responses:
        '204': { description: Read position updated }
        '401': { $ref: '#/components/responses/Unauthorised' }

  /moderation/reports:
    get:
      tags: [Moderation]
      summary: The moderation queue, oldest first
      description: >
        Operator only. Serves FR-045; the ordering is what makes SC-010 (95% decided
        within 24h) measurable.
      parameters:
        - name: state
          in: query
          schema: { type: string, enum: [open, under_review, actioned, dismissed] }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportPage' }
        '403': { description: Not an operator }

  /moderation/reports/{reportId}:
    patch:
      tags: [Moderation]
      summary: Record a moderation decision
      description: >
        Operator only. Serves FR-045 and FR-047 — the decision is written to an
        append-only audit log, and the author is notified when their content is removed.
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModerationDecision' }
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '403': { description: Not an operator }

  /moderation/interests/{interestId}:
    patch:
      tags: [Moderation, Interests]
      summary: Re-parent, merge, or retire an interest
      description: >
        Operator only. Serves FR-030. Merge and re-parent carry posts and followers
        across and run asynchronously, so this returns 202 with a job to poll.
        Retiring a top-level interest that still has live sub-interests is refused —
        posts are never orphaned.
      parameters:
        - $ref: '#/components/parameters/InterestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InterestAdminAction' }
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterestJob' }
        '409':
          description: Refused — would orphan posts, or interest already merging
        '403': { description: Not an operator }


  # ============================ feature 004 ============================
  # specs/004-chat-places-and-depth/contracts/openapi.yaml, merged.

  /conversations:
    get:
      tags: [Conversations]
      summary: The signed-in person's inbox
      description: Serves FR-003. `state=requested` is the separate requests inbox.
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [accepted, requested], default: accepted } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Conversations, most recent message first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ConversationSummary' } }
                  nextCursor: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorised' }

  /conversations/with/{handle}:
    put:
      tags: [Conversations]
      summary: Open (or fetch) the conversation with a person
      description: >
        Serves FR-001. Idempotent: the conversation id is derived from the participant pair
        (research R8), so there is exactly one thread per pair and repeat calls return it.
        Returns 404 — never 403 — when the other person has blocked the caller, so a block
        is not disclosed (FR-006).
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The conversation
          content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFoundOpaque' }

  /conversations/{conversationId}:
    get:
      tags: [Conversations]
      summary: One conversation's state
      description: Serves FR-001, FR-041. Access decided by ConversationAccess.
      parameters: [ { $ref: '#/components/parameters/ConversationId' } ]
      responses:
        '200':
          content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } }
          description: The conversation
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFoundOpaque' }

  /conversations/{conversationId}/messages:
    get:
      tags: [Conversations]
      summary: Messages, with optional long-poll
      description: >
        Serves FR-001, FR-010, FR-011. With `wait` set, the server holds the request open
        until a message newer than `after` exists or the wait elapses, then returns
        (research R1). An empty `items` with a 200 is a normal timeout, not an error.

        Each message's `sharedPostId` is resolved per reader through the post visibility
        boundary (FR-009). `sharedPost` is null when the reader may not see it, and
        `sharedPostUnavailableReason` distinguishes "gone" from "not for you" using 001's
        error table.
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
        - { name: after, in: query, schema: { type: string }, description: Message id cursor }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - name: wait
          in: query
          schema: { type: integer, minimum: 0, maximum: 25, default: 0 }
          description: Seconds to hold the request open. 0 returns immediately.
      responses:
        '200':
          description: Messages in creation order
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Message' } }
                  nextCursor: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFoundOpaque' }
    post:
      tags: [Conversations]
      summary: Send a message
      description: >
        Serves FR-001, FR-008, FR-009. A send into a `declined` conversation returns 202 and
        stores nothing — the sender is not told they were declined (FR-005). A send into a
        `severed` conversation returns 404.
      parameters: [ { $ref: '#/components/parameters/ConversationId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string, maxLength: 2000 }
                sharedPostId: { type: string, nullable: true }
              anyOf:
                - { required: [body] }
                - { required: [sharedPostId] }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } }
        '202': { description: Accepted and discarded — conversation is declined (FR-005) }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFoundOpaque' }
        '409': { description: One unanswered message already sent into a requested conversation (FR-005) }
        '429': { description: Rate limited (FR-008) }

  /conversations/{conversationId}/accept:
    post:
      tags: [Conversations]
      summary: Accept a message request
      description: Serves FR-005. Only the recipient may call it.
      parameters: [ { $ref: '#/components/parameters/ConversationId' } ]
      responses:
        '204': { description: Accepted }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFoundOpaque' }

  /conversations/{conversationId}/decline:
    post:
      tags: [Conversations]
      summary: Decline a message request
      description: Serves FR-005. The sender is not notified and cannot detect this.
      parameters: [ { $ref: '#/components/parameters/ConversationId' } ]
      responses:
        '204': { description: Declined }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFoundOpaque' }

  /conversations/{conversationId}/read:
    put:
      tags: [Conversations]
      summary: Mark read up to a message
      description: Serves FR-010.
      parameters: [ { $ref: '#/components/parameters/ConversationId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [upToMessageId], properties: { upToMessageId: { type: string } } }
      responses:
        '204': { description: Read position updated }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFoundOpaque' }

  # ---------------------------------------------------------------------- Places (US2)

  /places:
    get:
      tags: [Places]
      summary: Search places by name
      description: >
        Serves FR-014, FR-022. Results appear as the caller types. `locality` narrows the
        search and is what makes the dedupe in FR-014 meaningful — two "Joe's" in different
        cities are two places; two in one city are probably one.
      security: []
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: locality, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/PlaceCategory' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 25, default: 10 } }
      responses:
        '200':
          description: Matching places
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PlaceSummary' } }
    post:
      tags: [Places]
      summary: Create a place
      description: >
        Serves FR-013. Returns 409 with the existing place when an active place with the
        same slug exists in the same locality, so the client attaches that one instead of
        creating a duplicate (FR-014). The name is content and is reportable (FR-020).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category, locality]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                category: { $ref: '#/components/schemas/PlaceCategory' }
                locality: { type: string, minLength: 1, maxLength: 120 }
                address: { type: string, maxLength: 240, nullable: true }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Place' } } }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '409':
          description: An active place with this name already exists in this locality
          content: { application/json: { schema: { $ref: '#/components/schemas/Place' } } }
        '429': { description: Rate limited }

  /places/{placeId}:
    get:
      tags: [Places]
      summary: A place
      description: Serves FR-016. Readable signed out.
      security: []
      parameters: [ { $ref: '#/components/parameters/PlaceId' } ]
      responses:
        '200':
          description: The place
          content: { application/json: { schema: { $ref: '#/components/schemas/Place' } } }
        '404': { description: No such place }
    patch:
      tags: [Places]
      summary: Rename, merge, or retire a place
      description: Serves FR-020. Operators only. Posts and followers move on merge; nothing is orphaned.
      parameters: [ { $ref: '#/components/parameters/PlaceId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                category: { $ref: '#/components/schemas/PlaceCategory' }
                status: { type: string, enum: [active, merged, retired] }
                mergedIntoPlaceId: { type: string }
      responses:
        '200':
          description: Updated
          content: { application/json: { schema: { $ref: '#/components/schemas/Place' } } }
        '403': { description: Not an operator }

  /places/{placeId}/posts:
    get:
      tags: [Places]
      summary: Posts attached to a place
      description: >
        Serves FR-016, FR-017. **Surface 8** of the visibility matrix. Anonymous callers see
        public posts only; every other exclusion is decided by the same boundary as every
        other surface.
      security: []
      parameters:
        - { $ref: '#/components/parameters/PlaceId' }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Visible posts, most recent first
          content: { application/json: { schema: { $ref: '#/components/schemas/PostPage' } } }
        '404': { description: No such place }

  /places/{placeId}/follow:
    put:
      tags: [Places]
      summary: Follow a place
      description: >
        Serves FR-018. **A place follow does not widen the home feed** — posts reach the
        feed only through interests the viewer already follows (FR-019, Constitution I).
        SC-006 asserts the negative case directly.
      parameters: [ { $ref: '#/components/parameters/PlaceId' } ]
      responses:
        '204': { description: Following }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { description: No such place }
    delete:
      tags: [Places]
      summary: Unfollow a place
      description: Serves FR-018.
      parameters: [ { $ref: '#/components/parameters/PlaceId' } ]
      responses:
        '204': { description: Not following }
        '401': { $ref: '#/components/responses/Unauthorised' }

  # ------------------------------------------------------- Interest depth (US3) — changed

  /interests/{interestId}/description:
    put:
      tags: [Interests]
      summary: Set an interest's description
      description: >
        Serves FR-025, FR-030. Operators for a top-level interest; the creator or an operator
        for a sub-interest. The description is content and is reportable.
      parameters: [ { name: interestId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [description], properties: { description: { type: string, maxLength: 500 } } }
      responses:
        '204': { description: Updated }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '403': { description: Not permitted to describe this interest }

  # ------------------------------------------------------ Shipped-scope gaps (US4)

  /people:
    get:
      tags: [People]
      summary: Search people by handle or display name
      description: >
        Serves FR-034, FR-035, FR-036. Excludes people blocked in EITHER direction and any
        person whose account is not active. The block exclusion is server-side and is tested
        through the path a hostile client would take (Constitution III).
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 25, default: 10 } }
      responses:
        '200':
          description: Matching people
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PublicProfile' } }
        '401': { $ref: '#/components/responses/Unauthorised' }

  # ------------------------------------------------------------------- Saved posts (US5)

  /posts/{postId}/save:
    put:
      tags: [Saved]
      summary: Save a post
      description: Serves FR-037. Refused for a post the caller cannot currently see.
      parameters: [ { name: postId, in: path, required: true, schema: { type: string } } ]
      responses:
        '204': { description: Saved }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { description: No such post, or not visible to the caller }
    delete:
      tags: [Saved]
      summary: Unsave a post
      parameters: [ { name: postId, in: path, required: true, schema: { type: string } } ]
      responses:
        '204': { description: Not saved }
        '401': { $ref: '#/components/responses/Unauthorised' }

  /me/saved:
    get:
      tags: [Saved]
      summary: The signed-in person's saved posts
      description: >
        Serves FR-037, FR-038, FR-039. **Surface 9** of the visibility matrix. A save is a
        bookmark, not a copy: a post the saver may no longer see is absent, never stale
        (SC-013).
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Saved posts the caller can still see, most recently saved first
          content: { application/json: { schema: { $ref: '#/components/schemas/PostPage' } } }
        '401': { $ref: '#/components/responses/Unauthorised' }

  # ----------------------------------------------- Publish and edit (US2) — changed

  # ============================ feature 005 ============================
  # specs/005-reviews-and-group-chat/contracts/openapi-delta.yaml, merged.
  #
  # ONE document, because the client is generated from it and two documents would
  # generate two clients. 002's first defect was the contract and the server
  # disagreeing about the publish body, which 400'd every publish from any
  # generated client - both sides being generated from one document is what
  # prevents that, and is also why contract tests cannot catch it.

  /places/{placeId}/rating:
    put:
      tags: [Places]
      summary: Rate a place, or replace your existing rating
      description: Serves 005/FR-001 and FR-002. At most one rating per person per place.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: placeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RatingWrite' } } }
      responses:
        '200':
          description: The rating as stored, with the place's updated summary
          content: { application/json: { schema: { $ref: '#/components/schemas/RatingWithSummary' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Places]
      summary: Withdraw your rating
      description: Serves 005/FR-003.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: placeId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Withdrawn; the place summary is recomputed }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFound' }

  /places/{placeId}/reviews:
    get:
      tags: [Places]
      summary: A place's reviews
      description: |
        Serves 005/FR-010 and FR-012. OPTIONAL AUTH, deliberately: a signed-out
        visitor reads reviews, and a signed-in one gets the same list with blocks
        applied in both directions (FR-013). 002's third defect was ApiClient
        sending no token on optional-auth endpoints, so a signed-in person was
        treated as anonymous and told content was "not available to you".

        `security: []` is this contract's convention for a read that is public but
        answers differently when it knows the caller - the same declaration
        GET /places/{placeId} uses. The idiomatic `[{}, {bearerAuth: []}]` spelling
        generates `auth: true`, which would misdescribe this operation in the
        generated map even though ApiClient sends a token whenever it has one.
      security: []
      parameters:
        - { name: placeId, in: path, required: true, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Reviews the viewer may see, newest first
          content: { application/json: { schema: { $ref: '#/components/schemas/ReviewPage' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /conversations/groups:
    post:
      tags: [Conversations]
      summary: Start a group conversation
      description: |
        Serves 005/FR-018. 200 rather than 201 because FR-027 means this can
        resolve to an EXISTING pair conversation when given a single participant,
        and reporting "created" for something already there makes a client's cache
        wrong.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GroupCreate' } } }
      responses:
        '200':
          description: The conversation, created or resolved
          content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '409': { $ref: '#/components/responses/CannotAddParticipant' }

  /conversations/{conversationId}/participants:
    post:
      tags: [Conversations]
      summary: Add somebody to a group
      description: Serves 005/FR-020. Idempotent for somebody already present.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle]
              properties: { handle: { type: string } }
      responses:
        '204': { description: Added, or already a participant }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { description: You are not a participant }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CannotAddParticipant' }

  /conversations/{conversationId}/leave:
    post:
      tags: [Conversations]
      summary: Leave a group
      description: |
        Serves 005/FR-021. Messages already sent remain readable to the rest -
        leaving withdraws you from the conversation, it does not retract what you
        said to people who were there.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Left }
        '403': { description: You are not a participant }
        '404': { description: No such conversation, or it is a pair conversation }


components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito-issued access token.

  parameters:
    Handle:
      name: handle
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9_]{3,30}$' }
    InterestId:
      name: interestId
      in: path
      required: true
      schema: { type: string }
    PostId:
      name: postId
      in: path
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: >
        Opaque continuation token. Paging with this token preserves position
        (FR-035); offsets are deliberately not supported.
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }


    # ---------------------------------------------- feature 004
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string }
    PlaceId:
      name: placeId
      in: path
      required: true
      schema: { type: string }

  responses:
    Unauthorised:
      description: Missing or invalid credentials
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Request failed validation
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CannotAddParticipant:
      description: |
        A person cannot be added to this conversation (005/FR-023).

        THIS RESPONSE IS DELIBERATELY UNINFORMATIVE, and that is a requirement
        rather than an oversight. 005/FR-023a: it MUST NOT disclose that a block
        exists, who it involves, or which direction it runs. The obvious helpful
        version - "Sam has blocked you" - tells the person adding their friend
        something about a relationship between two OTHER people, neither of whom
        chose to share it, and turns adding somebody to a group into a way to
        probe who has blocked whom.

        Every reason a person cannot be added returns this same body. SC-012
        compares them as literal responses, because a message that differs only
        in wording leaks the block just as well as one that spells it out.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Rate limit exceeded (FR-046)
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }


    # ---------------------------------------------- feature 004
    NotFoundOpaque:
      description: >
        Not found. Deliberately identical for "does not exist", "you are not a participant",
        and "severed by a block", so that neither membership nor a block is disclosed
        (FR-006, and 001's error-distinction table).

  schemas:

    Problem:
      type: object
      description: RFC 9457 problem detail.
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    Visibility:
      type: string
      enum: [public, followers, private]
      description: FR-013 to FR-016. Defaults to public on creation.

    ProcessingState:
      type: string
      enum: [pending, processing, ready, failed]
      description: FR-009. Only `ready` posts are visible to anyone but the author.

    SelfProfile:
      type: object
      required: [userId, handle, displayName, notificationPrefs]
      properties:
        userId: { type: string }
        handle: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }
        bio: { type: string, nullable: true }
        followerCount: { type: integer }
        followingCount: { type: integer }
        interestFollowCount: { type: integer }
        notificationPrefs:
          type: object
          description: >
            FR-049 — one flag per category. `message` is added by 004/FR-031 for
            the conversations that feature introduces. Absent means on, so no
            backfill and no migration.
          properties:
            reaction: { type: boolean }
            comment: { type: boolean }
            follow: { type: boolean }
            message: { type: boolean }

    PublicProfile:
      type: object
      required: [userId, handle, displayName]
      properties:
        userId: { type: string }
        handle: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }
        bio: { type: string, nullable: true }
        followerCount: { type: integer }
        followingCount: { type: integer }
        topInterests:
          type: array
          description: FR-038 — the interests this person posts to most.
          items: { $ref: '#/components/schemas/InterestRef' }
        viewerIsFollowing: { type: boolean }

    ProfileUpdate:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 50 }
        bio: { type: string, maxLength: 300 }
        avatarUploadId: { type: string }
        notificationPrefs:
          type: object
          description: >
            Sent as a PARTIAL patch and merged server-side, so toggling one
            category cannot silently reset the others. `message` is 004/FR-031.
          properties:
            reaction: { type: boolean }
            comment: { type: boolean }
            follow: { type: boolean }
            message: { type: boolean }

    DeletionOutcome:
      type: object
      properties:
        postsScheduledForRemoval: { type: integer }
        commentsToBeAnonymised: { type: integer }
        purgeCompletesBy: { type: string, format: date-time }

    InterestRef:
      type: object
      required: [interestId, name, level]
      properties:
        interestId: { type: string }
        name: { type: string }
        slug: { type: string }
        level: { type: string, enum: [top, sub] }
        parent:
          description: Present for sub-interests, so search results disambiguate (FR-026).
          oneOf:
            - $ref: '#/components/schemas/InterestRef'
            - type: 'null'

    Interest:
      allOf:
        - $ref: '#/components/schemas/InterestRef'
        - type: object
          properties:
            description: { type: string, nullable: true }
            postCount: { type: integer }
            followerCount: { type: integer }
            state: { type: string, enum: [active, merging, merged, retired] }
            viewerIsFollowing: { type: boolean }

    InterestDetail:
      allOf:
        - $ref: '#/components/schemas/Interest'
        - type: object
          properties:
            subInterests:
              type: array
              description: Present for top-level interests only (FR-020, FR-025).
              items: { $ref: '#/components/schemas/Interest' }

    InterestCreate:
      type: object
      required: [name, parentId]
      properties:
        name: { type: string, minLength: 2, maxLength: 50 }
        parentId:
          type: string
          description: Must reference a top-level interest — the hierarchy is exactly two levels (FR-020).
        description: { type: string, maxLength: 500 }
        acknowledgedSimilarTo:
          type: array
          description: >
            Interest ids the caller was shown as near-duplicates and chose to create
            alongside anyway (FR-023). Recorded so SC-008 can distinguish an ignored
            warning from one that was never shown.
          items: { type: string }

    DuplicateInterestCandidates:
      type: object
      properties:
        candidates:
          type: array
          items:
            type: object
            properties:
              interest: { $ref: '#/components/schemas/Interest' }
              similarity: { type: number, minimum: 0, maximum: 1 }

    MediaItem:
      type: object
      required: [kind, processingState]
      properties:
        kind: { type: string, enum: [image, video] }
        processingState: { $ref: '#/components/schemas/ProcessingState' }
        width: { type: integer }
        height: { type: integer }
        durationMs: { type: integer, nullable: true }
        posterUrl: { type: string, nullable: true, description: 'Thumbnail shown before playback (FR-009).' }
        renditions:
          type: object
          additionalProperties: { type: string, format: uri }

    Post:
      type: object
      required: [postId, author, interests, visibility, processingState, createdAt]
      properties:
        postId: { type: string }
        author: { $ref: '#/components/schemas/PublicProfile' }
        caption: { type: string, nullable: true, maxLength: 2000 }
        interests:
          type: array
          minItems: 1
          description: FR-006 — never empty.
          items: { $ref: '#/components/schemas/InterestRef' }
        visibility: { $ref: '#/components/schemas/Visibility' }
        processingState: { $ref: '#/components/schemas/ProcessingState' }
        mediaKind: { type: string, enum: [images, video] }
        media:
          type: array
          items: { $ref: '#/components/schemas/MediaItem' }
        reactionCount: { type: integer }
        commentCount: { type: integer }
        viewerHasReacted: { type: boolean }
        place:
          description: >
            004/FR-023. The place the author attached, if any. NEVER derived from
            media metadata (FR-021).
          oneOf:
            - { $ref: '#/components/schemas/PlaceSummary' }
            - { type: 'null' }
        viewerHasSaved: { type: boolean, description: 004/FR-037 }
        createdAt: { type: string, format: date-time }

    PostCreate:
      type: object
      required: [uploadIds, interestIds]
      properties:
        uploadIds:
          type: array
          minItems: 1
          maxItems: 10
          description: >
            Ids from POST /media/uploads. One for video, up to ten for images.
            Quoting them rather than re-uploading is what allows retry without
            re-selecting media (FR-008).
          items: { type: string }
        interestIds:
          type: array
          minItems: 1
          description: FR-006 — publishing without an interest is rejected.
          items: { type: string }
        caption: { type: string, maxLength: 2000 }
        visibility:
          allOf: [{ $ref: '#/components/schemas/Visibility' }]
          default: public
        placeId:
          type: string
          nullable: true
          description: >
            004/FR-015. Optional — a post with no place behaves exactly as it did
            before (FR-024). The server MUST NOT populate or infer this from media
            metadata: 001/FR-010 strips embedded location and this discloses it on
            purpose, and the two must never meet (004/FR-021, Constitution III).
        keepLocationMetadata:
          type: boolean
          default: false
          description: >
            FR-010. Location is stripped server-side unless this is explicitly true.
            The client cannot bypass this by omitting the strip itself.

    PostUpdate:
      type: object
      description: FR-011, FR-017. Any subset; changes apply everywhere immediately.
      properties:
        caption: { type: string, maxLength: 2000 }
        interestIds:
          type: array
          minItems: 1
          items: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        placeId:
          type: string
          nullable: true
          description: >
            004/FR-015. Setting it to null removes the attachment. The place index
            item is written, moved or deleted in the SAME transaction that carries
            the post item and its interest index items.

    UploadRequest:
      type: object
      required: [kind, contentType, sizeBytes]
      properties:
        kind: { type: string, enum: [image, video, avatar] }
        contentType: { type: string }
        sizeBytes: { type: integer }
        durationMs:
          type: integer
          description: Required for video, so the duration cap is checked before upload (FR-005).

    UploadTarget:
      type: object
      required: [uploadId, url, method, expiresAt]
      properties:
        uploadId: { type: string }
        url: { type: string, format: uri }
        method: { type: string, enum: [PUT, POST] }
        headers:
          type: object
          additionalProperties: { type: string }
        expiresAt: { type: string, format: date-time }

    ReactionState:
      type: object
      properties:
        viewerHasReacted: { type: boolean }
        reactionCount: { type: integer }

    Comment:
      type: object
      required: [commentId, author, body, createdAt]
      properties:
        commentId: { type: string }
        author: { $ref: '#/components/schemas/PublicProfile' }
        body: { type: string, minLength: 1, maxLength: 1000 }
        createdAt: { type: string, format: date-time }

    CommentCreate:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 1000 }

    ShareLink:
      type: object
      properties:
        url: { type: string, format: uri }
        visibility:
          allOf: [{ $ref: '#/components/schemas/Visibility' }]
          description: >
            Echoed so the client can warn that a followers-only link will not open for
            everyone (FR-042).

    ReportCreate:
      type: object
      required: [subjectType, subjectId, reason]
      properties:
        subjectType: { type: string, enum: [post, comment, interest] }
        subjectId: { type: string }
        reason:
          type: string
          enum: [spam, harassment, explicit, violence, misinformation, other]
        detail: { type: string, maxLength: 1000 }

    Report:
      type: object
      properties:
        reportId: { type: string }
        subjectType: { type: string, enum: [post, comment, interest] }
        subjectId: { type: string }
        reason: { type: string }
        state: { type: string, enum: [open, under_review, actioned, dismissed] }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
        outcome: { type: string, nullable: true }

    ModerationDecision:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [under_review, actioned, dismissed] }
        action: { type: string, enum: [remove_content, rename_interest, retire_interest, no_action] }
        note: { type: string, maxLength: 1000 }

    InterestAdminAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [reparent, merge, retire] }
        newParentId: { type: string, description: 'For reparent.' }
        mergeIntoId: { type: string, description: 'For merge — posts and followers move here.' }

    InterestJob:
      type: object
      properties:
        jobId: { type: string }
        action: { type: string }
        state: { type: string, enum: [queued, running, complete, failed] }
        itemsProcessed: { type: integer }
        itemsTotal: { type: integer }

    Notification:
      type: object
      properties:
        notificationId: { type: string }
        kind: { type: string, enum: [reaction, comment, follow] }
        actor: { $ref: '#/components/schemas/PublicProfile' }
        postId: { type: string, nullable: true }
        postThumbUrl:
          type: string
          nullable: true
          description: >
            007/T053 — the thumbnail `Activity.dc.html` shows beside a post row.
            A presigned GET url, issued only after `VisibilityFilter` has decided
            this viewer may open the post. Null for a follow notification, for a
            post whose media is not ready, and for a video with no poster frame.
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true }

    PageMeta:
      type: object
      properties:
        nextCursor: { type: string, nullable: true }
        emptyStateHint:
          type: string
          nullable: true
          description: >
            FR-036 — which empty state to show, e.g. `no_followed_interests`,
            `interest_has_no_posts`.

    PostPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Post' }
        page: { $ref: '#/components/schemas/PageMeta' }

    SignalBatch:
      type: object
      required: [signals]
      properties:
        signals:
          type: array
          maxItems: 50
          description: >
            Bounded, and an over-long batch is REJECTED rather than truncated —
            truncation would make a client's over-sending look like success.
          items: { $ref: '#/components/schemas/Signal' }

    Signal:
      type: object
      required: [kind, postId]
      properties:
        kind:
          type: string
          enum: [open, dwell, like, save]
          description: >
            What happened. `open` is the weakest and `save` the strongest, because a
            save is the one a person takes deliberately and for their own benefit.
        postId: { type: string }
        dwellMs:
          type: integer
          minimum: 0
          description: >
            Only meaningful with `kind: dwell`. Clamped server-side to 30000 and
            DISCARDED below 3000 — an uncapped dwell measures a phone left on a table,
            and a below-floor one is data collected for no ranking benefit.

    SignalReceipt:
      type: object
      required: [accepted, rejected]
      properties:
        accepted: { type: integer }
        rejected:
          type: integer
          description: >
            Deliberately not itemised. A per-signal reason would tell a caller which
            postIds exist and which they may not see, which is the question the
            visibility check is answering.

    FeedSignalDisclosure:
      type: object
      required: [interests, seedInterests, collected]
      properties:
        interests:
          type: array
          description: The caller's strongest interests, decayed, strongest first.
          items:
            type: object
            required: [interestId, name, weight]
            properties:
              interestId: { type: string }
              name: { type: string }
              weight: { type: number }
        seedInterests:
          type: array
          items: { type: string }
        collected:
          type: array
          description: What kinds of behaviour are recorded, in the person's own terms.
          items: { type: string }

    InterestPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Interest' }
        page: { $ref: '#/components/schemas/PageMeta' }

    CommentPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Comment' }
        page: { $ref: '#/components/schemas/PageMeta' }

    ReportPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Report' }
        page: { $ref: '#/components/schemas/PageMeta' }

    NotificationPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        page:
          allOf:
            - $ref: '#/components/schemas/PageMeta'
            - type: object
              properties:
                unreadCount:
                  type: integer
                  minimum: 0
                  description: >
                    008/FR-006. Notifications newer than the caller's read
                    watermark, over the WHOLE partition rather than this page - a
                    badge that changed as you scrolled would be reporting the
                    request rather than the person's notifications.

                    DERIVED, never stored. A stored counter and the rows it
                    counts are two sources of truth for one fact.
                unreadCapped:
                  type: boolean
                  description: >
                    True when the real number exceeds the server's counting
                    bound, so `unreadCount` is a floor. Present so a client can
                    render "50+" from what the server said rather than inventing
                    a threshold of its own.


    # ---------------------------------------------- feature 004

    PlaceCategory:
      type: string
      enum: [restaurant, cafe, bar, shop, venue, outdoor, other]

    PlaceSummary:
      type: object
      required: [placeId, name, category, locality]
      properties:
        placeId: { type: string }
        name: { type: string }
        category: { $ref: '#/components/schemas/PlaceCategory' }
        locality: { type: string }
        postCount: { type: integer }

    Place:
      allOf:
        - $ref: '#/components/schemas/PlaceSummary'
        - type: object
          properties:
            address: { type: string, nullable: true }
            status: { type: string, enum: [active, merged, retired] }
            mergedIntoPlaceId: { type: string, nullable: true }
            followerCount: { type: integer }
            viewerIsFollowing: { type: boolean }
            interests:
              type: array
              description: The interests this place's posts are filed under. Derived, not authored.
              items:
                type: object
                properties:
                  interestId: { type: string }
                  name: { type: string }

    ConversationSummary:
      type: object
      # 005: `other` leaves `required`. A group has no single other person, and a
      # required-but-null field is a contradiction a generated client cannot model.
      required: [conversationId, state, lastMessageAt, unreadCount]
      properties:
        conversationId: { type: string }
        other:
          allOf: [{ $ref: '#/components/schemas/PublicProfile' }]
          nullable: true
          description: |
            The other participant, for a PAIR conversation. Null for a group.
            Kept populated on every pair conversation so a client built against
            the 004 contract still finds what it expects (005/FR-026).
        state:
          type: string
          # 005: `left` describes a PARTICIPATION, not a conversation. One person
          # leaving a group of four does not put the conversation in a state.
          enum: [requested, accepted, declined, severed, left]
        lastMessageAt: { type: string, format: date-time }
        lastMessagePreview: { type: string, nullable: true, maxLength: 140 }
        unreadCount: { type: integer }
        kind:
          type: string
          enum: [pair, group]
          description: |
            005/R1. Explicit, not inferred from participant count: the two kinds
            derive their ids differently, so a length check would be a second way
            to answer a question the id scheme already answers.
        name:
          type: string
          nullable: true
          maxLength: 60
          description: 005/FR-024. User-generated content - reportable, moderatable.

    ConversationParticipant:
      type: object
      required: [person, state, joinedAt]
      properties:
        person: { $ref: '#/components/schemas/PublicProfile' }
        state:
          type: string
          enum: [requested, accepted, declined, severed, left]
          description: |
            PER PARTICIPANT, not per conversation (005/R2). A group has no single
            state: Alice accepted, Bob has not looked, Jo declined.
        joinedAt: { type: string, format: date-time }
        leftAt: { type: string, format: date-time, nullable: true }

    Conversation:
      allOf:
        - $ref: '#/components/schemas/ConversationSummary'
        - type: object
          properties:
            viewerCanSend: { type: boolean, description: Decided by ConversationAccess, never by the client }
            initiatedByViewer: { type: boolean }
            participants:
              type: array
              maxItems: 20
              description: |
                005/FR-025. Membership is STORED, never derived from the id. The
                cap of 20 is a transactional limit, not a preference: a membership
                change writes one row per participant in a single transaction, and
                DynamoDB caps that at 100 items (research R3).
              items: { $ref: '#/components/schemas/ConversationParticipant' }

    GroupCreate:
      type: object
      required: [participantHandles]
      properties:
        participantHandles:
          type: array
          # 1 is allowed and is NOT an error: FR-027 routes a "group" of two to the
          # existing pair conversation rather than creating a parallel one. The
          # response's `kind` says which happened.
          minItems: 1
          maxItems: 19
          items: { type: string }
        name: { type: string, nullable: true, maxLength: 60 }

    RatingWrite:
      type: object
      required: [score]
      properties:
        score: { type: integer, minimum: 1, maximum: 5 }
        body:
          type: string
          maxLength: 2000
          nullable: true
          description: 005/FR-009. Optional - a rating without text is complete.

    PlaceRatingSummary:
      type: object
      required: [average, count]
      properties:
        average:
          type: number
          nullable: true
          minimum: 1
          maximum: 5
          description: |
            005/FR-005. NULL when count is 0, never 0. "Nobody has rated this" and
            "rated badly" are different facts, and 0 is not a legal score - a zero
            here is a value every client would have to know to special-case.
        count: { type: integer, minimum: 0 }

    Review:
      type: object
      required: [placeId, author, score, body, createdAt, updatedAt]
      properties:
        placeId: { type: string }
        author:
          allOf: [{ $ref: '#/components/schemas/PublicProfile' }]
          description: |
            A HYDRATED profile, not an id. Six surfaces in this codebase shipped
            returning raw candidate rows because nothing asserted the response
            shape; response-shape.spec.ts checks reviews against this.
        score: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string, nullable: true, maxLength: 2000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RatingWithSummary:
      type: object
      required: [rating, summary]
      properties:
        rating: { $ref: '#/components/schemas/Review' }
        summary: { $ref: '#/components/schemas/PlaceRatingSummary' }

    ReviewPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        page: { $ref: '#/components/schemas/PageMeta' }

    Message:
      type: object
      required: [messageId, authorId, createdAt]
      properties:
        messageId: { type: string }
        authorId: { type: string }
        body: { type: string, nullable: true, maxLength: 2000 }
        createdAt: { type: string, format: date-time }
        moderationState: { type: string, enum: [visible, removed] }
        sharedPostId: { type: string, nullable: true }
        sharedPost:
          description: >
            Resolved per reader through the post visibility boundary. Null when the reader
            may not see it — the message is still returned.
          oneOf:
            - { $ref: '#/components/schemas/Post' }
            - { type: 'null' }
        sharedPostUnavailableReason:
          type: string
          nullable: true
          enum: [gone, not-for-you]
          description: Mirrors 001's share-link error distinction (FR-042).

    NotificationPreferences:
      type: object
      description: >
        Absent is on. `reaction`, `comment` and `follow` ship in 001; `message` is added by
        004/FR-031.
      properties:
        reaction: { type: boolean }
        comment: { type: boolean }
        follow: { type: boolean }
        message: { type: boolean }
