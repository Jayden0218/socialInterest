# J-09 report, and J-10 block.
#
# Both live behind the same screen. Block only renders when the author's handle
# reached SafetyActions (FR-044), so this flow failing on the Block control is a
# real defect, not a missing fixture.
appId: app.socialinterest
---
- runFlow: 04-publish-image.yaml

# The post is opened from the author's own profile, not the home feed. The feed
# is composed only from FOLLOWED interests (FR-032), and compose offers
# suggested ones - so a freshly published post is correctly absent from its own
# author's feed. 04-publish-image leaves the app on this tab already.
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible:
      id: "post-.*"
    timeout: 30000
- tapOn:
    id: "post-.*"
- tapOn:
    id: "open-safety"
- assertVisible:
    id: "report-reasons"
- tapOn:
    id: "report-reason-0"
- tapOn:
    id: "submit-report"
- assertVisible:
    id: "block-person"
