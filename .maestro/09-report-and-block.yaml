# J-09 report a post.
#
# TWO things were wrong with this flow, and run 24 exposed both once everything
# ahead of it started passing.
#
# 1. It reported the person's OWN post, published moments earlier by
#    04-publish-image. Reporting yourself is not the journey; FR-044 is about
#    someone else's content. It now uses the post the FR-033 fixture publishes
#    from a second person, which is in this person's feed because the fixture
#    also makes them follow that interest - the same mechanism
#    12-interest-follow-does-not-widen relies on.
#
# 2. It asserted `block-person` AFTER submitting the report. Submitting calls
#    `onReport`, which is `report(...).then(onDone)` - the sheet closes. The
#    control was never missing; the flow was looking for it on a screen that had
#    already dismissed. Both controls live on the sheet together, so the block
#    affordance is asserted while the sheet is open.
#
# J-10 (actually blocking) is deliberately NOT driven here. A block severs
# follows and hides content for every later flow in the same suite, and
# 12-interest-follow-does-not-widen depends on that exact author remaining
# visible. Blocking is covered over HTTP by apps/e2e's N-03, which asserts a
# blocked person's post is absent from every surface. The Journey Run records
# J-10 as `not run` on device with this reason rather than implying it passed.
appId: app.socialinterest
---
- runFlow: 01-sign-in.yaml
- tapOn:
    id: "tab-feed"
- assertVisible:
    id: "home-feed-screen"

# Someone else's post, seeded by the fixture.
- extendedWaitUntil:
    visible: "${PRESENT}"
    timeout: 30000
- tapOn: "${PRESENT}"

- tapOn:
    id: "open-safety"
- assertVisible:
    id: "report-reasons"

# The block affordance is reachable from the same sheet (FR-044). Asserted
# here, while the sheet is open, because sending the report closes it.
#
# SCROLLED TO, because it is below the fold on a short screen and a person would
# scroll too. Run 35 failed exactly here: the sheet was a non-scrolling View, so
# `block-person` sat at 665px on a 640px screen and was not merely off-screen -
# it was UNREACHABLE, a safety control (Constitution IV) with no way to get to
# it. `Screen scroll` fixes that; this scrolls the way a person does.
# THE REASON IS CHOSEN FIRST, and the order is the fix for run 53.
#
# Measured at the emulator's own 320x616: `report-reason-0` ends at y=164 and
# `block-person` starts at y=852 — 688 points apart on a 616-point screen, so
# they CANNOT both be on screen. Scrolling down to the block control therefore
# takes the reason off the top, and the tap that followed found nothing.
#
# Choosing the reason first costs nothing and needs no scroll; the block
# assertion then happens where a person would meet it.
- tapOn:
    id: "report-reason-0"

- scrollUntilVisible:
    element:
      id: "block-person"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "block-person"

- tapOn:
    id: "submit-report"

# The report was accepted and the sheet dismissed - which is the app's own
# signal that the request returned, since onReport only calls onDone on success.
- extendedWaitUntil:
    notVisible:
      id: "report-reasons"
    timeout: 30000
