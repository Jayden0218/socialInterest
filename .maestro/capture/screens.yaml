# THE APP, PHOTOGRAPHED ON A DEVICE.
#
# `docs/screens/*.png` are react-native-web in a headless browser: the same React
# components rendered through DOM primitives. They are honest about layout and
# colour and say NOTHING about native fonts, safe areas, or the soft keyboard -
# which is exactly the class of thing that cost runs 38-42.
#
# So this walks the app on the emulator and photographs it. It is NOT a journey:
# it asserts nothing beyond being able to reach each screen, and it lives in
# `.maestro/capture/` so the runner's `find -maxdepth 1` does not pick it up as
# one. The journeys decide whether the product works; this only shows what it
# looks like while doing it.
#
# Screens are numbered to match `docs/screens/` where the same screen exists in
# both, so the browser and the device can be put side by side.
appId: app.socialinterest
---
- launchApp:
    clearState: true
- assertVisible:
    id: "app-root"
- takeScreenshot: 01-launch

- tapOn:
    id: "open-sign-in"
- assertVisible:
    id: "sign-in-screen"
- takeScreenshot: 02-sign-in

# With the keyboard UP, which is the state no browser can show and the one that
# cost four runs. Captured before submitting, so the fold is real.
- tapOn:
    id: "sign-in-token"
- inputText: ${TOKEN}
- takeScreenshot: 03-sign-in-keyboard-up

- hideKeyboard
- tapOn:
    id: "sign-in-submit"

# The cold start is a PUSHED screen with no tab bar (007/FR-014).
- runFlow:
    when:
      visible:
        id: "pick-interests-screen"
    commands:
      - takeScreenshot: 04-cold-start
      - tapOn:
          id: "pick-skip"

- tapOn:
    id: "tab-feed"
- assertVisible:
    id: "home-feed-screen"
- takeScreenshot: 05-home-feed

- tapOn:
    id: "tab-discover"
- takeScreenshot: 06-explore

- tapOn:
    id: "tab-chats"
- assertVisible:
    id: "inbox-screen"
- takeScreenshot: 07-chats

- tapOn:
    id: "tab-notifications"
- takeScreenshot: 08-activity

- tapOn:
    id: "tab-profile"
- takeScreenshot: 09-profile

# EVERY STEP FROM HERE IS CONDITIONAL, and run 45 is why.
#
# The flow reached screenshot 10 and then died on `tapOn: tab-profile` after a
# `back` - "Element not found". Ten images existed and the run collected none,
# because a hard tap that misses ENDS the capture.
#
# A capture is evidence, not an assertion. The journeys decide whether
# navigation works and they already passed; this file's only job is to
# photograph what it can reach. So each remaining screen is guarded by the
# control that opens it, and a missing one costs that screen and nothing else.
- runFlow:
    when:
      visible:
        id: "open-edit-profile"
    commands:
      - tapOn:
          id: "open-edit-profile"
      - assertVisible:
          id: "edit-profile-screen"
      - takeScreenshot: 10-edit-profile
      - back

- runFlow:
    when:
      visible:
        id: "open-saved"
    commands:
      - tapOn:
          id: "open-saved"
      - takeScreenshot: 11-saved
      - back

# The waterfall card, opened. The feed is 007's whole subject.
- runFlow:
    when:
      visible:
        id: "tab-feed"
    commands:
      - tapOn:
          id: "tab-feed"

- runFlow:
    when:
      visible:
# A POST ID IS A ULID, and saying so is what makes this selector unambiguous.
#
# `post-.*` also matched `post-caption`, `post-detail-screen`, `post-media` and
# `post-image` — literals that are simply not mounted on this screen, so it
# worked by luck rather than by meaning. Run 50 lost a flow to the same shape
# where the luck ran out (`share-person-.*` matched the search field beside the
# results), and `verify-maestro-ids` now fails on any pattern that can reach a
# declared literal.
        id: "post-[0-9A-Z]{26}"
    commands:
      - tapOn:
          id: "post-[0-9A-Z]{26}"
      - takeScreenshot: 12-post-detail
      - back

- runFlow:
    when:
      visible:
        id: "open-compose"
    commands:
      - tapOn:
          id: "open-compose"
      - takeScreenshot: 13-compose-or-picker

# ---------------------------------------------------------------------------
# 008 Phases D and E — T222.
#
# Guarded by `when: visible` like every capture above, for the reason the file
# already records: this runs at the END of a 25-minute run, and a screenshot
# step that can FAIL turns a documentation nicety into a lost run. A screen that
# is not reachable in this session is simply not captured.
#
# Back out of compose first — 13 left the app on the picker, and a pushed screen
# has no tab bar (005/J-21).
- back

# The privacy toggle and the follow-request queue (US13), and the way to
# "what was removed of mine" (US14) — all in Edit profile.
- runFlow:
    when:
      visible:
        id: "tab-profile"
    commands:
      - tapOn:
          id: "tab-profile"
      - runFlow:
          when:
            visible:
              id: "open-edit-profile"
          commands:
            - tapOn:
                id: "open-edit-profile"
            - runFlow:
                when:
                  visible:
                    id: "account-privacy"
                commands:
                  - takeScreenshot: 14-account-privacy
            - runFlow:
                when:
                  visible:
                    id: "open-moderation-notices"
                commands:
                  - tapOn:
                      id: "open-moderation-notices"
                  - takeScreenshot: 15-moderation-notices
                  - back
            - back

# The shelves (US15). Saved is where they live, and "All" is not a collection —
# the screenshot is the product saying so.
- runFlow:
    when:
      visible:
        id: "open-saved"
    commands:
      - tapOn:
          id: "open-saved"
      - runFlow:
          when:
            visible:
              id: "collection-filter"
          commands:
            - takeScreenshot: 16-saved-collections
      - back
