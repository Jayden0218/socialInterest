# 004/US4 -> 001/SC-011. A video plays on a real device.
#
# 001/FR-005 and FR-009 have been reported complete twice against a journey that
# never uploaded a byte. The service path is now exercised over HTTP; what only
# a device can show is that the poster frame RENDERS and playback starts.
#
# The video comes from the app's bundled sample, the same way the image flow
# works: an emulator has no camera roll video, and driving the system picker is
# a different journey (see 10-publish-from-library.yaml).
appId: app.socialinterest
---
- runFlow: 01-sign-in.yaml
- tapOn:
    id: "open-compose"
- assertVisible:
    id: "media-picker-screen"

# The video item, not the image. If the picker offers no video the flow fails
# here as a missing element - which is the honest outcome, because there is then
# nothing on the device to publish.
- tapOn:
    id: "media-item-video-1"
- tapOn:
    id: "media-continue"
- assertVisible:
    id: "compose-screen"
- tapOn:
    id: "interest-option-0"
- tapOn:
    id: "caption-input"
- inputText: "a video from a real device"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "publish-button"
    direction: DOWN
- extendedWaitUntil:
    visible: "Uploaded"
    timeout: 120000
- tapOn:
    id: "publish-button"

- tapOn:
    id: "tab-profile"
# The post has to EXIST before it can be scrolled to, and a transcode takes a
# while - so wait on the card, then scroll to the caption.
- extendedWaitUntil:
    visible:
      id: "post-.*"
    timeout: 120000
# SCROLLED TO. 007's profile header is the approved design - avatar, three
# stats, name, bio, actions, the Posts/Saved strip - and it measures 327 points
# before the list starts. At 390x844, where the artboards are drawn, the first
# card's caption is on screen; at the emulator's 320x640 it sits at y=659, just
# past the fold. A profile is a scrolling list, so the flow scrolls.
- scrollUntilVisible:
    element:
      text: "a video from a real device"
    direction: DOWN
- tapOn: "a video from a real device"

# FR-009. The POSTER, before playback - not an empty rectangle. This is the
# assertion the requirement is actually about.
- extendedWaitUntil:
    visible:
      id: "video-poster"
    timeout: 120000
