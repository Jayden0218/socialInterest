# J-04b / 003/US4: the compose flow hands off to the device's own media library.
#
# WHAT THIS ASSERTS, AND WHAT IT DELIBERATELY DOES NOT.
#
# It asserts the part that is this product's responsibility: choosing "from your
# photos" opens the device's library. It does NOT drive that library's UI.
#
# Run 16 established why. The screen the app hands off to is
# `com.android.documentsui` - Android's own file picker - and it showed
# "No items" under RECENT FILES. The test image IS in MediaStore (the device
# pass asserts that after its media-scan broadcast), but DocumentsUI's Recent
# view does not surface adb-pushed files; reaching it would mean tapping through
# Google's own navigation. A journey that drives another app's UI breaks when
# Google changes it, for reasons that say nothing about socialInterest - which
# is the same reasoning sampleMedia.ts was written with in the first place.
#
# So: the hand-off is verified here, and publishing itself is verified by
# 04-publish-image, which uses the fallback media and asserts the post is
# readable in the feed. Neither covers "an image chosen from a populated gallery
# publishes"; the Journey Run records that as not run rather than implying it.
appId: app.socialinterest
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- assertVisible:
    id: "app-root"
- tapOn:
    id: "open-sign-in"
- tapOn:
    id: "sign-in-token"
- inputText: ${TOKEN}
- tapOn:
    id: "sign-in-submit"
- assertNotVisible:
    id: "open-sign-in"

- tapOn:
    id: "open-compose"
- assertVisible:
    id: "media-picker-screen"
- tapOn:
    id: "open-library"

# The device's own library opened. That is the hand-off, and it is the claim.
- extendedWaitUntil:
    visible:
      id: "com.android.documentsui:id/dir_list"
    timeout: 20000

# Come back, and the app must still be usable rather than stranded.
- pressKey: Back
- assertVisible:
    id: "media-picker-screen"
