# FR-033 / constitution Principle I (NON-NEGOTIABLE).
#
# Following a PERSON must never widen the feed beyond followed interests. The
# requirement is only visible as an absence, so this asserts both halves: the
# post in a followed interest IS there, and the same author's post in an
# unfollowed interest is NOT. Asserting only the absence would pass against a
# feed that failed to load.
#
# The person-follow happens HERE, by tapping Follow, not in the fixture. Until
# 003/T053 that was impossible - ProfileContainer only ever loaded your own
# profile and its follow button was a no-op - so the fixture had to establish
# the precondition server-side. Doing it through the app is the stronger claim:
# the requirement is about what happens after a person follows someone.
#
# The fixture (apps/e2e/scripts/seed-fr033-fixture.ts) still supplies what one
# device cannot: a second person, their two posts, and the interest follow.
appId: app.socialinterest
---
- runFlow: 01-sign-in.yaml
- tapOn:
    id: "tab-feed"
- assertVisible:
    id: "home-feed-screen"

# The author's post in an interest this person follows. Reaching their profile
# from it is the only route to another person in the app.
- assertVisible: "${PRESENT}"
- tapOn: "${PRESENT}"
- tapOn:
    id: "open-author"
- assertVisible:
    id: "follow-person-toggle"

# Follow, and confirm the SERVER agreed: the control reads back from
# GET /people/{handle}, so "Following" here means the follow was accepted
# rather than that a local flag was flipped.
- tapOn:
    id: "follow-person-toggle"
- assertVisible: "Following"

- tapOn:
    id: "nav-back"
- tapOn:
    id: "nav-back"
- tapOn:
    id: "tab-feed"
- assertVisible:
    id: "home-feed-screen"

# The feed loaded and still contains what it should.
- assertVisible: "${PRESENT}"

# The requirement. This is the assertion the whole flow exists for.
- assertNotVisible: "${ABSENT}"

# And still absent after scrolling: "not on the first screen" is not the same
# as "not in the feed", and a paged feed could put it lower down.
- scroll
- scroll
- assertNotVisible: "${ABSENT}"
