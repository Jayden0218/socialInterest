# 008/US13, T190 — A PRIVATE ACCOUNT, AND THE HALF THAT ANSWERS IT.
#
# WHAT TO READ IN THE RUN AGGREGATE:
#   PATCH /v1/me                          200   (the toggle reached the server)
#   GET   /v1/me/follow-requests          200   (the queue is loaded, not faked)
#   PUT   /v1/me/follow-requests/:handle  204   (a request approved)
#
# The privacy toggle alone would be the exact defect this feature exists to end:
# a control that works and a queue nobody can answer. So this flow drives BOTH,
# and the approve is the line that matters — it is absent from any run where the
# list rendered and its buttons did nothing.
#
# The requester is established server-side by `seed-follow-request-fixture`,
# because the flow drives ONE device and a follow request needs two people. Same
# reason `21-group-chat` seeds its members.
appId: app.socialinterest
---
- runFlow: 01-sign-in.yaml

- tapOn:
    id: "tab-profile"
- assertVisible:
    id: "open-edit-profile"
- tapOn:
    id: "open-edit-profile"
- assertVisible:
    id: "edit-profile-screen"

# SCROLLED TO, because it is BELOW THE FOLD and `assertVisible` does not scroll.
#
# Measured at the emulator's own 320x616: `account-privacy` sits at y=667, and
# `open-moderation-notices` (flow 35) at y=967. Edit profile scrolls on a
# measurement (007/T051) and its primary action, Save, is in the header at
# y=80 — so a control down here is correct product behaviour and the FLOW is
# what has to move. 18-notification-settings gets away with a bare assert only
# because `notification-prefs` starts at y=481.
- scrollUntilVisible:
    element:
      id: "account-privacy"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "account-privacy"
- assertVisible:
    id: "account-privacy-explainer"
- tapOn:
    id: "account-privacy-switch"

# BACK UP TO SAVE, because `Screen scroll` wraps EVERYTHING — the header row
# included (`primitives.tsx`, the `scroll` branch returns one ScrollView around
# all children). So scrolling down to `account-privacy` at y=667 takes
# `save-profile` from y=80 to roughly -220, and run 54 reported it as "Element
# not found" rather than as off screen.
#
# This is the half of run 53's fix I got wrong: I scrolled to reach the control
# and did not ask what the scroll had moved away from.
- scrollUntilVisible:
    element:
      id: "save-profile"
    direction: UP
    timeout: 20000
- tapOn:
    id: "save-profile"

# Back in, because Save returns to the profile. The queue is read from the
# server on mount, so this second visit is what proves the list is not local.
- assertVisible:
    id: "open-edit-profile"
- tapOn:
    id: "open-edit-profile"
- scrollUntilVisible:
    element:
      id: "follow-requests"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "follow-request-${FOLLOW_REQUESTER}"
- tapOn:
    id: "approve-follow-request-${FOLLOW_REQUESTER}"

# The row goes because the list is RE-READ after the approval, not spliced out
# locally — so this assertion fails if the client only pretended.
- extendedWaitUntil:
    notVisible:
      id: "follow-request-${FOLLOW_REQUESTER}"
    timeout: 30000

- assertNotVisible:
    id: "load-error"
