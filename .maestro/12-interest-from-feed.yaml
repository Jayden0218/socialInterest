# 007/FR-017, FR-024 and plan gate G2 — THE INTEREST SPACE, FROM A FEED CARD.
#
# REPLACES the FR-033 flow. That one asserted a followed person's post in an
# UNfollowed interest must not reach the feed; 007 withdrew the requirement
# (RS-001) and there is no such boundary to assert. Rewriting it to "the post is
# still there" would have been a flow that passes against anything.
#
# What is worth a device's twenty minutes is what only a device can answer: that
# the coloured word on a card is actually TAPPABLE at the size the design draws
# it. It is 11.5 points of text with a `hitSlop` rather than a 44pt box, because
# a 44pt box cost 43 points on every card in the feed (SC-008) — so whether the
# target is real is a question about touch, not about layout, and the browser
# journeys cannot settle it.
#
# Principle I after 007: the feed no longer reads the interest graph, so the
# taxonomy is load-bearing only if a person can still get to it. A ranked feed
# that strands the taxonomy leaves it vestigial, which is the exact failure the
# principle names.
appId: app.socialinterest
---
- runFlow: 01-sign-in.yaml
- tapOn:
    id: "tab-feed"
- assertVisible:
    id: "home-feed-screen"

# The fixture's post, by its caption. Seeded server-side because one device
# cannot be two people, and in an interest this person has declared so it is on
# the page for a reason rather than by an exploration draw.
#
# SCROLLED TO, not asserted where it happens to land — run 53's failure.
# THE FEED IS RANKED AND EXPLORATION RE-SAMPLES PER CALL, so "this post is in
# the first screenful of one draw" is not a property the product offers and a
# bare `assertVisible` was asking for it. What the flow actually needs is that
# the post is REACHABLE on the feed, which is what a person would do about it.
# 09-report-and-block reaches the same post with a re-polling wait and passed
# where this failed, in the same run.
# WAIT FIRST, THEN SCROLL. Run 54's scroll-only version failed the same way
# run 53's bare assert did, and the reason is visible in the same run:
# `09-report-and-block` reaches THIS EXACT POST with a re-polling
# `extendedWaitUntil` and passed. A scroll that begins before the feed has
# loaded scrolls an empty list and then asserts against it.
- extendedWaitUntil:
    visible: "${PRESENT}"
    timeout: 30000
- assertVisible: "${PRESENT}"

# THE ASSERTION THIS FLOW EXISTS FOR. The interest, as a word, on the card.
- tapOn: "${INTEREST}"
- assertVisible:
    id: "interest-screen"

# And it is THAT interest's space, holding that post - not merely a screen that
# opened. A route to the wrong interest looks identical without this.
- assertVisible: "${INTEREST}"

# SCROLLED TO, and this is run 55's failure. The interest space is ordered by
# RECENCY, and this account publishes into the same interest in `04` and `10`
# before this flow runs — so the fixture's post is third by the time anybody
# looks at it. Measured at the emulator's own 320x616: the two newer cards put
# it at y=1082 with its caption at y=1382, four hundred and sixty-six points
# below a 616-point fold, and `assertVisible` does not scroll.
#
# The bound is not asserted, because it is not a property: one more post before
# this flow moves it again. What is a property is that the post is REACHABLE in
# its interest's space, which is what a person would do about it and what
# Principle I actually promises.
- scrollUntilVisible:
    element:
      text: "${PRESENT}"
    direction: DOWN
    timeout: 30000
