# 008/US12, T174 — LESS OF THIS, WITHOUT BLOCKING.
#
# WHAT TO READ IN THE RUN AGGREGATE:
#   PUT /v1/people/:handle/mute   204
#   PUT /v1/posts/:postId/dismiss 204
# Neither leaves a trace on any screen — that is the requirement (FR-040), so
# the aggregate is the ONLY place either can be observed. A mute control that
# set a local flag would satisfy everything visible here.
#
# The safety sheet is reached the way `09-report-and-block` reaches it, and the
# two quieter options sit ABOVE Block: somebody who wants less of a person
# should meet mute before they meet the irreversible thing.
appId: app.socialinterest
---
- runFlow: 01-sign-in.yaml

# THE SEEDED POST, BY ITS CAPTION — the way `09` reaches it, not "whichever
# card ranks first". Two reasons, and the second is a defect this flow carried
# through three runs: `mute-person` is rendered only when the sheet is given an
# author to mute, so an arbitrary first card that happens to be THIS account's
# own post offers no such control. The fixture's post is somebody else's by
# construction.
- tapOn:
    id: "tab-feed"
- extendedWaitUntil:
    visible: "${PRESENT}"
    timeout: 60000
- tapOn: "${PRESENT}"

# WAITED FOR, not asserted. `PostDetailContainer` renders `post-loading` until
# `GET /v1/posts/:postId` returns (screens/index.tsx), so a bare `assertVisible`
# races a network round trip on a device. Failed this way in runs 53 and 54;
# every other flow that opens post detail either waits or arrives via a screen
# that has already fetched.
- extendedWaitUntil:
    visible:
      id: "post-detail-screen"
    timeout: 30000
- tapOn:
    id: "open-safety"

# 012/T034. THE SHEET, NOT THE SAFETY SCREEN — and this whole flow got shorter.
#
# `open-safety` used to push a full screen whose report reasons came FIRST and
# whose dismiss and mute sat below them; that screen is why this flow had to
# scroll, why run 57 failed on `mute-person` sixty points past the fold, and why
# it had to walk back out to post detail between the two actions.
#
# Both are rows in a sheet now, above the report, per `PostActions.dc.html`. The
# sheet closes on tap, so the second action starts from post detail without a
# round trip — and nothing is below any fold, which is the point of a sheet.
- assertVisible:
    id: "post-actions"

# FR-041. The post stops being chosen; it still opens from a link, which is what
# makes this selection rather than the boundary.
- assertVisible:
    id: "sheet-dismiss"
- tapOn:
    id: "sheet-dismiss"

# The sheet closed itself, so this is post detail again with no navigation.
- extendedWaitUntil:
    visible:
      id: "post-detail-screen"
    timeout: 30000
- tapOn:
    id: "open-safety"
- assertVisible:
    id: "post-actions"

# 008/FR-040. NO SCROLL, which is the measured change. At the emulator's own
# 320x616 the old screen put `mute-person` at y=676 — past the fold, and run
# 57's failure exactly. A sheet is anchored to the bottom and holds five rows,
# so every one of them is on screen by construction.
- assertVisible:
    id: "sheet-mute"
- tapOn:
    id: "sheet-mute"

- assertNotVisible:
    id: "load-error"
