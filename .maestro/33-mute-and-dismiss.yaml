# 008/US12, T174 — LESS OF THIS, WITHOUT BLOCKING.
#
# WHAT TO READ IN THE RUN AGGREGATE:
#   PUT /v1/people/:handle/mute   204
#   PUT /v1/posts/:postId/dismiss 204
# Neither leaves a trace on any screen — that is the requirement (FR-040), so
# the aggregate is the ONLY place either can be observed. A mute control that
# set a local flag would satisfy everything visible here.
#
# The safety sheet is reached the way `09-report-and-block` reaches it, and the
# two quieter options sit ABOVE Block: somebody who wants less of a person
# should meet mute before they meet the irreversible thing.
appId: app.socialinterest
---
- runFlow: 01-sign-in.yaml

# THE SEEDED POST, BY ITS CAPTION — the way `09` reaches it, not "whichever
# card ranks first". Two reasons, and the second is a defect this flow carried
# through three runs: `mute-person` is rendered only when the sheet is given an
# author to mute, so an arbitrary first card that happens to be THIS account's
# own post offers no such control. The fixture's post is somebody else's by
# construction.
- tapOn:
    id: "tab-feed"
- extendedWaitUntil:
    visible: "${PRESENT}"
    timeout: 60000
- tapOn: "${PRESENT}"

# WAITED FOR, not asserted. `PostDetailContainer` renders `post-loading` until
# `GET /v1/posts/:postId` returns (screens/index.tsx), so a bare `assertVisible`
# races a network round trip on a device. Failed this way in runs 53 and 54;
# every other flow that opens post detail either waits or arrives via a screen
# that has already fetched.
- extendedWaitUntil:
    visible:
      id: "post-detail-screen"
    timeout: 30000
- tapOn:
    id: "open-safety"
- assertVisible:
    id: "safety-actions"

# FR-041. The post stops being chosen; it still opens from a link, which is what
# makes this selection rather than the boundary.
- assertVisible:
    id: "dismiss-post"
- tapOn:
    id: "dismiss-post"

# WHERE THAT TAP LEAVES YOU, and the whole of run 55's failure.
#
# The sheet is a PUSHED screen whose `onDone` is `pop` (App.tsx), so dismissing
# returns to POST DETAIL. This flow then waited sixty seconds for a feed card —
# and `post-<ULID>` is a testID on `PostCard` and `PostTile`, neither of which
# the detail screen renders, so there was never anything to find. Measured in
# 3.1 seconds by `apps/e2e/browser/mute-and-dismiss-journey.spec.ts`, which
# counts zero of them on the screen the dismissal returns to.
#
# So the person-level choice starts from the screen that is actually in front of
# you. The sheet closed on success, so this is a fresh journey to it — just not
# one that goes back out to a feed that has this moment been told to stop
# choosing this post.
- extendedWaitUntil:
    visible:
      id: "post-detail-screen"
    timeout: 30000
- tapOn:
    id: "open-safety"
- assertVisible:
    id: "safety-actions"

# SCROLLED TO, exactly as `09-report-and-block` scrolls to `block-person`, and
# measured rather than assumed. At the emulator's own 320x616 the sheet's
# controls sit at `submit-report` 455, `dismiss-post` 557, `mute-person` 676,
# `block-person` 852 — so the dismissal above is on screen and the mute is
# sixty points past the fold, which is precisely the shape of run 57's failure
# (`Assertion is false: id: mute-person is visible`, after
# `PUT /v1/posts/:postId/dismiss` 204 in the same run's aggregate).
#
# The sheet scrolls because run 35 found `block-person` UNREACHABLE rather than
# merely below the fold — a Constitution IV release gate — so this is a person
# scrolling to a control that is meant to be scrolled to, not a workaround.
- scrollUntilVisible:
    element:
      id: "mute-person"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "mute-person"
- tapOn:
    id: "mute-person"

- assertNotVisible:
    id: "load-error"
