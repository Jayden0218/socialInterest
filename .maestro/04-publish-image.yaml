# J-04 publish an image.
#
# Exercises the real path: presign, PUT the bytes, then publish referencing the
# upload the server itself issued. FR-006 keeps publish disabled until an
# interest is chosen, so choosing one is part of the journey, not setup.
appId: app.socialinterest
---
- runFlow: 01-sign-in.yaml
- tapOn:
    id: "open-compose"

# Compose starts at the media picker since 003/T038 - MediaPickerScreen existed
# and nothing reached it, so publishing began one step in. This flow was written
# before that and tapped straight through to compose; run 11 failed it, and
# 08-comment and 09-report-and-block with it, since both runFlow this one.
#
# The jest navigation test was updated for the new first step and these flows
# were not. Same regression, two places, one of them not exercised until a
# device existed to exercise it.
- assertVisible:
    id: "media-picker-screen"
- tapOn:
    id: "media-item-0"
- tapOn:
    id: "media-continue"

- assertVisible:
    id: "compose-screen"
- tapOn:
    id: "interest-option-0"
- tapOn:
    id: "caption-input"
- inputText: "published from a cloud device"

# The keyboard is up and `publish-button` lives inside ComposeScreen's
# ScrollView, below the caption input, the interest list and the visibility
# control. On a 320x640 emulator it is simply not on screen - the flow assumed
# it was, and run 12 failed here once the picker step was fixed.
#
# This is not a workaround for the failure: a button inside a scroll container
# on a small screen must be scrolled to. The flow was wrong to assume otherwise.
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "publish-button"
    direction: DOWN

# WAIT FOR THE UPLOAD BEFORE TAPPING PUBLISH.
#
# The button is `disabled={blocked !== null || publishing}`, and `blocked` is
# "Waiting for uploads to finish" until every slot reaches `uploaded`. Tapping a
# disabled button is a SILENT no-op: no request, no error banner, and the app
# simply stays on compose - which is exactly what runs 18 and 19 showed, with
# three flows reaching publish and one POST /v1/posts between them.
#
# The app was reporting this the whole time, in `upload-status-0` and in the
# `publish-blocked-reason` banner. The flow never looked. Asserting "Uploaded"
# is asserting the app's own account of the upload, and it also means a genuine
# upload failure surfaces as `Failed: <reason>` here rather than as a mystery
# thirty seconds later.
- extendedWaitUntil:
    visible: "Uploaded"
    timeout: 60000
- assertNotVisible:
    id: "publish-blocked-reason"

- tapOn:
    id: "publish-button"
- assertNotVisible:
    id: "compose-error"

# The absence of an error is NOT evidence of a publish.
#
# Run 13 passed this flow while publishing nothing at all: the API log for the
# whole run showed three POST /v1/media/uploads and not one POST /v1/posts. The
# bytes never uploaded, so publish never fired, and "no error is visible" was
# true the entire time because the app simply sat on the compose screen.
#
# Leaving compose is the app's own signal that the publish returned - the
# container pops only in onPublished - and the post then has to be readable in
# the feed, which is the service's answer rather than the screen's.
# Three separate failures looked identical as `home-feed-screen is not visible`
# in run 18, so they are separated here, in the order they can occur.
#
# 1. Did publish return at all? ComposeFlowContainer pops only in onPublished,
#    so still being on compose after 30s means the request never resolved -
#    which matches run 18's API log: three flows reached publish and only ONE
#    POST /v1/posts was ever logged.
- extendedWaitUntil:
    notVisible:
      id: "compose-screen"
    timeout: 30000

# 2. Did the feed fail to load? HomeFeedContainer renders `load-error` instead
#    of the feed when its request rejects, and that is invisible to an assertion
#    that only looks for the feed.
- assertNotVisible:
    id: "load-error"

# 3. Only then is a missing feed screen actually a missing feed screen.
- extendedWaitUntil:
    visible:
      id: "home-feed-screen"
    timeout: 30000
- extendedWaitUntil:
    visible: "published from a cloud device"
    timeout: 30000
