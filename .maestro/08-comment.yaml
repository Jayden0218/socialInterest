# J-08 comment on a post.
appId: app.socialinterest
---
- runFlow: 04-publish-image.yaml

# The post is opened from the author's own profile, not the home feed. The feed
# is composed only from FOLLOWED interests (FR-032), and compose offers
# suggested ones - so a freshly published post is correctly absent from its own
# author's feed. 04-publish-image leaves the app on this tab already.
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible:
# A POST ID IS A ULID, and saying so is what makes this selector unambiguous.
#
# `post-.*` also matched `post-caption`, `post-detail-screen`, `post-media` and
# `post-image` — literals that are simply not mounted on this screen, so it
# worked by luck rather than by meaning. Run 50 lost a flow to the same shape
# where the luck ran out (`share-person-.*` matched the search field beside the
# results), and `verify-maestro-ids` now fails on any pattern that can reach a
# declared literal.
      id: "post-[0-9A-Z]{26}"
    timeout: 30000
- tapOn:
    id: "post-[0-9A-Z]{26}"
- assertVisible:
    id: "comments-button"
- tapOn:
    id: "comments-button"
- assertVisible:
    id: "comments-screen"
- tapOn:
    id: "comment-input"
- inputText: "a comment from a cloud device"
- tapOn:
    id: "comment-submit"
- assertVisible:
    id: "comment-list"
