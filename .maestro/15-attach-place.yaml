# 004/US2, J-15. Compose -> place picker -> publish, and the place sticks.
#
# The place step is OPTIONAL, so this flow proves two things at once: that it
# can be used, and that using it does not change how publishing works. A step
# that made every post harder would be a regression dressed as a feature.
#
# Whether the post actually landed AT the place is asserted service-side, after
# the run, in scripts/android-device-pass.sh. A chip rendered from local state
# would satisfy anything this file could assert.
appId: app.socialinterest
---
- runFlow: 01-sign-in.yaml

- tapOn:
    id: "open-compose"
- extendedWaitUntil:
    visible:
      id: "media-picker-screen"
    timeout: 20000
- tapOn:
    id: "media-item-image-0"
- tapOn:
    id: "media-continue"
- assertVisible:
    id: "compose-screen"

# FR-006 keeps publish disabled until an interest is chosen, so this is part of
# the journey rather than setup.
- tapOn:
    id: "interest-option-0"

# The optional place step. Locality first: a place search without one cannot
# dedupe, and would offer the wrong "Joe's" from another city.
#
# SCROLLED TO, not asserted where it happens to sit. Compose is a form longer
# than a phone - this flow already scrolls to reach `publish-button` further
# down - and 007 made it longer still by showing the picked MEDIA rather than a
# line of text about it. Measured at 320x640 the picker sits at y=642, just past
# the fold; the artboards are drawn at 390x844, where it is comfortably on
# screen.
#
# This is a flow fix and NOT a product fix, and the distinction is the one run
# 36 was about: the sign-in button was unreachable because that screen does not
# scroll AT ALL. The place picker is one swipe away on a surface built to
# scroll, and no requirement puts it above the fold.
- scrollUntilVisible:
    element:
      id: "place-picker"
    direction: DOWN
- assertVisible:
    id: "place-picker"
- tapOn:
    id: "place-locality-input"
- inputText: "${PLACE_LOCALITY}"
- hideKeyboard
- tapOn:
    id: "place-search-input"
- inputText: "${PLACE_NAME}"
- hideKeyboard

# FR-014: the existing place is offered BEFORE the create action. Tapping the
# match rather than Create is the behaviour that prevents duplicates.
- extendedWaitUntil:
    visible:
      id: "place-match-.*"
    timeout: 30000
- tapOn:
    id: "place-match-.*"
- assertVisible:
    id: "place-selected"

# Back UP for the caption, which sits above the place step. Maestro's `tapOn`
# does not scroll on its own, so a flow that scrolled down to reach one control
# has to come back for the ones above it.
- scrollUntilVisible:
    element:
      id: "caption-input"
    direction: UP
- tapOn:
    id: "caption-input"
- inputText: "published from a real device, at a place"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "publish-button"
    direction: DOWN
- extendedWaitUntil:
    visible: "Uploaded"
    timeout: 60000
- tapOn:
    id: "publish-button"

- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible: "published from a real device, at a place"
    timeout: 60000
