# 008/US4, T068 — A POST TRAVELS TO SOMEBODY NEVER MESSAGED.
#
# The share sheet has always listed ACCEPTED CONVERSATIONS ONLY, so a post could
# reach only people you were already talking to; and its Share button called the
# sheet's own "done" handler, so the app has never shared anything anywhere.
# Both are the 008 pattern: a control that is present and does less than it says.
#
# THE SERVER NEEDED NO CHANGE (008/R4). `PUT /v1/conversations/with/:handle` has
# always opened a pair conversation idempotently over a derived id, including
# with a stranger, and messages have always accepted `sharedPostId`.
#
# WHAT TO READ IN THE RUN AGGREGATE:
#   GET /v1/people                              200   the recipient search
#   PUT /v1/conversations/with/:handle          200   the conversation opened
#   POST /v1/conversations/:id/messages         201   the post sent
#
# The last line is the one that matters. Everything this flow asserts on screen
# is satisfied by a picker that renders and sends nothing.
#
# NOT chained to a flow that follows or blocks anybody: flows share ONE SERVER
# and a toggle is not idempotent (005 lost a run to exactly that).
appId: app.socialinterest
---
- runFlow: 01-sign-in.yaml

# A post of this account's own, published here rather than borrowed, so the
# flow does not depend on another flow's ordering.
- tapOn:
    id: "open-compose"
- assertVisible:
    id: "media-picker-screen"
- tapOn:
    id: "media-item-image-0"
- tapOn:
    id: "media-continue"
- assertVisible:
    id: "compose-screen"
- tapOn:
    id: "interest-option-0"
- tapOn:
    id: "caption-input"
- inputText: "a post that travels"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "publish-button"
    direction: DOWN
- extendedWaitUntil:
    visible: "Uploaded"
    timeout: 120000
- tapOn:
    id: "publish-button"
- extendedWaitUntil:
    notVisible:
      id: "compose-screen"
    timeout: 60000

# Open it from the author's own profile, where a person's posts always are.
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible:
# A POST ID IS A ULID, and saying so is what makes this selector unambiguous.
#
# `post-.*` also matched `post-caption`, `post-detail-screen`, `post-media` and
# `post-image` — literals that are simply not mounted on this screen, so it
# worked by luck rather than by meaning. Run 50 lost a flow to the same shape
# where the luck ran out (`share-person-.*` matched the search field beside the
# results), and `verify-maestro-ids` now fails on any pattern that can reach a
# declared literal.
      id: "post-[0-9A-Z]{26}"
    timeout: 60000
- tapOn:
    id: "post-[0-9A-Z]{26}"
- assertVisible:
    id: "post-detail-screen"

- tapOn:
    id: "share-button"
- assertVisible:
    id: "share-action"

# 008/FR-011 — the picker exists at all, which it did not before.
- assertVisible:
    id: "share-to-person"
- tapOn:
    id: "share-recipient-search"
# THE SEEDED GROUP MEMBER, by their full handle.
#
# The first version of this flow searched "de" — the device account's own handle
# prefix — with a comment claiming that "sending to yourself exercises open and
# send end to end". IT CANNOT: `PersonSearchService` excludes the viewer from
# their own results, deliberately, so the one person that query was written to
# find is the one person it can never return.
#
# `GROUP_MEMBER_C` is a real second person, exported by `seed-group-fixture.ts`
# and already used by `21-group-chat`. Being in a group with somebody creates no
# PAIR conversation, so this is still FR-011's case: a post reaching somebody
# never messaged.
- inputText: "${GROUP_MEMBER_C}"
- hideKeyboard

# AN EXACT ID, NOT `share-person-.*`.
#
# A Maestro selector is a regex, and `share-person-.*` also matched the search
# FIELD, which was `share-person-search` and is rendered first. Run 50's tap
# landed on the field: nothing was sent, the sheet stayed open, and the run's
# aggregate shows no refusal anywhere because there was nothing to refuse. The
# field is renamed, and this selects the recipient by name so the flow cannot
# depend on which element a pattern happens to reach first.
- extendedWaitUntil:
    visible:
      id: "share-person-${GROUP_MEMBER_C}"
    timeout: 30000
- tapOn:
    id: "share-person-${GROUP_MEMBER_C}"

# The sheet is a PUSHED screen and pops on a successful send, so its absence is
# the send having resolved. The neutral refusal banner is checked AFTER the wait
# as well as before it: checking only before proves nothing, because the request
# had not finished yet.
- extendedWaitUntil:
    notVisible:
      id: "share-action"
    timeout: 30000
- assertNotVisible:
    id: "share-send-error"
