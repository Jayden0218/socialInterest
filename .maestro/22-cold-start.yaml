# 007/FR-014, FR-015 — THE COLD START, AND SKIPPING IT.
#
# A new account is asked once what it is into. The picks are a SEED, not a
# subscription: they initialise the ranking and are overtaken by behaviour.
#
# The half worth a device run is the SKIP. FR-015 requires a populated feed for
# somebody who picks nothing, and that is the first impression the product makes
# on anyone who does not want to answer a questionnaire before seeing anything.
# It is also the path most likely to be broken by a well-meaning change, because
# it is the one nobody demos.
#
# `clearState` clears the DEVICE, not the server, so this needs its own account:
# FR-014 asks once per ACCOUNT, and by the time this flow runs the device token
# has signed in and dismissed the picks in 01. Reusing it would fail for a
# reason that is the product working correctly — the same shared-server coupling
# 005 recorded when a chained flow's follow toggle silently unfollowed a place.
appId: app.socialinterest
---
- launchApp:
    clearState: true
- assertVisible:
    id: "app-root"
- tapOn:
    id: "open-sign-in"
- tapOn:
    id: "sign-in-token"
- inputText: ${COLD_TOKEN}
- tapOn:
    id: "sign-in-submit"

# Signing in lands HERE, not on the tabs. A pushed screen has no tab bar - the
# fact that broke fifteen browser journeys in one commit, and 005/J-21 before
# that.
- assertVisible:
    id: "pick-interests-screen"

# Skip is a peer of Continue, not fine print: there is nothing to repair
# afterwards, so the screen does not argue about it.
- tapOn:
    id: "pick-skip"
- assertNotVisible:
    id: "pick-interests-screen"

# FR-015. A POPULATED feed for an account that declared nothing — no follows,
# no seeds, no behaviour. This is the first impression the product makes on
# anybody who declines to answer a questionnaire before seeing anything, and it
# is the path nobody demos.
#
# ASSERTED ON A POPULATED FEED, NOT ON ONE PARTICULAR POST — and the previous
# version of this assertion contradicted the fixture that feeds it.
#
# `seed-feed-fixture.ts` says, in its own comment, that the device person
# DECLARES the interest "so the post is in the candidate set for a reason rather
# than by the luck of an exploration draw (FR-030)", and warns that waiting on a
# post exploration happened to surface "would fail intermittently twenty minutes
# into a 25-minute run".
#
# This flow signs in as `COLD_TOKEN` — the account that declares NOTHING, which
# is the entire point of FR-015 — and then asserted `${PRESENT}`, the post that
# is only guaranteed for the DECLARING account. So it asked for exactly the
# thing the fixture says cannot be relied on, and run 42 failed on it.
#
# What FR-015 actually requires is that the feed is POPULATED for somebody who
# picked nothing. That is what is asserted. It cannot pass vacuously: an empty
# ranked feed renders an empty state, and no `post-` card at all.
- tapOn:
    id: "tab-feed"
- assertVisible:
    id: "home-feed-screen"
- extendedWaitUntil:
    visible:
# A POST ID IS A ULID, and saying so is what makes this selector unambiguous.
#
# `post-.*` also matched `post-caption`, `post-detail-screen`, `post-media` and
# `post-image` — literals that are simply not mounted on this screen, so it
# worked by luck rather than by meaning. Run 50 lost a flow to the same shape
# where the luck ran out (`share-person-.*` matched the search field beside the
# results), and `verify-maestro-ids` now fails on any pattern that can reach a
# declared literal.
      id: "post-[0-9A-Z]{26}"
    timeout: 30000
