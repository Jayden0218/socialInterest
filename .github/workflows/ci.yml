name: CI

on:
  push:
    branches: ['**']
  pull_request:

# No cloud credentials. Everything runs on the local runtime profile (research D9);
# a test that cannot run here is not a test this project relies on.
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ['8000:8000']
      s3:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: localkey
          MINIO_ROOT_PASSWORD: localsecret
        ports: ['9000:9000']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @sih/infra db:create-local
      - run: pnpm --filter @sih/infra s3:create-local
      - run: pnpm --filter @sih/infra seed:catalogue
      - run: pnpm test
