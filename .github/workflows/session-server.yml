# 009/US2. A disposable session server, on demand, for free.
#
# WHAT THIS IS: a temporary development environment so the app can be used on a
# real phone. It is NOT a deployment of the product. It starts from an empty
# datastore, it is gone when the lifetime below elapses, and nothing in it is
# durable. See specs/009-session-server/spec.md, "Out of Scope".
#
# workflow_dispatch only, and deliberately. The runner holds the whole stack and
# two tunnels; nothing about that should start on a push.
name: Session server

on:
  workflow_dispatch:
    inputs:
      lifetime_minutes:
        # 30, chosen after finding that Actions minutes are metered here rather
        # than free: this repository is PRIVATE, so the allowance is 2,000 Linux
        # minutes a month, shared with CI and the emulator job. A session is
        # opened to look at the app for twenty minutes, not to be left running —
        # and the longer options are one tap away when a session needs to
        # outlast a conversation. See research R1.
        description: 'How long the session should live (minutes)'
        required: true
        default: '30'
        type: choice
        options: ['30', '60', '120', '240', '350']

# One at a time, and a NEW DISPATCH REPLACES THE OLD SESSION rather than queuing
# behind it.
#
# `cancel-in-progress: false` was the first version and it was wrong in a way
# that is invisible from the outside: dispatching a second session while one was
# running left the second QUEUED, with no descriptor, for as long as the first
# one's lifetime — up to 350 minutes. Waiting on a run that has not started looks
# exactly like waiting on a run that is failing to start, which is the "looked
# like evidence and answered nothing" shape again.
#
# Replacing is also what the thing IS. A session is disposable by definition and
# only the newest descriptor is any use, so asking for one is asking for that.
concurrency:
  group: session-server
  cancel-in-progress: true

jobs:
  session:
    runs-on: ubuntu-22.04
    # The platform caps a job at 6 hours and the cap is hard, so the ceiling on
    # the input above is not ours to raise. +10 leaves room for bring-up and
    # teardown around the chosen lifetime.
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Everything ordered lives in the script, not here. A script can be run and
      # watched locally for nothing; a workflow step costs a dispatch to observe.
      # The failure-naming path was verified that way rather than by guessing.
      - name: Bring the session up
        id: up
        run: scripts/session-up.sh "${{ inputs.lifetime_minutes }}"

      # ---------------------------------------------------------------------
      # FR-016, FR-022. The session lives, and says so periodically.
      #
      # The health endpoint is the product's own and already public; nothing new
      # was added for this. Each tick is one line so the log stays readable, and
      # the descriptor is already in the summary where a phone can reach it.
      # ---------------------------------------------------------------------
      - name: Hold the session open
        run: |
          set -uo pipefail
          END=$(( $(date +%s) + ${{ inputs.lifetime_minutes }} * 60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            LEFT=$(( (END - $(date +%s)) / 60 ))
            if curl -sf -o /dev/null --max-time 10 http://127.0.0.1:3000/v1/health; then
              echo "alive; ${LEFT}m remaining"
            else
              # Not fatal on its own - a single missed probe is not a dead
              # server - but it is the only trace a person would ever get, so it
              # is said plainly rather than swallowed.
              echo "WARNING: the application did not answer its health check; ${LEFT}m remaining"
            fi
            sleep 60
          done
          echo "lifetime elapsed"

      - name: Say the session has ended
        if: always()
        run: |
          {
            printf '\n---\n\n**This session has ended.** Its addresses no longer resolve and its\n'
            printf 'data is gone. Dispatch the workflow again for a new one; the app keeps\n'
            printf 'working against any address you point it at.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      # Tunnels die with the job, but the API and the containers are left
      # holding a runner that is about to be reclaimed anyway. Tidied explicitly
      # so a failure here is visible rather than implicit.
      - name: Tear down
        if: always()
        run: |
          pkill -f cloudflared || true
          [ -f "${RUNNER_TEMP}/sih-session/api.pid" ] && kill "$(cat "${RUNNER_TEMP}/sih-session/api.pid")" 2>/dev/null || true
          docker compose down -v || true

      - name: Application log
        if: failure()
        run: cat "${RUNNER_TEMP}/sih-session/api.log" 2>/dev/null || echo "no application log"

      # Seeding does not fail the session (scripts/session-up.sh, step 7b), so
      # its log would otherwise be written nowhere on the one path where it is
      # the thing anyone wants to read.
      - name: Seed log
        if: always()
        run: tail -40 "${RUNNER_TEMP}/sih-session/seed.log" 2>/dev/null || echo "no seed log"
