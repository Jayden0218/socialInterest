# The local runtime profile. Both services keep their data on a named volume:
# without one the datastore ran `-inMemory` and lost every post on restart, and
# object storage wrote into the container's writable layer and lost every upload
# when the container was recreated.
#
# Verified 2026-09-06, after the ownership fix below: an item written through the
# DynamoDB API, then `docker compose rm -sf dynamodb` (destroyed, not restarted),
# then `up -d`, reads back with its value intact. The same check before the fix
# could not even write.
services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    # `user: root` is not decoration. The image runs as uid 1000
    # (dynamodblocal), but Docker creates a named volume's mountpoint owned by
    # root, so DynamoDB Local cannot open its SQLite file at /data:
    #
    #   SQLiteException: [14] unable to open database file
    #   SQLiteQueue[shared-local-instance.db]: stopped abnormally, reincarnating
    #
    # It does not exit. It answers 400 to a bare GET - so a health probe passes -
    # and then HANGS every real request forever. That is how this looked healthy
    # while `db:create-local` sat for 180s and the durability run never returned.
    user: root
    command: ["-jar", "DynamoDBLocal.jar", "-dbPath", "/data", "-sharedDb"]
    volumes: ["sih-dynamodb:/data"]
    ports: ["8000:8000"]

  # 010/T002. Postgres, the engine the datastore is moving TO.
  #
  # ADDED ALONGSIDE DYNAMODB LOCAL RATHER THAN REPLACING IT, which is a
  # deliberate correction to 010/T002 as written. The task said "replace", but
  # T007 — the step the whole migration's provability rests on — requires the
  # seven-primitive contract test to be run against the engine being REPLACED
  # and watched green there first. An engine that cannot be started cannot be
  # watched. `contracts/datastore-primitives.md` says so itself: "the same test
  # file runs against both engines where both can still be started".
  #
  # DynamoDB Local goes when the swap is done and the contract has been proven
  # on both sides, which is 010 Phase 6's business, not Phase 1's.
  #
  # On Docker Hub, and that matters here: `postgres` is an official library
  # image, so this removes the quay.io dependency the dead-ends table in
  # CLAUDE.md records as unreachable from the development sandbox — for the
  # datastore path. Object storage still reaches for quay.io until US2 moves it.
  #
  # Pulled here 2026-09-13 and that is evidence ABOUT THE MIRROR, not about
  # Docker Hub: this sandbox sets registry-mirrors: [mirror.gcr.io]. CI goes
  # direct and is the only instrument that can confirm it, exactly as the MinIO
  # note below records.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sih
      POSTGRES_PASSWORD: localsecret
      POSTGRES_DB: sih
    # A named volume for the same reason the two below have one: without it the
    # datastore loses every post when the container is recreated, which is the
    # defect 003's durability work exists to have ended.
    volumes: ["sih-postgres:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
    # `pg_isready` rather than a port probe. DynamoDB Local taught this project
    # that a process answering its socket is not a process that can serve a
    # request — it answered 400 to a bare GET while unable to open its own
    # database file, so the health probe passed and every real request hung.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih -d sih"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    # MINIO IS NO LONGER ON DOCKER HUB AT ALL, and the first fix for this was
    # wrong in a way worth recording.
    #
    # CI died on `docker compose up -d` with typecheck and lint already green:
    #
    #   pull access denied for minio/minio, repository does not exist or may
    #   require 'docker login'
    #
    # Note what that message does NOT contain: a tag. It is Docker Hub's answer
    # for an inaccessible REPOSITORY, not for a missing tag (which reads
    # `manifest for ...:TAG not found`). Checked directly:
    # `hub.docker.com/v2/repositories/minio/minio/` answers 404, and the
    # `minio` namespace lists 20 repositories of which none is `minio`. The
    # server image was withdrawn from Docker Hub; MinIO publishes to quay.io.
    #
    # THE FIRST ATTEMPT PINNED A DOCKER HUB RELEASE TAG AND WAS VERIFIED IN
    # THIS SANDBOX, WHERE IT PULLED. That proved nothing: the sandbox sets
    # `registry-mirrors: [mirror.gcr.io]` (CLAUDE.md, Environment), so the pull
    # was served from the MIRROR'S CACHE of a repository that no longer exists
    # upstream. CI has no mirror and goes direct, so it failed identically on
    # the "fix". Principle V, exactly: a green local result against a different
    # configuration is not evidence about the one that ships.
    #
    # quay.io is UNREACHABLE from the sandbox (egress denies it — same table),
    # so this line cannot be verified locally by anything. CI is the only
    # instrument that can, and that is stated rather than papered over.
    #
    # Pinned rather than floating for the original reason: a moving tag on a
    # registry somebody else controls puts CI's ability to START outside this
    # repository's control.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: localkey
      MINIO_ROOT_PASSWORD: localsecret
    volumes: ["sih-minio:/data"]
    ports: ["9000:9000", "9001:9001"]

volumes:
  sih-postgres:
  sih-dynamodb:
  sih-minio:
