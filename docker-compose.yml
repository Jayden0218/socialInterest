# The local runtime profile. Both services keep their data on a named volume:
# without one the datastore ran `-inMemory` and lost every post on restart, and
# object storage wrote into the container's writable layer and lost every upload
# when the container was recreated.
#
# Verified 2026-09-06, after the ownership fix below: an item written through the
# DynamoDB API, then `docker compose rm -sf dynamodb` (destroyed, not restarted),
# then `up -d`, reads back with its value intact. The same check before the fix
# could not even write.
services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    # `user: root` is not decoration. The image runs as uid 1000
    # (dynamodblocal), but Docker creates a named volume's mountpoint owned by
    # root, so DynamoDB Local cannot open its SQLite file at /data:
    #
    #   SQLiteException: [14] unable to open database file
    #   SQLiteQueue[shared-local-instance.db]: stopped abnormally, reincarnating
    #
    # It does not exit. It answers 400 to a bare GET - so a health probe passes -
    # and then HANGS every real request forever. That is how this looked healthy
    # while `db:create-local` sat for 180s and the durability run never returned.
    user: root
    command: ["-jar", "DynamoDBLocal.jar", "-dbPath", "/data", "-sharedDb"]
    volumes: ["sih-dynamodb:/data"]
    ports: ["8000:8000"]

  s3:
    # PINNED, because `minio/minio:latest` was WITHDRAWN from Docker Hub and
    # every run of this compose file started failing at the pull:
    #
    #   pull access denied for minio/minio, repository does not exist or may
    #   require 'docker login'
    #
    # That message is Docker Hub's for "no such tag" AND for "not authorised",
    # which is why it reads like a credentials problem and is not one. Measured
    # against the same registry seconds apart: `minio/minio:latest` is not
    # found, `RELEASE.2025-04-22T22-12-26Z` pulls, and `amazon/dynamodb-local:
    # latest` above is unaffected — so it is neither rate limiting nor a
    # registry outage, and only the tag is gone.
    #
    # The version is not the point; the PIN is. A floating tag on a dependency
    # somebody else can unpublish means CI's ability to start is outside this
    # repository's control, and it took the whole build down with typecheck and
    # lint already green. Moving this forward is a deliberate edit from now on.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: localkey
      MINIO_ROOT_PASSWORD: localsecret
    volumes: ["sih-minio:/data"]
    ports: ["9000:9000", "9001:9001"]

volumes:
  sih-dynamodb:
  sih-minio:
