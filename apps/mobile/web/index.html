<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>socialInterest</title>
    <!-- THE TYPEFACE, FOR THE BROWSER HARNESS.

         Native embeds these through `expo-font` (app.config.ts); react-native-web
         resolves `fontFamily` as CSS instead, so without this the browser renders
         the app in the default sans while a device renders Plus Jakarta Sans —
         and every screenshot in docs/screens/ would keep showing a typeface the
         product does not use. That is exactly what they were doing before: the
         font was declared in tokens.ts, loaded by nothing, and applied to
         nothing, on either platform.

         The four families are named per weight to match `FONT` in tokens.ts,
         because Android registers Medium and SemiBold as separate families
         rather than as weights of one. The @font-face rules below alias those
         names onto the real family so one set of style objects works on both. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
    <style>
      /* THE FONT FILES THIS REPOSITORY ALREADY SHIPS, served beside the page.

         Two earlier versions failed, and both failed INVISIBLY to the audit:
         `local('Plus Jakarta Sans')` resolves only if the typeface is installed
         on the machine (it is not, on a runner or in this sandbox), and the
         gstatic URLs cannot be fetched from here at all. Each time,
         measured.json went on reporting `PlusJakartaSans-SemiBold` — because
         getComputedStyle reports the family CSS ASKED FOR, not the one that
         resolved — while every screenshot rendered in a serif fallback.

         The SCREENSHOTS caught what the measurement could not, which is the
         whole argument for keeping both. These are the same four files the APK
         embeds, so the browser and the device now set type from one source and
         no network is involved. */
      @font-face { font-family: 'PlusJakartaSans-Regular'; font-weight: 400; font-display: block;
        src: url('./fonts/PlusJakartaSans-Regular.ttf') format('truetype'); }
      @font-face { font-family: 'PlusJakartaSans-Medium'; font-weight: 500; font-display: block;
        src: url('./fonts/PlusJakartaSans-Medium.ttf') format('truetype'); }
      @font-face { font-family: 'PlusJakartaSans-SemiBold'; font-weight: 600; font-display: block;
        src: url('./fonts/PlusJakartaSans-SemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'PlusJakartaSans-Bold'; font-weight: 700; font-display: block;
        src: url('./fonts/PlusJakartaSans-Bold.ttf') format('truetype'); }
    </style>
    <style>html,body,#root{height:100%;margin:0}/* #root must be a FLEX container: react-native-web renders the app root as a
   `flex: 1` div, and a flex child in a BLOCK parent sizes to its content
   instead of stretching. The app therefore stopped at the last element and
   the page below it was the browser's white - invisible under the old white
   theme, obvious under a dark green one. A harness detail, not a product
   defect: on Android the native root always fills the screen. Fixed here so
   the browser captures show what a device shows. */#root{display:flex;flex-direction:column}</style>
  </head>
  <body><div id="root"></div><script src="/bundle.js"></script></body>
</html>
