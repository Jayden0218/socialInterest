<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #c9a227; } a:hover { color: #e0bb43; }
    .s { font-family: 'Newsreader', Georgia, serif; }
    .m { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
    .kicker { font-size: 10px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; }
  </style>
</helmet>

<div class="s" style="width: 390px; height: 844px; background: #101710; color: #ece5d8; overflow: hidden; display: flex; flex-direction: column;">

  <div style="height: 44px; flex-shrink: 0;"></div>

  <!-- masthead -->
  <div style="flex-shrink: 0; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2a3327;">
    <span class="m kicker" style="color: #8f9a86;">Tue 8 Sep</span>
    <span class="s" style="font-size: 21px; font-style: italic; letter-spacing: 0.01em;">Interest</span>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8f9a86" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
  </div>

  <div style="flex-grow: 1; overflow: hidden;">

    <!-- YOUR FEED IS YOUR INTERESTS, LISTED. Not one blended stream. -->
    <div style="padding: 20px 24px 0; display: flex; align-items: baseline; gap: 10px;">
      <div style="width: 8px; height: 8px; border-radius: 50%; background: #6f9e5f; align-self: center;"></div>
      <span class="s" style="font-size: 27px; font-style: italic; line-height: 1;">Bouldering</span>
      <div style="flex-grow: 1; height: 1px; background: #2a3327; align-self: center;"></div>
      <span class="m" style="font-size: 11px; color: #8f9a86;">4 new</span>
    </div>

    <!-- lead entry -->
    <div style="padding: 14px 24px 0;">
      <div style="width: 342px; height: 186px; background:
          radial-gradient(110% 90% at 20% 15%, #5c7f4c 0%, rgba(92,127,76,0) 60%),
          linear-gradient(160deg, #38492f 0%, #151d13 100%);"></div>
      <div style="padding: 12px 0 0; display: flex; flex-direction: column; gap: 6px;">
        <span class="s" style="font-size: 19px; line-height: 25px; letter-spacing: -0.005em; text-wrap: pretty;">First clean send of the season, after three months on one problem</span>
        <span class="m kicker" style="color: #8f9a86;">Maren Kohl · 2h</span>
      </div>
    </div>

    <div style="height: 1px; background: #2a3327; margin: 18px 24px 0;"></div>

    <!-- secondary entries: type-led, media as a small plate -->
    <sc-for list="{{entries}}" as="e" hint-placeholder-count="2">
      <div style="display: flex; gap: 14px; padding: 14px 24px 0; align-items: flex-start;">
        <div style="width: 62px; height: 74px; flex-shrink: 0; background: {{e.plate}};"></div>
        <div style="display: flex; flex-direction: column; gap: 5px; padding-top: 1px;">
          <span class="s" style="font-size: 16px; line-height: 21px; text-wrap: pretty;">{{e.title}}</span>
          <span class="m kicker" style="color: #8f9a86;">{{e.meta}}</span>
        </div>
      </div>
    </sc-for>

    <div style="padding: 22px 24px 0; display: flex; align-items: baseline; gap: 10px;">
      <div style="width: 8px; height: 8px; border-radius: 50%; background: #c07a5e; align-self: center;"></div>
      <span class="s" style="font-size: 27px; font-style: italic; line-height: 1;">Birding</span>
      <div style="flex-grow: 1; height: 1px; background: #2a3327; align-self: center;"></div>
      <span class="m" style="font-size: 11px; color: #8f9a86;">2 new</span>
    </div>

    <div style="display: flex; gap: 14px; padding: 14px 24px 0; align-items: flex-start;">
      <div style="width: 62px; height: 74px; flex-shrink: 0; background: linear-gradient(155deg, #7a6a4a, #221d14);"></div>
      <div style="display: flex; flex-direction: column; gap: 5px; padding-top: 1px;">
        <span class="s" style="font-size: 16px; line-height: 21px; text-wrap: pretty;">Redstart on the reservoir wall, first of the autumn</span>
        <span class="m kicker" style="color: #8f9a86;">Nadia Reyes · 5h</span>
      </div>
    </div>
  </div>

  <div style="height: 74px; flex-shrink: 0; border-top: 1px solid #2a3327; background: #0d130c; display: flex; align-items: center; padding: 0 8px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ece5d8" stroke-width="1.5"><path d="M4 5h16M4 12h16M4 19h10"></path></svg>
      <span class="m kicker" style="color: #ece5d8;">Feed</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8f9a86" stroke-width="1.5" stroke-linejoin="round"><path d="M12 3l7.5 5v8L12 21l-7.5-5V8L12 3z"></path></svg>
      <span class="m kicker" style="color: #8f9a86;">Index</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#c9a227" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      <span class="m kicker" style="color: #c9a227;">Entry</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8f9a86" stroke-width="1.5" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4V5z"></path></svg>
      <span class="m kicker" style="color: #8f9a86;">Talk</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8f9a86" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8.4" r="3.4"></circle><path d="M5.5 19.5c0-3.2 2.9-5.2 6.5-5.2s6.5 2 6.5 5.2"></path></svg>
      <span class="m kicker" style="color: #8f9a86;">You</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      entries: [
        { title: 'Beta for the slab traverse at the quarry', meta: 'Jonas Vik · 4h', plate: 'linear-gradient(155deg, #4e6b42, #182015)' },
        { title: 'Chalk, humidity and why September is the month', meta: 'Perla Adeyemi · 6h', plate: 'linear-gradient(155deg, #6b7a52, #1d2416)' },
      ],
    };
  }
}
</script>
</body>
</html>
