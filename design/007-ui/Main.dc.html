<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #7ee89b; } a:hover { color: #9df0b3; }
    .d { font-family: 'Bricolage Grotesque', system-ui, sans-serif; }
    .b { font-family: 'Schibsted Grotesk', system-ui, sans-serif; }
  </style>
</helmet>

<!-- ONE BLENDED STREAM. No sections, no shelves, no interest axis: the next
     post is whatever the ranking picked. The interest survives as a small tag
     because it is what the system LEARNS OVER — it is no longer the shape of
     the screen. -->
<div class="b" style="width: 390px; height: 844px; background: #000; color: #fff; overflow: hidden; position: relative;">

  <div style="position: absolute; inset: 0; background:
      radial-gradient(105% 70% at 30% 16%, #8fb673 0%, rgba(143,182,115,0) 56%),
      radial-gradient(95% 65% at 80% 55%, #47876f 0%, rgba(71,135,111,0) 62%),
      linear-gradient(163deg, #2f4a2c 0%, #050a06 100%);"></div>
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 44%, rgba(0,0,0,0.85) 100%);"></div>

  <!-- minimal chrome: nothing competes with the post -->
  <div style="position: absolute; top: 44px; left: 0; right: 0; height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px;">
    <span class="d" style="font-size: 19px; font-weight: 800; letter-spacing: -0.03em; color: rgba(255,255,255,0.95);">Interest</span>
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
  </div>

  <!-- the signals, where a thumb rests -->
  <div style="position: absolute; right: 14px; bottom: 152px; display: flex; flex-direction: column; gap: 21px; align-items: center;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="29" height="29" viewBox="0 0 24 24" fill="#ff5f6d"><path d="M12 20.6S4.2 15.8 4.2 10.6A4.4 4.4 0 0 1 12 7.6a4.4 4.4 0 0 1 7.8 3c0 5.2-7.8 10-7.8 10z"></path></svg>
      <span style="font-size: 11px; font-weight: 600;">1,204</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="29" height="29" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a7.5 7.5 0 0 1-11 6.6L4.5 20l1.4-4.2A7.5 7.5 0 1 1 20 12z"></path></svg>
      <span style="font-size: 11px; font-weight: 600;">86</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="29" height="29" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v16l-6-4.5L6 20V4z"></path></svg>
      <span style="font-size: 11px; font-weight: 600;">Save</span>
    </div>
    <svg width="29" height="29" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-7-6 16-2.5-6.5L4 12z"></path></svg>
    <!-- the tuning control: a recommender that cannot be corrected is a trap -->
    <svg width="29" height="29" viewBox="0 0 24 24" fill="rgba(255,255,255,0.92)"><circle cx="12" cy="5" r="1.9"></circle><circle cx="12" cy="12" r="1.9"></circle><circle cx="12" cy="19" r="1.9"></circle></svg>
  </div>

  <div style="position: absolute; left: 18px; right: 84px; bottom: 100px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 9px;">
      <div style="width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;">M</div>
      <span style="font-size: 14px; font-weight: 600;">maren</span>
      <div style="height: 26px; padding: 0 12px; border-radius: 13px; border: 1px solid rgba(255,255,255,0.55); display: flex; align-items: center;">
        <span style="font-size: 11px; font-weight: 600;">Follow</span>
      </div>
    </div>
    <span style="font-size: 14px; line-height: 20px; color: rgba(255,255,255,0.95); text-wrap: pretty;">First clean send of the season. Three months on this one problem.</span>
    <!-- the interest is a TAG now, not the structure: what the model learns over -->
    <div style="display: flex; align-items: center; gap: 7px; height: 26px; padding: 0 11px 0 9px; border-radius: 8px; background: rgba(255,255,255,0.14); align-self: flex-start;">
      <div style="width: 6px; height: 6px; border-radius: 50%; background: #7ee89b;"></div>
      <span style="font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.95);">Bouldering</span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.78) 45%); display: flex; align-items: flex-start; padding-top: 11px;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
        <sc-if value="{{t.plus}}" hint-placeholder-val="{{ false }}">
          <div style="width: 44px; height: 44px; border-radius: 14px; background: #7ee89b; display: flex; align-items: center; justify-content: center; margin-top: -4px;">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#05210e" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          </div>
        </sc-if>
        <sc-if value="{{t.normal}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
            <div style="width: 23px; height: 23px; border-radius: 6px; background: {{t.mark}};"></div>
            <span style="font-size: 10px; font-weight: 600; color: {{t.fg}};">{{t.label}}</span>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tab = (label, on) => ({
      label, normal: true, plus: false,
      fg: on ? '#ffffff' : 'rgba(255,255,255,0.55)',
      mark: on ? '#ffffff' : 'rgba(255,255,255,0.45)',
    });
    return {
      tabs: [
        tab('For you', true), tab('Explore', false),
        { label: '', normal: false, plus: true, fg: '', mark: '' },
        tab('Chats', false), tab('You', false),
      ],
    };
  }
}
</script>
</body>
</html>
