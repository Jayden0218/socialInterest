<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1F6B3F; } a:hover { color: #17542f; }
    .t { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
  </style>
</helmet>

<div class="t" style="width: 390px; height: 844px; background: #FBFAF8; color: #16211A; overflow: hidden; display: flex; flex-direction: column;">

  <div style="height: 44px; flex-shrink: 0;"></div>

  <div style="height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
    <span style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em;">Interest</span>
    <div style="display: flex; gap: 18px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16211A" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.7-3.7"></path></svg>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16211A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6a5.6 5.6 0 0 0-5.6 5.6c0 4-1.5 5.6-2 6.1h15.2c-.5-.5-2-2.1-2-6.1A5.6 5.6 0 0 0 12 3.6z"></path><path d="M10.4 19.4a1.8 1.8 0 0 0 3.2 0"></path></svg>
    </div>
  </div>

  <!-- two tabs, plainly labelled. Nothing else competes for attention. -->
  <div style="height: 40px; flex-shrink: 0; display: flex; gap: 22px; padding: 0 16px; align-items: flex-start;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;">
      <span style="font-size: 15px; font-weight: 600; color: #16211A;">For you</span>
      <div style="width: 20px; height: 2.5px; border-radius: 2px; background: #1F6B3F;"></div>
    </div>
    <span style="font-size: 15px; font-weight: 500; color: #8A948C;">Following</span>
  </div>

  <!-- Two-column waterfall. Image height drives card height, so the columns
       stagger. No shadows: the white card on the warm ground and the gutter
       are the whole depth model. -->
  <div style="flex-grow: 1; overflow: hidden; padding: 6px 12px 0; display: flex; gap: 10px;">
    <sc-for list="{{columns}}" as="col" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 12px; width: 178px;">
        <sc-for list="{{col.cards}}" as="c" hint-placeholder-count="2">
          <div style="background: #FFFFFF; border-radius: 14px; overflow: hidden;">
            <div style="width: 178px; height: {{c.h}}; background: {{c.art}};"></div>
            <div style="padding: 10px 11px 11px; display: flex; flex-direction: column; gap: 9px;">
              <span style="font-size: 13.5px; font-weight: 600; line-height: 18px; letter-spacing: -0.008em; color: #16211A; text-wrap: pretty;">{{c.title}}</span>
              <div style="display: flex; align-items: center; gap: 6px;">
                <div style="width: 18px; height: 18px; border-radius: 50%; background: {{c.av}}; flex-shrink: 0;"></div>
                <span style="font-size: 11.5px; font-weight: 500; color: #6B7770; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">{{c.who}}</span>
                <div style="flex-grow: 1;"></div>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8A948C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20S4.5 15.5 4.5 10.5A4.2 4.2 0 0 1 12 7.7a4.2 4.2 0 0 1 7.5 2.8C19.5 15.5 12 20 12 20z"></path></svg>
                <span style="font-size: 11.5px; font-weight: 500; color: #8A948C;">{{c.likes}}</span>
              </div>
              <!-- the one quiet signature: the interest, as a coloured word.
                   Not a chip, not a stamp. It colour-codes the whole feed so
                   the eye can sort it without anything shouting. -->
              <span style="font-size: 11px; font-weight: 600; color: {{c.hue}};">{{c.tag}}</span>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <div style="height: 76px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #ECEAE4; display: flex; align-items: flex-start; padding-top: 10px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#1F6B3F"><rect x="3" y="3" width="8" height="11" rx="2.4"></rect><rect x="13" y="3" width="8" height="7" rx="2.4"></rect><rect x="13" y="12" width="8" height="9" rx="2.4"></rect><rect x="3" y="16" width="8" height="5" rx="2.4"></rect></svg>
      <span style="font-size: 10.5px; font-weight: 600; color: #1F6B3F;">Feed</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A948C" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.7-3.7"></path></svg>
      <span style="font-size: 10.5px; font-weight: 500; color: #8A948C;">Explore</span>
    </div>
    <div style="flex-grow: 1; display: flex; justify-content: center;">
      <div style="width: 46px; height: 34px; border-radius: 11px; background: #1F6B3F; display: flex; align-items: center; justify-content: center; margin-top: 3px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A948C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a7.5 7.5 0 0 1-11 6.7L4.5 19.5l1.3-4.3A7.5 7.5 0 1 1 20 11.5z"></path></svg>
      <span style="font-size: 10.5px; font-weight: 500; color: #8A948C;">Chats</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A948C" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8.4" r="3.5"></circle><path d="M5 20c0-3.4 3.1-5.4 7-5.4s7 2 7 5.4"></path></svg>
      <span style="font-size: 10.5px; font-weight: 500; color: #8A948C;">You</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const card = (title, who, likes, tag, hue, av, h, art) => ({ title, who, likes, tag, hue, av, h: h + 'px', art });
    return {
      columns: [
        { cards: [
          card('Three months on this problem and it went first go', 'maren', '1,204', 'Bouldering', '#1F6B3F', '#cfdcd2', 237,
               'linear-gradient(160deg, #9db089 0%, #6f8464 55%, #4b5c43 100%)'),
          card('Chalk, humidity, and why September is the month', 'perla', '318', 'Bouldering', '#1F6B3F', '#dcd6cb', 178,
               'linear-gradient(160deg, #c3bda9 0%, #8d8a73 100%)'),
        ] },
        { cards: [
          card('Redstart on the reservoir wall', 'nadia', '892', 'Birding', '#B65A2E', '#e3d3c6', 178,
               'linear-gradient(160deg, #d4a882 0%, #9c6f4e 100%)'),
          card('Reduction firing notes, cone 10 — second attempt', 'rue', '241', 'Ceramics', '#1B6E72', '#c9dcda', 237,
               'linear-gradient(160deg, #a8c3c0 0%, #6d8b89 55%, #47605e 100%)'),
        ] },
      ],
    };
  }
}
</script>
</body>
</html>
