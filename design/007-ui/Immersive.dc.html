<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #7ee89b; } a:hover { color: #9df0b3; }
    .d { font-family: 'Bricolage Grotesque', system-ui, sans-serif; }
    .b { font-family: 'Schibsted Grotesk', system-ui, sans-serif; }
  </style>
</helmet>

<!-- THE POST FILLS THE SCREEN. Sideways moves between interests, down moves
     through the posts inside one — so the axis you swipe IS the organising
     principle, not a label on a card. -->
<div class="b" style="width: 390px; height: 844px; background: #000; color: #fff; overflow: hidden; position: relative;">

  <div style="position: absolute; inset: 0; background:
      radial-gradient(105% 70% at 28% 18%, #86b06c 0%, rgba(134,176,108,0) 58%),
      radial-gradient(95% 65% at 82% 52%, #4d8f74 0%, rgba(77,143,116,0) 62%),
      linear-gradient(163deg, #33502f 0%, #060c07 100%);"></div>
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 26%, rgba(0,0,0,0) 46%, rgba(0,0,0,0.82) 100%);"></div>

  <div style="position: absolute; top: 44px; left: 0; right: 0;">
    <!-- the interests you follow, as the horizontal axis -->
    <div style="display: flex; gap: 20px; padding: 8px 18px 0; align-items: center; overflow: hidden;">
      <sc-for list="{{axis}}" as="a" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 7px; flex-shrink: 0;">
          <span class="d" style="font-size: {{a.size}}; font-weight: 700; letter-spacing: -0.02em; color: {{a.fg}};">{{a.name}}</span>
          <div style="height: 2px; width: 100%; border-radius: 2px; background: {{a.bar}};"></div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- position within this interest -->
  <div style="position: absolute; right: 9px; top: 300px; display: flex; flex-direction: column; gap: 6px; align-items: center;">
    <div style="width: 3px; height: 22px; border-radius: 2px; background: #fff;"></div>
    <div style="width: 3px; height: 10px; border-radius: 2px; background: rgba(255,255,255,0.42);"></div>
    <div style="width: 3px; height: 10px; border-radius: 2px; background: rgba(255,255,255,0.42);"></div>
    <div style="width: 3px; height: 10px; border-radius: 2px; background: rgba(255,255,255,0.28);"></div>
  </div>

  <!-- actions ride the right edge, off the photograph's subject -->
  <div style="position: absolute; right: 14px; bottom: 168px; display: flex; flex-direction: column; gap: 22px; align-items: center;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M12 20.4S4.4 15.7 4.4 10.6A4.3 4.3 0 0 1 12 7.7a4.3 4.3 0 0 1 7.6 2.9c0 5.1-7.6 9.8-7.6 9.8z"></path></svg>
      <span style="font-size: 11px; font-weight: 600;">148</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a7.5 7.5 0 0 1-11 6.6L4.5 20l1.4-4.2A7.5 7.5 0 1 1 20 12z"></path></svg>
      <span style="font-size: 11px; font-weight: 600;">23</span>
    </div>
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-7-6 16-2.5-6.5L4 12z"></path></svg>
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v16l-6-4.5L6 20V4z"></path></svg>
  </div>

  <div style="position: absolute; left: 18px; right: 82px; bottom: 104px; display: flex; flex-direction: column; gap: 9px;">
    <div style="display: flex; align-items: center; gap: 9px;">
      <div style="width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;">M</div>
      <span style="font-size: 14px; font-weight: 600;">maren</span>
      <div style="height: 24px; padding: 0 11px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.5); display: flex; align-items: center;">
        <span style="font-size: 11px; font-weight: 600;">Follow</span>
      </div>
    </div>
    <span style="font-size: 14px; line-height: 19px; color: rgba(255,255,255,0.94); text-wrap: pretty;">First clean send of the season. Three months on this one problem.</span>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.72) 40%); display: flex; align-items: flex-start; padding-top: 11px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="#fff"><rect x="3" y="4" width="18" height="16" rx="3"></rect></svg>
      <span style="font-size: 10px; font-weight: 600;">Feed</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.62)" stroke-width="1.7" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M15.2 8.8l-1.9 4.5-4.5 1.9 1.9-4.5 4.5-1.9z"></path></svg>
      <span style="font-size: 10px; font-weight: 500; color: rgba(255,255,255,0.62);">Explore</span>
    </div>
    <div style="flex-grow: 1; display: flex; justify-content: center;">
      <div style="width: 44px; height: 44px; border-radius: 14px; background: #7ee89b; display: flex; align-items: center; justify-content: center; margin-top: -4px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#05210e" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.62)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a7.5 7.5 0 0 1-11 6.7L4.5 19.5l1.3-4.3A7.5 7.5 0 1 1 20 11.5z"></path></svg>
      <span style="font-size: 10px; font-weight: 500; color: rgba(255,255,255,0.62);">Chats</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.62)" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8.4" r="3.5"></circle><path d="M5 20c0-3.4 3.1-5.4 7-5.4s7 2 7 5.4"></path></svg>
      <span style="font-size: 10px; font-weight: 500; color: rgba(255,255,255,0.62);">You</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const on  = (name) => ({ name, size: '20px', fg: '#ffffff', bar: '#7ee89b' });
    const off = (name) => ({ name, size: '20px', fg: 'rgba(255,255,255,0.42)', bar: 'transparent' });
    return { axis: [on('Bouldering'), off('Birding'), off('Ceramics'), off('Film')] };
  }
}
</script>
</body>
</html>
