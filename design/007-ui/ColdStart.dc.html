<!doctype html>
<html><head><meta charset="utf-8"><script src="./support.js"></script></head><body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>body{margin:0}a{color:#1F6B3F}a:hover{color:#17542f}.t{font-family:'Plus Jakarta Sans',system-ui,sans-serif}</style>
</helmet>
<div class="t" style="width:390px;height:844px;background:#FBFAF8;color:#16211A;overflow:hidden;display:flex;flex-direction:column;">
  <div style="height:44px;flex-shrink:0;"></div>
  <!-- COLD START. A ranked feed has nothing to learn from on day one, so the
       first session asks once. After this the feed is ranked and never asks
       again — these are a seed, not a subscription. -->
  <div style="flex-shrink:0;padding:14px 20px 0;">
    <div style="height:3px;background:#ECEAE4;border-radius:2px;"><div style="width:62%;height:3px;background:#1F6B3F;border-radius:2px;"></div></div>
    <div style="padding-top:22px;display:flex;flex-direction:column;gap:8px;">
      <span style="font-size:24px;font-weight:700;letter-spacing:-0.025em;line-height:30px;">What are you into?</span>
      <span style="font-size:14px;line-height:20px;color:#43514A;">Pick a few to start. Your feed learns from there, and you can change it whenever.</span>
    </div>
  </div>
  <div style="flex-grow:1;overflow:hidden;padding:20px 20px 0;">
    <div style="display:flex;flex-wrap:wrap;gap:9px;">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="14">
        <div style="height:40px;padding:0 15px;border-radius:20px;background:{{c.bg}};border:1px solid {{c.line}};display:flex;align-items:center;gap:8px;">
          <sc-if value="{{c.on}}" hint-placeholder-val="{{ true }}">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l5 5L19 7"></path></svg>
          </sc-if>
          <span style="font-size:14px;font-weight:600;color:{{c.fg}};">{{c.name}}</span>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="flex-shrink:0;padding:0 20px 34px;display:flex;align-items:center;gap:14px;">
    <span style="font-size:13px;font-weight:500;color:#8A948C;">4 picked</span>
    <div style="flex-grow:1;"></div>
    <div style="height:48px;padding:0 30px;border-radius:24px;background:#1F6B3F;display:flex;align-items:center;">
      <span style="font-size:15px;font-weight:600;color:#fff;">Continue</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const on = (name) => ({ name, on: true,  bg: '#1F6B3F', line: '#1F6B3F', fg: '#ffffff' });
    const off = (name) => ({ name, on: false, bg: '#FFFFFF', line: '#DDD9D0', fg: '#16211A' });
    return { chips: [on('Bouldering'), off('Trail running'), on('Birding'), off('Cycling'),
      on('Ceramics'), off('Film photography'), off('Baking'), on('Ramen'), off('Gardening'),
      off('Woodwork'), off('Sea swimming'), off('Knitting'), off('Vinyl'), off('Skateboarding')] };
  }
}
</script>
</body></html>
