<!doctype html>
<html><head><meta charset="utf-8"><script src="./support.js"></script></head><body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>body{margin:0}a{color:#1F6B3F}a:hover{color:#17542f}.t{font-family:'Plus Jakarta Sans',system-ui,sans-serif}</style>
</helmet>
<div class="t" style="width:390px;height:844px;background:#FBFAF8;color:#16211A;overflow:hidden;display:flex;flex-direction:column;">
  <div style="height:44px;flex-shrink:0;"></div>
  <div style="height:50px;flex-shrink:0;display:flex;align-items:center;gap:11px;padding:0 16px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16211A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"></path></svg>
    <span style="font-size:18px;font-weight:700;letter-spacing:-0.018em;">Settings</span>
  </div>
  <div style="flex-grow:1;overflow:hidden;padding:8px 0 0;">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div style="padding-bottom:20px;">
        <div style="padding:0 16px 8px;"><span style="font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#8A948C;">{{g.title}}</span></div>
        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
          <div style="display:flex;align-items:center;gap:12px;min-height:50px;padding:8px 16px;background:#FFFFFF;border-top:1px solid #F1EFE9;">
            <span style="font-size:14.5px;font-weight:500;flex-grow:1;color:{{r.fg}};">{{r.label}}</span>
            <sc-if value="{{r.isToggle}}" hint-placeholder-val="{{ true }}">
              <div style="width:44px;height:26px;border-radius:13px;background:{{r.on}};display:flex;align-items:center;justify-content:{{r.align}};padding:0 3px;">
                <div style="width:20px;height:20px;border-radius:50%;background:#fff;"></div>
              </div>
            </sc-if>
            <sc-if value="{{r.isLink}}" hint-placeholder-val="{{ false }}">
              <div style="display:flex;align-items:center;gap:8px;">
                <span style="font-size:13.5px;color:#8A948C;">{{r.value}}</span>
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#C8CFC9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
              </div>
            </sc-if>
          </div>
        </sc-for>
        <div style="height:1px;background:#F1EFE9;"></div>
        <sc-if value="{{g.note}}" hint-placeholder-val="{{ false }}">
          <div style="padding:9px 16px 0;">
            <span style="font-size:12px;line-height:17px;color:#8A948C;text-wrap:pretty;">{{g.noteText}}</span>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tog = (label, on) => ({ label, isToggle: true, isLink: false, value: '', fg: '#16211A',
      on: on ? '#1F6B3F' : '#DDD9D0', align: on ? 'flex-end' : 'flex-start' });
    const link = (label, value, fg) => ({ label, isToggle: false, isLink: true, value, fg: fg || '#16211A', on: '', align: '' });
    return { groups: [
      { title: 'Notifications', note: false, noteText: '', rows: [
        tog('Likes', true), tog('Comments', true), tog('New followers', false), tog('Messages', true) ] },
      // Dropping the "why you're seeing this" sheet removed the explanation
      // from the post, not the obligation. It lives here instead.
      { title: 'Your feed', note: true,
        noteText: 'Your feed is ranked from what you open, how long you stay, and what you save. Clearing resets it to the interests you picked.',
        rows: [ link('What your feed is built from', '', ''), link('Clear my feed signals', '', '#C0392B') ] },
      { title: 'Account', note: false, noteText: '', rows: [
        link('Blocked people', '3'), link('Privacy', ''), link('Sign out', '', '#C0392B') ] },
    ] };
  }
}
</script>
</body></html>
