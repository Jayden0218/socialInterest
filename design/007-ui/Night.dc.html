<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #FF4A2E; } a:hover { color: #e03a20; }
    .sy { font-family: 'Syne', system-ui, sans-serif; }
    .mo { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
    .stamp { font-size: 9px; font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase; }
  </style>
</helmet>

<div class="mo" style="width: 390px; height: 844px; background: #141A15; color: #F0EADC; overflow: hidden; position: relative; display: flex; flex-direction: column;">

  <!-- THE SAME PRESS, ON BLACK STOCK. Grain screens instead of multiplying,
       and the inks stay exactly as they are — that is what makes it one
       language rather than two themes. -->
  <svg style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.22; mix-blend-mode: screen; z-index: 40;">
    <filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence></filter>
    <rect width="100%" height="100%" filter="url(#g)"></rect>
  </svg>

  <div style="height: 44px; flex-shrink: 0;"></div>

  <div style="flex-shrink: 0; padding: 4px 14px 0;">
    <div style="display: flex; align-items: flex-end; justify-content: space-between;">
      <div style="position: relative;">
        <!-- the wordmark sits on a mis-registered ink block: the signature -->
        <div style="position: absolute; left: 3px; top: 7px; width: 104px; height: 20px; background: #FF4A2E;"></div>
        <span class="sy" style="position: relative; font-size: 29px; font-weight: 800; letter-spacing: -0.035em; line-height: 1;">INTEREST</span>
      </div>
      <div style="display: flex; gap: 14px; padding-bottom: 3px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F0EADC" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F0EADC" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6a5.4 5.4 0 0 0-5.4 5.4c0 4-1.5 5.4-2 5.9h14.8c-.5-.5-2-1.9-2-5.9A5.4 5.4 0 0 0 12 3.6z"></path><path d="M10.5 19.4a1.7 1.7 0 0 0 3 0"></path></svg>
      </div>
    </div>
    <div style="height: 2px; background: #F0EADC; margin: 9px 0 0;"></div>
    <div style="display: flex; justify-content: space-between; padding: 5px 0 0;">
      <span class="mo stamp" style="color: #8E9A8B;">Ed. 0908 — for you</span>
      <span class="mo stamp" style="color: #8E9A8B;">No. 214</span>
    </div>
  </div>

  <!-- TWO-COLUMN WATERFALL. Column height is driven by the image, so the rows
       never line up — that misalignment is the layout, not a defect. -->
  <div style="flex-grow: 1; overflow: hidden; padding: 12px 12px 0; display: flex; gap: 10px;">
    <sc-for list="{{columns}}" as="col" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 14px; width: 178px;">
        <sc-for list="{{col.cards}}" as="c" hint-placeholder-count="2">
          <div style="position: relative;">
            <!-- MIS-REGISTRATION: the ink block sits 4px off, like a plate that
                 did not quite line up. One move, and nothing in this market
                 looks like it. -->
            <div style="position: absolute; left: 4px; top: 5px; width: 178px; height: {{c.h}}; background: {{c.ink}}; border-radius: 3px;"></div>
            <div style="position: relative; width: 178px; height: {{c.h}}; border-radius: 3px; overflow: hidden; background: {{c.art}};">
              <div style="position: absolute; left: 7px; top: 7px; display: flex; align-items: center; gap: 5px; height: 19px; padding: 0 7px; background: #141A15;">
                <div style="width: 5px; height: 5px; background: {{c.ink}};"></div>
                <span class="mo stamp" style="color: #F0EADC;">{{c.tag}}</span>
              </div>
            </div>
            <div style="padding: 9px 1px 0; display: flex; flex-direction: column; gap: 7px;">
              <span class="sy" style="font-size: 14px; font-weight: 700; line-height: 17px; letter-spacing: -0.015em; color: #F0EADC; text-wrap: pretty;">{{c.title}}</span>
              <div style="display: flex; align-items: center; gap: 6px;">
                <div style="width: 16px; height: 16px; border-radius: 50%; background: {{c.ink}};"></div>
                <span class="mo" style="font-size: 10px; color: #8E9A8B;">{{c.who}}</span>
                <div style="flex-grow: 1;"></div>
                <svg width="11" height="11" viewBox="0 0 24 24" fill="#8E9A8B"><path d="M12 20.6S4.2 15.8 4.2 10.6A4.4 4.4 0 0 1 12 7.6a4.4 4.4 0 0 1 7.8 3c0 5.2-7.8 10-7.8 10z"></path></svg>
                <span class="mo" style="font-size: 10px; color: #8E9A8B;">{{c.likes}}</span>
              </div>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <div style="height: 74px; flex-shrink: 0; background: #141A15; border-top: 2px solid #F0EADC; display: flex; align-items: center; z-index: 30;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 12px;">
        <sc-if value="{{t.plus}}" hint-placeholder-val="{{ false }}">
          <div style="width: 46px; height: 30px; background: #FF4A2E; display: flex; align-items: center; justify-content: center; margin-top: 12px;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#141A15" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          </div>
        </sc-if>
        <sc-if value="{{t.normal}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 12px;">
            <div style="height: 3px; width: 20px; background: {{t.bar}};"></div>
            <span class="mo stamp" style="color: {{t.fg}};">{{t.label}}</span>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // Duotone plates: one ink over the paper, the way a riso lays down colour.
    const card = (title, who, likes, tag, ink, h) => ({
      title, who, likes, tag, ink, h: h + 'px',
      art: 'linear-gradient(155deg, ' + ink + ' 0%, ' + ink + '99 42%, #141A15 130%)',
    });
    return {
      columns: [
        { cards: [
          card('Three months on one problem, and it went first go this morning', 'maren', '1204', 'Bouldering', '#2F6B3F', 237),
          card('Chalk, humidity, and why September is the month', 'perla', '318', 'Bouldering', '#2F6B3F', 178),
        ] },
        { cards: [
          card('Redstart on the reservoir wall', 'nadia', '892', 'Birding', '#FF6A3D', 178),
          card('Reduction firing notes — cone 10, second attempt', 'rue', '241', 'Ceramics', '#0F8C8C', 237),
        ] },
      ],
      tabs: [
        { label: 'Feed', normal: true, plus: false, fg: '#F0EADC', bar: '#FF4A2E' },
        { label: 'Look', normal: true, plus: false, fg: '#8E9A8B', bar: 'transparent' },
        { label: '', normal: false, plus: true, fg: '', bar: '' },
        { label: 'Talk', normal: true, plus: false, fg: '#8E9A8B', bar: 'transparent' },
        { label: 'You', normal: true, plus: false, fg: '#8E9A8B', bar: 'transparent' },
      ],
    };
  }
}
</script>
</body>
</html>
