<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #6ad987; } a:hover { color: #8fe6a5; }
    .ui { font-family: 'Schibsted Grotesk', system-ui, sans-serif; }
    .serif { font-family: 'Instrument Serif', Georgia, serif; }
  </style>
</helmet>

<div class="ui" style="width: 390px; height: 844px; background: #0a170d; color: #f0f7f2; overflow: hidden; display: flex; flex-direction: column;">

  <!-- MEDIA FIRST, LITERALLY: it starts at the top edge and the controls float
       on it. No card, no header bar stealing 100px above the photograph. -->
  <div style="position: relative; width: 390px; height: 470px; flex-shrink: 0;
       background:
         radial-gradient(110% 80% at 25% 15%, #6f9a5e 0%, rgba(111,154,94,0) 58%),
         radial-gradient(95% 75% at 85% 45%, #3f7d6a 0%, rgba(63,125,106,0) 62%),
         linear-gradient(165deg, #2a4530 0%, #0c1a11 100%);">

    <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4,14,6,0.55) 0%, rgba(4,14,6,0) 22%, rgba(4,14,6,0) 58%, rgba(4,14,6,0.75) 100%);"></div>

    <div style="position: absolute; top: 44px; left: 0; right: 0; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
      <div style="width: 34px; height: 34px; border-radius: 50%; background: rgba(4,14,6,0.45); display: flex; align-items: center; justify-content: center;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#f0f7f2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"></path></svg>
      </div>
      <div style="width: 34px; height: 34px; border-radius: 50%; background: rgba(4,14,6,0.45); display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#f0f7f2"><circle cx="5" cy="12" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="19" cy="12" r="1.7"></circle></svg>
      </div>
    </div>

    <!-- the interest, over the media, in its own hue -->
    <div style="position: absolute; left: 20px; bottom: 18px; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px 0 10px; border-radius: 9px; background: rgba(4,14,6,0.55); border: 1px solid rgba(79,191,122,0.45);">
      <div style="width: 7px; height: 7px; border-radius: 50%; background: #4fbf7a;"></div>
      <span style="font-size: 13px; font-weight: 600; color: #a9e2bd;">Bouldering</span>
    </div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 0 20px;">

    <div style="display: flex; align-items: center; gap: 20px; padding: 14px 0 0;">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="#f97770" stroke="none"><path d="M12 20.4S4.4 15.7 4.4 10.6A4.3 4.3 0 0 1 12 7.7a4.3 4.3 0 0 1 7.6 2.9c0 5.1-7.6 9.8-7.6 9.8z"></path></svg>
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#f0f7f2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a7.5 7.5 0 0 1-11 6.6L4.5 20l1.4-4.2A7.5 7.5 0 1 1 20 12z"></path></svg>
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#f0f7f2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-7-6 16-2.5-6.5L4 12z"></path></svg>
      <div style="flex-grow: 1;"></div>
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#f0f7f2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v16l-6-4.5L6 20V4z"></path></svg>
    </div>

    <div style="padding: 12px 0 0; display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 13px; font-weight: 600; color: #c6d1c9;">148 likes</span>
      <div style="display: flex; gap: 10px; align-items: flex-start;">
        <div style="width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; background: linear-gradient(140deg, #2f5a3d, #16301f); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #cfe6d6;">M</div>
        <div style="font-size: 14px; line-height: 20px; color: #f0f7f2; text-wrap: pretty;"><span style="font-weight: 600;">maren</span> First clean send of the season. Three months on this one problem, and the last move still surprised me.</div>
      </div>
      <span style="font-size: 12px; color: #9ca89e; padding-left: 38px;">2 hours ago</span>
    </div>

    <div style="height: 1px; background: #2c392f; margin: 16px 0 0;"></div>

    <div style="padding: 14px 0 0; display: flex; flex-direction: column; gap: 14px;">
      <sc-for list="{{comments}}" as="c" hint-placeholder-count="2">
        <div style="display: flex; gap: 10px; align-items: flex-start;">
          <div style="width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; background: {{c.av}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #0a170d;">{{c.initial}}</div>
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <div style="font-size: 14px; line-height: 19px; color: #f0f7f2;"><span style="font-weight: 600;">{{c.who}}</span> {{c.text}}</div>
            <span style="font-size: 12px; color: #9ca89e;">{{c.when}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- a real composer, anchored -->
  <div style="flex-shrink: 0; padding: 12px 20px 26px; border-top: 1px solid #2c392f; background: #0d1c11; display: flex; align-items: center; gap: 10px;">
    <div style="flex-grow: 1; height: 42px; border-radius: 12px; background: #142519; border: 1px solid #2c392f; display: flex; align-items: center; padding: 0 14px;">
      <span style="font-size: 14px; color: #9ca89e;">Add a comment…</span>
    </div>
    <div style="width: 42px; height: 42px; border-radius: 12px; background: #6ad987; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#07150b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-7-6 16-2.5-6.5L4 12z"></path></svg>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      comments: [
        { who: 'jonas', initial: 'J', av: '#8a7ce0', text: 'That heel hook is filthy. Congrats.', when: '1h' },
        { who: 'perla', initial: 'P', av: '#e0705f', text: 'Been stuck on this for weeks — any beta?', when: '42m' },
      ],
    };
  }
}
</script>
</body>
</html>
