<!doctype html>
<html><head><meta charset="utf-8"><script src="./support.js"></script></head><body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>body{margin:0}a{color:#1F6B3F}a:hover{color:#17542f}.t{font-family:'Plus Jakarta Sans',system-ui,sans-serif}</style>
</helmet>
<div class="t" style="width:390px;height:844px;background:#FBFAF8;color:#16211A;overflow:hidden;display:flex;flex-direction:column;">
  <div style="height:44px;flex-shrink:0;"></div>
  <div style="height:50px;flex-shrink:0;display:flex;align-items:center;gap:11px;padding:0 16px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16211A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"></path></svg>
    <span style="font-size:18px;font-weight:700;letter-spacing:-0.018em;">Saved</span>
    <div style="flex-grow:1;"></div>
    <span style="font-size:13.5px;color:#8A948C;">only you</span>
  </div>
  <div style="flex-grow:1;overflow:hidden;padding:8px 12px 0;display:flex;gap:10px;">
    <sc-for list="{{columns}}" as="col" hint-placeholder-count="2">
      <div style="display:flex;flex-direction:column;gap:12px;width:178px;">
        <sc-for list="{{col.cards}}" as="c" hint-placeholder-count="2">
          <div style="background:#FFFFFF;border-radius:14px;overflow:hidden;">
            <div style="width:178px;height:{{c.h}};background:{{c.art}};"></div>
            <div style="padding:10px 11px 11px;display:flex;flex-direction:column;gap:8px;">
              <span style="font-size:13.5px;font-weight:600;line-height:18px;text-wrap:pretty;">{{c.title}}</span>
              <span style="font-size:11px;font-weight:600;color:{{c.hue}};">{{c.tag}}</span>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const c = (title, tag, hue, h, art) => ({ title, tag, hue, h: h + 'px', art });
    return { columns: [
      { cards: [ c('Reduction firing notes, cone 10', 'Ceramics', '#1B6E72', 220, 'linear-gradient(160deg,#a8c3c0,#47605e)'),
                 c('Quarry traverse beta', 'Bouldering', '#1F6B3F', 160, 'linear-gradient(160deg,#b3bfa4,#6c7a5f)') ] },
      { cards: [ c('Redstart on the reservoir wall', 'Birding', '#B65A2E', 160, 'linear-gradient(160deg,#d4a882,#9c6f4e)'),
                 c('Tare recipe that finally worked', 'Ramen', '#A33A6B', 220, 'linear-gradient(160deg,#c9a9a0,#6b4a45)') ] },
    ] };
  }
}
</script>
</body></html>
