<!doctype html>
<html><head><meta charset="utf-8"><script src="./support.js"></script></head><body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>body{margin:0}a{color:#1F6B3F}a:hover{color:#17542f}.t{font-family:'Plus Jakarta Sans',system-ui,sans-serif}</style>
</helmet>
<div class="t" style="width:390px;height:844px;background:#FBFAF8;color:#16211A;overflow:hidden;display:flex;flex-direction:column;">
  <div style="height:44px;flex-shrink:0;"></div>
  <div style="height:50px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;">
    <span style="font-size:15px;font-weight:500;color:#6B7770;">Cancel</span>
    <div style="display:flex;align-items:center;gap:6px;">
      <span style="font-size:16px;font-weight:700;">Recents</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16211A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg>
    </div>
    <span style="font-size:14.5px;font-weight:600;color:#1F6B3F;">Next</span>
  </div>
  <div style="flex-shrink:0;width:390px;height:300px;background:linear-gradient(160deg,#9db089,#4b5c43);"></div>
  <div style="flex-grow:1;overflow:hidden;padding:3px 0 0;">
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="16">
        <div style="position:relative;height:96px;background:{{t.bg}};">
          <sc-if value="{{t.picked}}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute;right:6px;top:6px;width:20px;height:20px;border-radius:50%;background:#1F6B3F;display:flex;align-items:center;justify-content:center;">
              <span style="font-size:11px;font-weight:700;color:#fff;">{{t.n}}</span>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const g = ['#9db089','#c3bda9','#a8c3c0','#d4a882','#b3bfa4','#8fa87f','#cbc3b2','#9fb3ae','#c9b79c','#8d8a73','#adbba0','#bcae95','#93a89b','#c7bda6','#9aa88f','#b8a894'];
    return { tiles: g.map((c, i) => ({ bg: 'linear-gradient(160deg,' + c + ',#5c6650)', picked: i === 0 || i === 3, n: i === 0 ? '1' : '2' })) };
  }
}
</script>
</body></html>
