<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #9ae6a8; } a:hover { color: #b6f0c0; }
    .d { font-family: 'Bricolage Grotesque', system-ui, sans-serif; }
    .b { font-family: 'Schibsted Grotesk', system-ui, sans-serif; }
  </style>
</helmet>

<div class="b" style="width: 390px; height: 844px; background: #080f0a; color: #eaf2ec; overflow: hidden; display: flex; flex-direction: column;">

  <div style="height: 44px; flex-shrink: 0;"></div>

  <div style="flex-shrink: 0; padding: 6px 22px 14px;">
    <span class="d" style="font-size: 13px; font-weight: 600; letter-spacing: 0.02em; color: #7d8c81;">Tuesday morning</span>
    <div class="d" style="font-size: 31px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.1; padding-top: 3px;">Five rooms are awake</div>
  </div>

  <!-- AN INTEREST IS A PLACE YOU ENTER, and each has its own light. You do not
       scroll a blended stream; you choose which room to step into. -->
  <div style="flex-grow: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 12px;">
    <sc-for list="{{rooms}}" as="r" hint-placeholder-count="4">
      <div style="position: relative; height: {{r.h}}; border-radius: 20px; overflow: hidden; background: {{r.bg}}; flex-shrink: 0;">
        <div style="position: absolute; inset: 0; background: {{r.veil}};"></div>
        <div style="position: absolute; left: 20px; right: 20px; bottom: 16px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;">
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <span class="d" style="font-size: {{r.size}}; font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: #ffffff;">{{r.name}}</span>
            <span style="font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.72);">{{r.line}}</span>
          </div>
          <div style="width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
          </div>
        </div>
        <div style="position: absolute; left: 20px; top: 16px; display: flex; align-items: center; gap: 7px; height: 25px; padding: 0 11px; border-radius: 13px; background: rgba(0,0,0,0.3);">
          <div style="width: 6px; height: 6px; border-radius: 50%; background: #7ef29a;"></div>
          <span style="font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.9);">{{r.count}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="height: 80px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px 6px;">
    <div style="flex-grow: 1; height: 52px; border-radius: 26px; background: rgba(255,255,255,0.055); border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-around; padding: 0 6px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="#eaf2ec"><rect x="3" y="3" width="8" height="8" rx="2.4"></rect><rect x="13" y="3" width="8" height="8" rx="2.4"></rect><rect x="3" y="13" width="8" height="8" rx="2.4"></rect><rect x="13" y="13" width="8" height="8" rx="2.4"></rect></svg>
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#7d8c81" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#7d8c81" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a7.5 7.5 0 0 1-11 6.7L4.5 19.5l1.3-4.3A7.5 7.5 0 1 1 20 11.5z"></path></svg>
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#7d8c81" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8.4" r="3.4"></circle><path d="M5.5 19.5c0-3.2 2.9-5.2 6.5-5.2s6.5 2 6.5 5.2"></path></svg>
    </div>
    <div style="width: 52px; height: 52px; border-radius: 26px; background: #7ef29a; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#062a12" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rooms: [
        { name: 'Bouldering', line: 'Maren sent her season project', count: '4 new', h: '212px', size: '30px',
          bg: 'radial-gradient(120% 100% at 20% 10%, #6f9e5f 0%, rgba(111,158,95,0) 62%), linear-gradient(150deg, #38562f 0%, #101c12 100%)',
          veil: 'linear-gradient(180deg, rgba(0,0,0,0.05) 40%, rgba(0,0,0,0.62) 100%)' },
        { name: 'Birding', line: 'Nadia · redstart at the reservoir', count: '2 new', h: '164px', size: '26px',
          bg: 'radial-gradient(120% 100% at 80% 15%, #c07a5e 0%, rgba(192,122,94,0) 60%), linear-gradient(150deg, #5c3f30 0%, #170f0c 100%)',
          veil: 'linear-gradient(180deg, rgba(0,0,0,0.05) 40%, rgba(0,0,0,0.6) 100%)' },
        { name: 'Ceramics', line: 'Reduction firing, cone 10', count: '1 new', h: '132px', size: '23px',
          bg: 'radial-gradient(120% 100% at 25% 20%, #4fa7ad 0%, rgba(79,167,173,0) 60%), linear-gradient(150deg, #2b5254 0%, #0d1817 100%)',
          veil: 'linear-gradient(180deg, rgba(0,0,0,0.05) 40%, rgba(0,0,0,0.6) 100%)' },
        { name: 'Film photography', line: 'Quiet since Sunday', count: 'resting', h: '96px', size: '20px',
          bg: 'linear-gradient(150deg, #23323f 0%, #0c1116 100%)',
          veil: 'linear-gradient(180deg, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.55) 100%)' },
      ],
    };
  }
}
</script>
</body>
</html>
