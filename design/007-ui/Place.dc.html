<!doctype html>
<html><head><meta charset="utf-8"><script src="./support.js"></script></head><body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>body{margin:0}a{color:#1F6B3F}a:hover{color:#17542f}.t{font-family:'Plus Jakarta Sans',system-ui,sans-serif}</style>
</helmet>
<div class="t" style="width:390px;height:844px;background:#FBFAF8;color:#16211A;overflow:hidden;display:flex;flex-direction:column;">
  <div style="height:44px;flex-shrink:0;"></div>
  <div style="height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16211A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"></path></svg>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="#16211A"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
  </div>
  <div style="flex-shrink:0;width:390px;height:190px;background:linear-gradient(160deg,#b3bfa4,#5f6d52);"></div>
  <div style="flex-shrink:0;padding:16px 16px 0;display:flex;flex-direction:column;gap:8px;">
    <span style="font-size:23px;font-weight:700;letter-spacing:-0.025em;line-height:28px;">The Depot Climbing</span>
    <span style="font-size:13.5px;color:#6B7770;">Bouldering gym · Armley, Leeds</span>
    <div style="display:flex;align-items:center;gap:9px;padding-top:2px;">
      <div style="display:flex;gap:2px;">
        <sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="{{s}}"><path d="M12 3l2.7 5.8 6.3.8-4.6 4.3 1.2 6.2L12 17.2 6.4 20.1l1.2-6.2L3 9.6l6.3-.8L12 3z"></path></svg>
        </sc-for>
      </div>
      <span style="font-size:13.5px;font-weight:600;">4.6</span>
      <span style="font-size:13px;color:#8A948C;">· 214 ratings</span>
    </div>
    <div style="display:flex;gap:10px;padding:8px 0 0;">
      <div style="flex-grow:1;height:42px;border-radius:21px;background:#1F6B3F;display:flex;align-items:center;justify-content:center;">
        <span style="font-size:14px;font-weight:600;color:#fff;">Rate this place</span>
      </div>
      <div style="flex-grow:1;height:42px;border-radius:21px;border:1px solid #DDD9D0;display:flex;align-items:center;justify-content:center;">
        <span style="font-size:14px;font-weight:600;">Follow</span>
      </div>
    </div>
    <!-- following a place does NOT put its posts in your feed (004/FR-019),
         so it never carries the interest colour treatment -->
  </div>
  <div style="flex-grow:1;overflow:hidden;padding:18px 16px 0;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;">
      <span style="font-size:15px;font-weight:700;">Reviews</span>
      <span style="font-size:13.5px;font-weight:600;color:#1F6B3F;">See all</span>
    </div>
    <sc-for list="{{reviews}}" as="r" hint-placeholder-count="2">
      <div style="display:flex;gap:11px;padding-bottom:15px;">
        <div style="width:34px;height:34px;border-radius:50%;background:{{r.av}};flex-shrink:0;"></div>
        <div style="display:flex;flex-direction:column;gap:4px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="font-size:13.5px;font-weight:600;">{{r.who}}</span>
            <span style="font-size:12px;font-weight:600;color:#B8862B;">{{r.score}}</span>
            <span style="font-size:11.5px;color:#8A948C;">{{r.when}}</span>
          </div>
          <span style="font-size:13.5px;line-height:19px;color:#43514A;text-wrap:pretty;">{{r.text}}</span>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      stars: ['#B8862B','#B8862B','#B8862B','#B8862B','#E0DACE'],
      reviews: [
        { who: 'jonas', score: '★ 5', when: '2d', av: '#d8d2e4', text: 'Reset every Tuesday and the setting has been excellent all autumn.' },
        { who: 'ilse', score: '★ 4', when: '1w', av: '#d5dcc9', text: 'Gets busy after six. Go in the morning if you can.' },
      ],
    };
  }
}
</script>
</body></html>
