<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #7ee89b; } a:hover { color: #9df0b3; }
    .d { font-family: 'Bricolage Grotesque', system-ui, sans-serif; }
    .b { font-family: 'Schibsted Grotesk', system-ui, sans-serif; }
  </style>
</helmet>

<div class="b" style="width: 390px; height: 844px; background: #000; color: #fff; overflow: hidden; position: relative;">

  <!-- the post, dimmed behind the sheet -->
  <div style="position: absolute; inset: 0; background:
      radial-gradient(105% 70% at 30% 16%, #8fb673 0%, rgba(143,182,115,0) 56%),
      linear-gradient(163deg, #2f4a2c 0%, #050a06 100%);"></div>
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.62);"></div>

  <!-- A RECOMMENDER THAT CANNOT BE CORRECTED IS A TRAP. If the feed is learned
       from behaviour, the person has to be able to see why and say no. This is
       also where Principle III lands: the signals are named, not hidden. -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #10171200; border-radius: 24px 24px 0 0; overflow: hidden;">
    <div style="background: #121a15; padding: 10px 0 30px;">

      <div style="display: flex; justify-content: center; padding-bottom: 16px;">
        <div style="width: 38px; height: 4px; border-radius: 2px; background: #38473c;"></div>
      </div>

      <div style="padding: 0 22px 4px;">
        <span class="d" style="font-size: 21px; font-weight: 700; letter-spacing: -0.02em;">Why you're seeing this</span>
      </div>

      <!-- the actual reasons, in the person's terms -->
      <div style="padding: 12px 22px 0; display: flex; flex-direction: column; gap: 11px;">
        <sc-for list="{{reasons}}" as="r" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div style="width: 30px; height: 30px; border-radius: 9px; background: rgba(126,232,155,0.13); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
              <div style="width: 12px; height: 12px; border-radius: 3px; background: #7ee89b; opacity: {{r.weight}};"></div>
            </div>
            <span style="font-size: 14px; line-height: 19px; color: #dbe6dd;">{{r.text}}</span>
          </div>
        </sc-for>
      </div>

      <div style="height: 1px; background: #24302a; margin: 20px 22px;"></div>

      <div style="padding: 0 22px; display: flex; flex-direction: column; gap: 9px;">
        <sc-for list="{{actions}}" as="a" hint-placeholder-count="4">
          <div style="height: 52px; border-radius: 14px; background: {{a.bg}}; border: 1px solid {{a.line}}; display: flex; align-items: center; gap: 13px; padding: 0 16px;">
            <div style="width: 20px; height: 20px; border-radius: 6px; background: {{a.mark}}; flex-shrink: 0;"></div>
            <span style="font-size: 15px; font-weight: 600; color: {{a.fg}};">{{a.label}}</span>
          </div>
        </sc-for>
      </div>

      <div style="padding: 18px 22px 0;">
        <span style="font-size: 12px; line-height: 17px; color: #7f8d84; text-wrap: pretty;">Your feed is built from what you open, how long you stay, and what you save. You can clear these signals any time in Settings.</span>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      reasons: [
        { text: 'You watch climbing posts to the end more often than anything else', weight: '1' },
        { text: 'You saved three posts tagged Bouldering this week', weight: '0.68' },
        { text: 'People who like what you like are liking this', weight: '0.4' },
      ],
      actions: [
        { label: 'More like this',            bg: 'rgba(126,232,155,0.12)', line: 'rgba(126,232,155,0.3)',  mark: '#7ee89b', fg: '#c9f5d5' },
        { label: 'Less like this',            bg: 'rgba(255,255,255,0.05)', line: '#24302a',                mark: '#5d6b62', fg: '#dbe6dd' },
        { label: 'Not interested in Bouldering', bg: 'rgba(255,255,255,0.05)', line: '#24302a',             mark: '#5d6b62', fg: '#dbe6dd' },
        { label: 'Report this post',          bg: 'rgba(255,95,109,0.10)',  line: 'rgba(255,95,109,0.28)',  mark: '#ff5f6d', fg: '#ffc4c8' },
      ],
    };
  }
}
</script>
</body>
</html>
