<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #6ad987; } a:hover { color: #8fe6a5; }
    .ui { font-family: 'Schibsted Grotesk', system-ui, sans-serif; }
    .serif { font-family: 'Instrument Serif', Georgia, serif; }
  </style>
</helmet>

<div class="ui" style="width: 390px; height: 844px; background: #0a170d; color: #f0f7f2; overflow: hidden; display: flex; flex-direction: column;">

  <div style="height: 44px; flex-shrink: 0;"></div>

  <div style="height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px;">
    <span style="font-size: 15px; font-weight: 600; color: #f0f7f2;">@maren</span>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c6d1c9" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
  </div>

  <div style="padding: 14px 20px 0; flex-shrink: 0;">
    <div style="display: flex; align-items: center; gap: 18px;">
      <div style="width: 78px; height: 78px; border-radius: 50%; flex-shrink: 0; background: linear-gradient(145deg, #3d7a52, #16301f); display: flex; align-items: center; justify-content: center;">
        <span class="serif" style="font-size: 34px; color: #dcefe2; line-height: 1;">M</span>
      </div>
      <div style="display: flex; flex-grow: 1; justify-content: space-around;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
          <span style="font-size: 18px; font-weight: 700;">142</span>
          <span style="font-size: 12px; color: #9ca89e;">posts</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
          <span style="font-size: 18px; font-weight: 700;">1,204</span>
          <span style="font-size: 12px; color: #9ca89e;">followers</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
          <span style="font-size: 18px; font-weight: 700;">17</span>
          <span style="font-size: 12px; color: #9ca89e;">interests</span>
        </div>
      </div>
    </div>

    <div style="padding: 14px 0 0; display: flex; flex-direction: column; gap: 3px;">
      <span class="serif" style="font-size: 24px; line-height: 1.1;">Maren Kohl</span>
      <span style="font-size: 14px; line-height: 20px; color: #c6d1c9; text-wrap: pretty;">Climbing, clay, and things with feathers. Mostly outdoors.</span>
    </div>

    <!-- WHAT THIS PERSON IS INTO — the identity a person-follow does not widen.
         Each carries its own hue, so a profile is legible at a glance. -->
    <div style="display: flex; gap: 7px; padding: 14px 0 0; overflow: hidden;">
      <sc-for list="{{interests}}" as="i" hint-placeholder-count="4">
        <div style="height: 30px; padding: 0 11px 0 9px; border-radius: 9px; background: {{i.bg}}; border: 1px solid {{i.line}}; display: flex; align-items: center; gap: 7px; flex-shrink: 0;">
          <div style="width: 6px; height: 6px; border-radius: 50%; background: {{i.hue}};"></div>
          <span style="font-size: 12px; font-weight: 600; color: {{i.fg}};">{{i.name}}</span>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; gap: 9px; padding: 16px 0 0;">
      <div style="flex-grow: 1; height: 42px; border-radius: 12px; border: 1px solid #2c392f; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #f0f7f2;">Edit profile</div>
      <div style="flex-grow: 1; height: 42px; border-radius: 12px; border: 1px solid #2c392f; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #f0f7f2;">Saved</div>
    </div>
  </div>

  <!-- underline tabs, not two more pills -->
  <div style="display: flex; padding: 20px 20px 0; gap: 26px; flex-shrink: 0; border-bottom: 1px solid #1c2a20;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 9px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="#f0f7f2"><rect x="3" y="3" width="7.5" height="7.5" rx="1.4"></rect><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.4"></rect><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.4"></rect><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.4"></rect></svg>
      <div style="height: 2px; width: 34px; background: #6ad987; border-radius: 2px;"></div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 9px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#9ca89e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v16l-6-4.5L6 20V4z"></path></svg>
      <div style="height: 2px; width: 34px; background: transparent;"></div>
    </div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 3px 0 0;">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px;">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="9">
        <div style="height: 128px; background: {{t.bg}};"></div>
      </sc-for>
    </div>
  </div>

  <div style="height: 78px; flex-shrink: 0; background: #0d1c11; border-top: 1px solid #2c392f; display: flex; align-items: flex-start; padding-top: 12px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9ca89e" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3.9L20 10v10a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1V10l8-6.1z"></path></svg>
      <span style="font-size: 10px; font-weight: 500; color: #9ca89e;">Feed</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9ca89e" stroke-width="1.6" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M15.2 8.8l-1.9 4.5-4.5 1.9 1.9-4.5 4.5-1.9z"></path></svg>
      <span style="font-size: 10px; font-weight: 500; color: #9ca89e;">Discover</span>
    </div>
    <div style="flex-grow: 1; display: flex; justify-content: center;">
      <div style="width: 46px; height: 46px; border-radius: 15px; background: #6ad987; display: flex; align-items: center; justify-content: center; margin-top: -5px; box-shadow: 0 6px 18px rgba(106,217,135,0.28);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#07150b" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9ca89e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a7.5 7.5 0 0 1-11 6.7L4.5 19.5l1.3-4.3A7.5 7.5 0 1 1 20 11.5z"></path></svg>
      <span style="font-size: 10px; font-weight: 500; color: #9ca89e;">Chats</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#6ad987" stroke="none"><circle cx="12" cy="8.2" r="4"></circle><path d="M4.4 20.4c0-3.8 3.4-6 7.6-6s7.6 2.2 7.6 6z"></path></svg>
      <span style="font-size: 10px; font-weight: 600; color: #6ad987;">You</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const chip = (name, hue) => ({
      name, hue,
      bg: 'rgba(255,255,255,0.045)',
      line: 'rgba(255,255,255,0.09)',
      fg: '#d5e2d9',
    });
    const t = (a, b) => ({ bg: 'linear-gradient(150deg, ' + a + ', ' + b + ')' });
    return {
      interests: [chip('Bouldering', '#4fbf7a'), chip('Birding', '#e0705f'), chip('Ceramics', '#46b8bd'), chip('Film', '#4aa3d8')],
      tiles: [
        t('#3d6b4a', '#16301f'), t('#6d8f5c', '#22331d'), t('#2f5f56', '#12271f'),
        t('#55764a', '#1a2c1d'), t('#3a6357', '#132620'), t('#6a8b57', '#1f2f1c'),
        t('#2e5642', '#0f2016'), t('#5c8060', '#1b2c1e'), t('#476b4e', '#16281a'),
      ],
    };
  }
}
</script>
</body>
</html>
