<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #6ad987; } a:hover { color: #8fe6a5; }
    .ui { font-family: 'Schibsted Grotesk', system-ui, sans-serif; }
    .serif { font-family: 'Instrument Serif', Georgia, serif; }
  </style>
</helmet>

<div class="ui" style="width: 390px; height: 844px; background: #0a170d; color: #f0f7f2; overflow: hidden; display: flex; flex-direction: column;">

  <div style="height: 44px; flex-shrink: 0;"></div>

  <div style="height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px;">
    <span class="serif" style="font-size: 27px; line-height: 1;">Chats</span>
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#c6d1c9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-2a3 3 0 0 0-3-3H6a3 3 0 0 0-3 3v2"></path><circle cx="9.5" cy="8" r="3.2"></circle><path d="M18 8h4M20 6v4"></path></svg>
  </div>

  <!-- underline segmented control, with the count where it belongs -->
  <div style="display: flex; gap: 24px; padding: 6px 20px 0; flex-shrink: 0; border-bottom: 1px solid #1c2a20;">
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 15px; font-weight: 600; color: #f0f7f2;">Messages</span>
      <div style="height: 2px; background: #6ad987; border-radius: 2px;"></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 7px;">
        <span style="font-size: 15px; font-weight: 500; color: #9ca89e;">Requests</span>
        <div style="min-width: 19px; height: 19px; padding: 0 6px; border-radius: 10px; background: #6ad987; display: flex; align-items: center; justify-content: center;">
          <span style="font-size: 11px; font-weight: 700; color: #07150b;">2</span>
        </div>
      </div>
      <div style="height: 2px; background: transparent;"></div>
    </div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 6px 0 0;">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div style="display: flex; align-items: center; gap: 13px; padding: 11px 20px;">
        <div style="width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0; background: {{r.av}}; display: flex; align-items: center; justify-content: center; position: relative;">
          <span class="serif" style="font-size: 22px; color: #0a170d; line-height: 1;">{{r.initial}}</span>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0;">
          <div style="display: flex; align-items: baseline; gap: 8px;">
            <span style="font-size: 15px; font-weight: 600; color: #f0f7f2;">{{r.name}}</span>
            <sc-if value="{{r.isGroup}}" hint-placeholder-val="{{ true }}">
              <span style="font-size: 11px; font-weight: 600; color: #9ca89e; letter-spacing: 0.04em;">{{r.members}}</span>
            </sc-if>
          </div>
          <span style="font-size: 13px; line-height: 18px; color: {{r.previewColor}}; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 220px;">{{r.preview}}</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0;">
          <span style="font-size: 12px; color: #9ca89e;">{{r.when}}</span>
          <div style="width: 8px; height: 8px; border-radius: 50%; background: {{r.dot}};"></div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="height: 78px; flex-shrink: 0; background: #0d1c11; border-top: 1px solid #2c392f; display: flex; align-items: flex-start; padding-top: 12px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9ca89e" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3.9L20 10v10a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1V10l8-6.1z"></path></svg>
      <span style="font-size: 10px; font-weight: 500; color: #9ca89e;">Feed</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9ca89e" stroke-width="1.6" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M15.2 8.8l-1.9 4.5-4.5 1.9 1.9-4.5 4.5-1.9z"></path></svg>
      <span style="font-size: 10px; font-weight: 500; color: #9ca89e;">Discover</span>
    </div>
    <div style="flex-grow: 1; display: flex; justify-content: center;">
      <div style="width: 46px; height: 46px; border-radius: 15px; background: #6ad987; display: flex; align-items: center; justify-content: center; margin-top: -5px; box-shadow: 0 6px 18px rgba(106,217,135,0.28);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#07150b" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#6ad987" stroke="none"><path d="M12 3.2c-5 0-9 3.5-9 7.9 0 2.5 1.3 4.7 3.3 6.1l-.9 3.6 4-2.1c.8.2 1.7.3 2.6.3 5 0 9-3.5 9-7.9s-4-7.9-9-7.9z"></path></svg>
      <span style="font-size: 10px; font-weight: 600; color: #6ad987;">Chats</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9ca89e" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.6"></circle><path d="M5 20c0-3.4 3.1-5.5 7-5.5s7 2.1 7 5.5"></path></svg>
      <span style="font-size: 10px; font-weight: 500; color: #9ca89e;">You</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const unread = (o) => ({ ...o, previewColor: '#f0f7f2', dot: '#6ad987' });
    const read = (o) => ({ ...o, previewColor: '#9ca89e', dot: 'transparent' });
    return {
      rows: [
        unread({ name: 'Tuesday Climbers', isGroup: true, members: '6', initial: 'T', av: '#4fbf7a', preview: 'jonas: moving it to 7 if that works', when: '4m' }),
        unread({ name: 'perla', isGroup: false, members: '', initial: 'P', av: '#e0705f', preview: 'sent you a post', when: '22m' }),
        read({ name: 'jonas', isGroup: false, members: '', initial: 'J', av: '#8a7ce0', preview: 'that heel hook is filthy', when: '1h' }),
        read({ name: 'Kiln Share', isGroup: true, members: '11', initial: 'K', av: '#46b8bd', preview: 'firing sunday, bring greenware', when: '3h' }),
        read({ name: 'aleks', isGroup: false, members: '', initial: 'A', av: '#4aa3d8', preview: 'you: yeah I got the same lens', when: 'Tue' }),
        read({ name: 'Dawn Chorus', isGroup: true, members: '4', initial: 'D', av: '#e0705f', preview: 'nadia: 5am at the reservoir', when: 'Mon' }),
      ],
    };
  }
}
</script>
</body>
</html>
