<!doctype html>
<html><head><meta charset="utf-8"><script src="./support.js"></script></head><body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>body{margin:0}a{color:#1F6B3F}a:hover{color:#17542f}.t{font-family:'Plus Jakarta Sans',system-ui,sans-serif}</style>
</helmet>
<div class="t" style="width:390px;height:844px;background:#FBFAF8;color:#16211A;overflow:hidden;display:flex;flex-direction:column;">
  <div style="height:44px;flex-shrink:0;"></div>
  <div style="height:50px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;">
    <span style="font-size:22px;font-weight:700;letter-spacing:-0.02em;">Chats</span>
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#16211A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-2a3 3 0 0 0-3-3H6a3 3 0 0 0-3 3v2"></path><circle cx="9.5" cy="8" r="3.2"></circle><path d="M18 8h4M20 6v4"></path></svg>
  </div>
  <div style="display:flex;gap:24px;padding:0 16px;flex-shrink:0;border-bottom:1px solid #ECEAE4;">
    <div style="display:flex;flex-direction:column;gap:9px;">
      <span style="font-size:15px;font-weight:600;">Messages</span>
      <div style="height:2.5px;background:#1F6B3F;border-radius:2px;"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:9px;">
      <div style="display:flex;align-items:center;gap:7px;">
        <span style="font-size:15px;font-weight:500;color:#8A948C;">Requests</span>
        <div style="min-width:18px;height:18px;padding:0 6px;border-radius:9px;background:#1F6B3F;display:flex;align-items:center;justify-content:center;">
          <span style="font-size:11px;font-weight:700;color:#fff;">2</span>
        </div>
      </div>
      <div style="height:2.5px;background:transparent;"></div>
    </div>
  </div>
  <div style="flex-grow:1;overflow:hidden;padding:4px 0 0;">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div style="display:flex;align-items:center;gap:13px;padding:11px 16px;">
        <div style="width:50px;height:50px;border-radius:50%;background:{{r.av}};flex-shrink:0;"></div>
        <div style="flex-grow:1;display:flex;flex-direction:column;gap:3px;min-width:0;">
          <div style="display:flex;align-items:center;gap:7px;">
            <span style="font-size:14.5px;font-weight:600;">{{r.name}}</span>
            <sc-if value="{{r.isGroup}}" hint-placeholder-val="{{ true }}">
              <span style="font-size:11.5px;font-weight:600;color:#8A948C;">{{r.members}}</span>
            </sc-if>
          </div>
          <span style="font-size:13px;line-height:18px;color:{{r.fg}};overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:225px;">{{r.preview}}</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;">
          <span style="font-size:11.5px;color:#8A948C;">{{r.when}}</span>
          <div style="width:8px;height:8px;border-radius:50%;background:{{r.dot}};"></div>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="height:76px;flex-shrink:0;background:#FFFFFF;border-top:1px solid #ECEAE4;display:flex;align-items:flex-start;padding-top:10px;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <div style="flex-grow:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
        <sc-if value="{{t.plus}}" hint-placeholder-val="{{ false }}">
          <div style="width:46px;height:34px;border-radius:11px;background:#1F6B3F;display:flex;align-items:center;justify-content:center;margin-top:3px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          </div>
        </sc-if>
        <sc-if value="{{t.normal}}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
            <div style="width:24px;height:24px;border-radius:7px;background:{{t.mark}};"></div>
            <span style="font-size:10.5px;font-weight:600;color:{{t.fg}};">{{t.label}}</span>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tab = (label, on) => ({ label, normal: true, plus: false, fg: on ? "#1F6B3F" : "#8A948C", mark: on ? "#1F6B3F" : "#C8CFC9" });
    const plus = { label: "", normal: false, plus: true, fg: "", mark: "" };
    const un = (o) => ({ ...o, fg: '#16211A', dot: '#1F6B3F' });
    const rd = (o) => ({ ...o, fg: '#8A948C', dot: 'transparent' });
    return {
      rows: [
        un({ name: 'Tuesday Climbers', isGroup: true, members: '6', av: '#cfdcd2', preview: 'jonas: moving it to 7 if that works', when: '4m' }),
        un({ name: 'perla', isGroup: false, members: '', av: '#e3d3c6', preview: 'sent you a post', when: '22m' }),
        rd({ name: 'jonas', isGroup: false, members: '', av: '#d8d2e4', preview: 'that heel hook is filthy', when: '1h' }),
        rd({ name: 'Kiln Share', isGroup: true, members: '11', av: '#c9dcda', preview: 'firing sunday, bring greenware', when: '3h' }),
        rd({ name: 'aleks', isGroup: false, members: '', av: '#cfd8e4', preview: 'you: yeah I got the same lens', when: 'Tue' }),
        rd({ name: 'Dawn Chorus', isGroup: true, members: '4', av: '#e3d3c6', preview: 'nadia: 5am at the reservoir', when: 'Mon' }),
      ],
      tabs: [tab('Feed', false), tab('Explore', false), plus, tab('Chats', true), tab('You', false)],
    };
  }
}
</script>
</body></html>
