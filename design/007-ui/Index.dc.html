<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #b8f24a; } a:hover { color: #cbff6e; }
    .g { font-family: 'Space Grotesk', system-ui, sans-serif; }
    .m { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
    .up { letter-spacing: 0.14em; text-transform: uppercase; }
  </style>
</helmet>

<div class="g" style="width: 390px; height: 844px; background: #060d08; color: #eef2ea; overflow: hidden; display: flex; flex-direction: column;">

  <div style="height: 44px; flex-shrink: 0;"></div>

  <div style="flex-shrink: 0; padding: 0 20px; height: 50px; display: flex; align-items: center; justify-content: space-between;">
    <span class="m up" style="font-size: 11px; font-weight: 600;">Interest</span>
    <span class="m up" style="font-size: 10px; color: #6f7a6c;">08.09.26</span>
  </div>

  <!-- THE MACHINERY, MADE VISIBLE. The feed is not a mystery stream: it is
       exactly these five interests, and it says so. -->
  <div style="flex-shrink: 0; border-top: 1px solid #b8f24a; border-bottom: 1px solid #1e2a1f; padding: 12px 20px 14px;">
    <div class="m up" style="font-size: 10px; color: #b8f24a; padding-bottom: 10px;">Feed composed from 5 interests</div>
    <sc-for list="{{index}}" as="i" hint-placeholder-count="5">
      <div style="display: flex; align-items: baseline; gap: 12px; padding: 3px 0;">
        <span class="m" style="font-size: 11px; color: #6f7a6c; width: 18px;">{{i.n}}</span>
        <span style="font-size: 14px; font-weight: 500; letter-spacing: -0.01em;">{{i.name}}</span>
        <div style="flex-grow: 1; height: 1px; background: #1e2a1f; transform: translateY(-3px);"></div>
        <span class="m" style="font-size: 11px; color: {{i.c}};">{{i.count}}</span>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1; overflow: hidden;">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div style="display: flex; gap: 14px; padding: 14px 20px; border-bottom: 1px solid #131c14; align-items: flex-start;">
        <span class="m" style="font-size: 11px; color: #4f5a4d; padding-top: 3px; width: 18px; flex-shrink: 0;">{{r.n}}</span>
        <div style="width: 54px; height: 54px; flex-shrink: 0; background: {{r.thumb}};"></div>
        <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1; min-width: 0;">
          <span style="font-size: 14px; line-height: 19px; font-weight: 500; letter-spacing: -0.01em; text-wrap: pretty;">{{r.title}}</span>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span class="m up" style="font-size: 9px; color: {{r.hue}};">{{r.interest}}</span>
            <span class="m" style="font-size: 10px; color: #4f5a4d;">{{r.meta}}</span>
          </div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="height: 72px; flex-shrink: 0; border-top: 1px solid #1e2a1f; background: #060d08; display: flex; align-items: center;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 7px;">
        <div style="width: 16px; height: 2px; background: {{t.bar}};"></div>
        <span class="m up" style="font-size: 9px; color: {{t.fg}};">{{t.label}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tab = (label, on) => ({ label, fg: on ? '#b8f24a' : '#6f7a6c', bar: on ? '#b8f24a' : 'transparent' });
    return {
      index: [
        { n: '01', name: 'Bouldering', count: '4', c: '#b8f24a' },
        { n: '02', name: 'Birding', count: '2', c: '#b8f24a' },
        { n: '03', name: 'Ceramics', count: '1', c: '#b8f24a' },
        { n: '04', name: 'Film photography', count: '0', c: '#4f5a4d' },
        { n: '05', name: 'Ramen', count: '0', c: '#4f5a4d' },
      ],
      rows: [
        { n: '01', title: 'First clean send of the season, after three months on one problem', interest: 'Bouldering', hue: '#8fbf6e', meta: '2h · 148', thumb: 'linear-gradient(150deg, #4e6b42, #182015)' },
        { n: '02', title: 'Beta for the slab traverse at the quarry', interest: 'Bouldering', hue: '#8fbf6e', meta: '4h · 61', thumb: 'linear-gradient(150deg, #5d7a4a, #1b2416)' },
        { n: '03', title: 'Redstart on the reservoir wall, first of the autumn', interest: 'Birding', hue: '#c88a6e', meta: '5h · 92', thumb: 'linear-gradient(150deg, #7a6a4a, #221d14)' },
        { n: '04', title: 'Reduction firing notes — cone 10, second attempt', interest: 'Ceramics', hue: '#6ec2c8', meta: '7h · 24', thumb: 'linear-gradient(150deg, #3f6b6d, #14211f)' },
        { n: '05', title: 'Dawn chorus count, forty minutes at the weir', interest: 'Birding', hue: '#c88a6e', meta: '9h · 15', thumb: 'linear-gradient(150deg, #6b5f43, #1e1a12)' },
      ],
      tabs: [tab('Feed', true), tab('Index', false), tab('Post', false), tab('Talk', false), tab('You', false)],
    };
  }
}
</script>
</body>
</html>
