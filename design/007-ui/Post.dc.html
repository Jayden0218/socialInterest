<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1F6B3F; } a:hover { color: #17542f; }
    .t { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
  </style>
</helmet>

<div class="t" style="width: 390px; height: 844px; background: #FBFAF8; color: #16211A; overflow: hidden; display: flex; flex-direction: column;">

  <div style="height: 44px; flex-shrink: 0;"></div>

  <div style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 11px; padding: 0 16px; background: #FBFAF8;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16211A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"></path></svg>
    <div style="width: 30px; height: 30px; border-radius: 50%; background: #cfdcd2;"></div>
    <span style="font-size: 14.5px; font-weight: 600;">maren</span>
    <div style="flex-grow: 1;"></div>
    <div style="height: 32px; padding: 0 16px; border-radius: 16px; background: #1F6B3F; display: flex; align-items: center;">
      <span style="font-size: 13px; font-weight: 600; color: #fff;">Follow</span>
    </div>
  </div>

  <div style="flex-grow: 1; overflow: hidden;">
    <div style="width: 390px; height: 400px; background: linear-gradient(160deg, #9db089 0%, #6f8464 55%, #4b5c43 100%);"></div>

    <div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 18px; font-weight: 700; line-height: 24px; letter-spacing: -0.015em; text-wrap: pretty;">Three months on this problem and it went first go</span>
      <span style="font-size: 14px; line-height: 21px; color: #43514A; text-wrap: pretty;">Cold hands, dry rock, nobody else at the boulder. The last move still surprised me.</span>
      <div style="display: flex; align-items: center; gap: 10px; padding-top: 2px;">
        <span style="font-size: 13px; font-weight: 600; color: #1F6B3F;">Bouldering</span>
        <span style="font-size: 12.5px; color: #8A948C;">2 hours ago</span>
      </div>
    </div>

    <div style="height: 1px; background: #ECEAE4; margin: 16px 16px 0;"></div>

    <div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 13px;">
      <sc-for list="{{comments}}" as="c" hint-placeholder-count="2">
        <div style="display: flex; gap: 10px; align-items: flex-start;">
          <div style="width: 28px; height: 28px; border-radius: 50%; background: {{c.av}}; flex-shrink: 0;"></div>
          <div style="display: flex; flex-direction: column; gap: 3px;">
            <span style="font-size: 13.5px; line-height: 19px;"><span style="font-weight: 600;">{{c.who}}</span> <span style="color: #43514A;">{{c.text}}</span></span>
            <span style="font-size: 11.5px; color: #8A948C;">{{c.when}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- actions where a thumb reaches, on one calm bar -->
  <div style="flex-shrink: 0; height: 78px; background: #FFFFFF; border-top: 1px solid #ECEAE4; display: flex; align-items: center; gap: 10px; padding: 0 16px 18px; padding-top: 12px;">
    <div style="flex-grow: 1; height: 42px; border-radius: 21px; background: #F3F1EC; display: flex; align-items: center; padding: 0 16px;">
      <span style="font-size: 13.5px; color: #8A948C;">Say something…</span>
    </div>
    <div style="display: flex; align-items: center; gap: 5px;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#16211A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20S4.5 15.5 4.5 10.5A4.2 4.2 0 0 1 12 7.7a4.2 4.2 0 0 1 7.5 2.8C19.5 15.5 12 20 12 20z"></path></svg>
      <span style="font-size: 12.5px; font-weight: 600;">1.2k</span>
    </div>
    <div style="display: flex; align-items: center; gap: 5px;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#16211A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v16l-6-4.5L6 20V4z"></path></svg>
      <span style="font-size: 12.5px; font-weight: 600;">84</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      comments: [
        { who: 'jonas', text: 'That heel hook is filthy. Congrats.', when: '1h', av: '#d8d2e4' },
        { who: 'perla', text: 'Been stuck on this for weeks — any beta?', when: '42m', av: '#e3d3c6' },
      ],
    };
  }
}
</script>
</body>
</html>
