<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #7ee89b; } a:hover { color: #9df0b3; }
    .d { font-family: 'Bricolage Grotesque', system-ui, sans-serif; }
    .b { font-family: 'Schibsted Grotesk', system-ui, sans-serif; }
  </style>
</helmet>

<div class="b" style="width: 390px; height: 844px; background: #08120b; color: #eaf2ec; overflow: hidden; display: flex; flex-direction: column;">

  <div style="height: 44px; flex-shrink: 0;"></div>

  <div style="height: 50px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
    <span class="d" style="font-size: 21px; font-weight: 800; letter-spacing: -0.03em;">Interest</span>
    <div style="display: flex; gap: 16px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8ea394" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8ea394" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5a5.5 5.5 0 0 0-5.5 5.5c0 4-1.5 5.5-2 6h15c-.5-.5-2-2-2-6A5.5 5.5 0 0 0 12 3.5z"></path><path d="M10.5 19.5a1.7 1.7 0 0 0 3 0"></path></svg>
    </div>
  </div>

  <!-- ONE SHELF PER INTEREST. Scroll down through your interests, sideways
       through the posts inside one. You see a dozen posts without a tap. -->
  <div style="flex-grow: 1; overflow: hidden;">
    <sc-for list="{{shelves}}" as="s" hint-placeholder-count="3">
      <div style="padding: 0 0 20px;">
        <div style="display: flex; align-items: center; gap: 9px; padding: 0 16px 10px;">
          <div style="width: 9px; height: 9px; border-radius: 3px; background: {{s.hue}};"></div>
          <span class="d" style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em;">{{s.name}}</span>
          <span style="font-size: 12px; font-weight: 600; color: {{s.hue}};">{{s.count}}</span>
          <div style="flex-grow: 1;"></div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8ea394" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
        </div>
        <div style="display: flex; gap: 8px; padding: 0 16px; overflow: hidden;">
          <sc-for list="{{s.tiles}}" as="t" hint-placeholder-count="3">
            <div style="position: relative; width: 138px; height: 178px; border-radius: 12px; overflow: hidden; flex-shrink: 0; background: {{t.bg}};">
              <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 52%, rgba(0,0,0,0.66) 100%);"></div>
              <div style="position: absolute; left: 10px; right: 10px; bottom: 9px; display: flex; align-items: center; gap: 6px;">
                <div style="width: 19px; height: 19px; border-radius: 50%; background: rgba(255,255,255,0.24); display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #fff;">{{t.initial}}</div>
                <span style="font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.94);">{{t.who}}</span>
                <div style="flex-grow: 1;"></div>
                <span style="font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.88);">{{t.likes}}</span>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="height: 76px; flex-shrink: 0; background: #0a1610; border-top: 1px solid #1e2c22; display: flex; align-items: flex-start; padding-top: 11px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="#7ee89b"><rect x="3" y="4" width="18" height="7" rx="2.2"></rect><rect x="3" y="13" width="18" height="7" rx="2.2"></rect></svg>
      <span style="font-size: 10px; font-weight: 600; color: #7ee89b;">Feed</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#8ea394" stroke-width="1.7" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M15.2 8.8l-1.9 4.5-4.5 1.9 1.9-4.5 4.5-1.9z"></path></svg>
      <span style="font-size: 10px; font-weight: 500; color: #8ea394;">Explore</span>
    </div>
    <div style="flex-grow: 1; display: flex; justify-content: center;">
      <div style="width: 44px; height: 44px; border-radius: 14px; background: #7ee89b; display: flex; align-items: center; justify-content: center; margin-top: -4px;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#05210e" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#8ea394" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a7.5 7.5 0 0 1-11 6.7L4.5 19.5l1.3-4.3A7.5 7.5 0 1 1 20 11.5z"></path></svg>
      <span style="font-size: 10px; font-weight: 500; color: #8ea394;">Chats</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#8ea394" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8.4" r="3.5"></circle><path d="M5 20c0-3.4 3.1-5.4 7-5.4s7 2 7 5.4"></path></svg>
      <span style="font-size: 10px; font-weight: 500; color: #8ea394;">You</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const t = (who, likes, a, b) => ({ who, initial: who[0].toUpperCase(), likes, bg: 'linear-gradient(158deg, ' + a + ', ' + b + ')' });
    return {
      shelves: [
        { name: 'Bouldering', hue: '#6fd08a', count: '12 new', tiles: [
          t('maren', '148', '#77a463', '#101b12'), t('jonas', '61', '#5d7a4a', '#17210f'), t('perla', '39', '#6f8b56', '#1d2716') ] },
        { name: 'Birding', hue: '#dd8a6b', count: '5 new', tiles: [
          t('nadia', '92', '#c98f68', '#170f0b'), t('sam', '31', '#8a6a45', '#241c12'), t('lior', '18', '#6b5f43', '#1e1a12') ] },
        { name: 'Ceramics', hue: '#63c2c8', count: '3 new', tiles: [
          t('rue', '24', '#4fa7ad', '#0d1817'), t('bo', '12', '#3f6b6d', '#14211f'), t('ines', '9', '#5a8f8a', '#111d1c') ] },
      ],
    };
  }
}
</script>
</body>
</html>
