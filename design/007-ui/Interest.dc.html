<!doctype html>
<html><head><meta charset="utf-8"><script src="./support.js"></script></head><body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>body{margin:0}a{color:#1F6B3F}a:hover{color:#17542f}.t{font-family:'Plus Jakarta Sans',system-ui,sans-serif}</style>
</helmet>
<div class="t" style="width:390px;height:844px;background:#FBFAF8;color:#16211A;overflow:hidden;display:flex;flex-direction:column;">
  <div style="height:44px;flex-shrink:0;"></div>
  <div style="height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16211A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"></path></svg>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="#16211A"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
  </div>
  <div style="flex-shrink:0;padding:6px 16px 0;display:flex;flex-direction:column;gap:9px;">
    <span style="font-size:12px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#1F6B3F;">Interest</span>
    <span style="font-size:27px;font-weight:700;letter-spacing:-0.028em;line-height:32px;">Bouldering</span>
    <span style="font-size:14px;line-height:20px;color:#43514A;">Short, hard climbing without a rope. Problems, projects, and the mats underneath.</span>
    <div style="display:flex;gap:16px;padding-top:1px;">
      <span style="font-size:13px;color:#6B7770;"><span style="color:#16211A;font-weight:600;">12.4k</span> posts</span>
      <span style="font-size:13px;color:#6B7770;"><span style="color:#16211A;font-weight:600;">3,180</span> following</span>
    </div>
    <div style="display:flex;gap:10px;padding:6px 0 0;">
      <div style="flex-grow:1;height:44px;border-radius:22px;background:#1F6B3F;display:flex;align-items:center;justify-content:center;">
        <span style="font-size:14.5px;font-weight:600;color:#fff;">Follow</span>
      </div>
      <div style="width:44px;height:44px;border-radius:22px;border:1px solid #DDD9D0;display:flex;align-items:center;justify-content:center;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#16211A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v16l-6-4.5L6 20V4z"></path></svg>
      </div>
    </div>
    <!-- sub-interests roll up into the parent (FR-024) — shown, not hidden -->
    <div style="display:flex;gap:8px;padding:6px 0 0;overflow:hidden;">
      <sc-for list="{{subs}}" as="s" hint-placeholder-count="4">
        <div style="height:32px;padding:0 13px;border-radius:16px;background:#FFFFFF;border:1px solid #E6E2D8;display:flex;align-items:center;flex-shrink:0;">
          <span style="font-size:13px;font-weight:500;">{{s}}</span>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="flex-grow:1;overflow:hidden;padding:16px 12px 0;display:flex;gap:10px;">
    <sc-for list="{{columns}}" as="col" hint-placeholder-count="2">
      <div style="display:flex;flex-direction:column;gap:12px;width:178px;">
        <sc-for list="{{col.cards}}" as="c" hint-placeholder-count="2">
          <div style="background:#FFFFFF;border-radius:14px;overflow:hidden;">
            <div style="width:178px;height:{{c.h}};background:{{c.art}};"></div>
            <div style="padding:10px 11px 11px;display:flex;flex-direction:column;gap:8px;">
              <span style="font-size:13.5px;font-weight:600;line-height:18px;letter-spacing:-0.008em;text-wrap:pretty;">{{c.title}}</span>
              <div style="display:flex;align-items:center;gap:6px;">
                <div style="width:18px;height:18px;border-radius:50%;background:{{c.av}};"></div>
                <span style="font-size:11.5px;font-weight:500;color:#6B7770;">{{c.who}}</span>
                <div style="flex-grow:1;"></div>
                <span style="font-size:11.5px;font-weight:500;color:#8A948C;">{{c.likes}}</span>
              </div>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const card = (title, who, likes, av, h, art) => ({ title, who, likes, av, h: h + 'px', art });
    return {
      subs: ['Outdoor', 'Slab', 'Highball', 'Comp'],
      columns: [
        { cards: [ card('Three months on this problem and it went first go', 'maren', '1,204', '#cfdcd2', 200, 'linear-gradient(160deg,#9db089,#4b5c43)'),
                   card('Quarry traverse beta', 'jonas', '61', '#d8d2e4', 150, 'linear-gradient(160deg,#b3bfa4,#6c7a5f)') ] },
        { cards: [ card('September conditions', 'perla', '318', '#dcd6cb', 150, 'linear-gradient(160deg,#c3bda9,#8d8a73)'),
                   card('First session back after the finger injury', 'ilse', '77', '#cfdcd2', 200, 'linear-gradient(160deg,#8fa87f,#455239)') ] },
      ],
    };
  }
}
</script>
</body></html>
