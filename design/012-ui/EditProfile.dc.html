<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
/* Tokens lifted verbatim from apps/mobile/src/ui/tokens.ts — not rounded. */
:root{
  --bg:#FBFAF8; --raised:#FFFFFF; --sunken:#F3F1EC;
  --tx:#16211A; --tx2:#43514A; --tx3:#606C66; --on-accent:#FFFFFF;
  --hair:#ECEAE4; --strong:#CFCABE;
  --accent:#1F6B3F; --danger:#C0392B;
  --r-card:14px; --r-btn:11px; --r-field:21px; --r-sheet:20px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none} a:hover{color:#17512F}
/* Type roles — exact values from tokens.ts */
.t-display{font-size:20px;line-height:26px;font-weight:700}
.t-title{font-size:18px;line-height:24px;font-weight:700}
.t-body{font-size:14px;line-height:21px;font-weight:400}
.t-label{font-size:13.5px;line-height:18px;font-weight:600}
.t-caption{font-size:12.5px;line-height:17px;font-weight:500}
.t-small{font-size:11.5px;line-height:16px;font-weight:500}
.t-tab{font-size:10.5px;line-height:14px;font-weight:600}
.phone{width:390px;height:844px;background:var(--bg);position:relative;overflow:hidden;
  display:flex;flex-direction:column}
/* No fake status bar — the real one paints here on a device. */
.safe-top{height:44px;flex:none}
.scroll{flex:1;overflow:hidden}
.nav{flex:none;background:var(--raised);border-top:1px solid var(--hair);
  padding:8px 8px 22px;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:44px;
  justify-content:center;color:var(--tx3)}
.nav-item.on{color:var(--accent)}
.compose{width:46px;height:34px;border-radius:var(--r-btn);background:var(--accent);
  display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:3px}
/* Photographic stand-ins: muted, natural, never a bright gradient. */
.ph{background-color:#C9C3B6;background-repeat:no-repeat;position:relative;overflow:hidden}
.ph-1{background-image:radial-gradient(120% 90% at 20% 15%,#8FA089 0%,#6E8270 45%,#43574B 100%)}
.ph-2{background-image:radial-gradient(110% 80% at 75% 20%,#D8C3A0 0%,#B79770 50%,#7E6242 100%)}
.ph-3{background-image:radial-gradient(120% 95% at 30% 80%,#A9B6C2 0%,#7B8C9C 50%,#4C5A69 100%)}
.ph-4{background-image:radial-gradient(100% 85% at 60% 25%,#C9A79A 0%,#A67E70 50%,#6F4F46 100%)}
.ph-5{background-image:radial-gradient(130% 90% at 25% 30%,#BFC7AE 0%,#93A17F 50%,#5D6B4C 100%)}
.ph-6{background-image:radial-gradient(110% 90% at 70% 70%,#C6B8C9 0%,#9A88A3 50%,#63566E 100%)}

  </style>
</helmet>
<div class="phone">
  <div class="safe-top"></div>
  <div style="flex:none;display:flex;align-items:center;justify-content:space-between;padding:2px 16px 10px;min-height:44px">
    <span style="color:var(--tx2)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14.6 5.4 8 12l6.6 6.6"/></svg></span>
    <span class="t-title">Edit profile</span><span class="t-caption" style="color:var(--on-accent);background:var(--accent);border-radius:var(--r-btn);padding:14px 18px;font-weight:700;white-space:nowrap">Save</span>
  </div>
  <div class="scroll" style="padding:0 16px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0 18px">
      <div style="width:76px;height:76px;border-radius:999px;background:var(--accent);display:flex;
        align-items:center;justify-content:center;color:#fff;font-size:30px;font-weight:700">Y</div>
      <span class="t-caption" style="color:var(--accent);font-weight:700;min-height:44px;display:flex;align-items:center">Change photo</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
  <span class="t-small" style="color:var(--tx3)">Name</span>
  <div class="t-body" style="color:var(--tx);background:var(--sunken);border-radius:var(--r-field);
    padding:12px 16px;letter-spacing:normal">Your name</div></div><div style="height:12px"></div>
    <div style="display:flex;flex-direction:column;gap:6px">
  <span class="t-small" style="color:var(--tx3)">Handle</span>
  <div class="t-body" style="color:var(--tx);background:var(--sunken);border-radius:var(--r-field);
    padding:12px 16px;letter-spacing:normal">@you</div></div><div style="height:12px"></div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <span class="t-small" style="color:var(--tx3)">Bio</span>
      <div class="t-body" style="background:var(--sunken);border-radius:var(--r-card);padding:12px 16px;min-height:72px">Gardening, mostly badly.</div>
    </div>
    <div class="t-caption" style="color:var(--tx3);padding:20px 0 2px">Notifications</div>
    <div style="display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--hair);min-height:44px">
  <div style="flex:1;min-width:0"><span class="t-body">Reactions</span></div><div style="width:44px;height:26px;border-radius:999px;background:var(--accent);position:relative;flex:none"><div style="position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:999px;background:#fff"></div></div></div><div style="display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--hair);min-height:44px">
  <div style="flex:1;min-width:0"><span class="t-body">Comments</span></div><div style="width:44px;height:26px;border-radius:999px;background:var(--accent);position:relative;flex:none"><div style="position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:999px;background:#fff"></div></div></div><div style="display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--hair);min-height:44px">
  <div style="flex:1;min-width:0"><span class="t-body">New followers</span></div><div style="width:44px;height:26px;border-radius:999px;background:var(--strong);position:relative;flex:none"><div style="position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:999px;background:#fff"></div></div></div><div style="display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--hair);min-height:44px">
  <div style="flex:1;min-width:0"><span class="t-body">Messages</span></div><div style="width:44px;height:26px;border-radius:999px;background:var(--accent);position:relative;flex:none"><div style="position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:999px;background:#fff"></div></div></div><div style="display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--hair);min-height:44px">
  <div style="flex:1;min-width:0"><span class="t-body">Mentions</span></div><div style="width:44px;height:26px;border-radius:999px;background:var(--accent);position:relative;flex:none"><div style="position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:999px;background:#fff"></div></div></div>
    <div class="t-caption" style="color:var(--tx3);padding:20px 0 2px">Account</div>
    <div style="display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--hair);min-height:44px">
  <div style="flex:1;min-width:0"><span class="t-body">Private account</span></div><div style="width:44px;height:26px;border-radius:999px;background:var(--strong);position:relative;flex:none"><div style="position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:999px;background:#fff"></div></div></div>
    <div style="display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--hair);min-height:44px">
  <span style="color:var(--tx2)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6.6 4.6h10.8v15.8L12 16.2l-5.4 4.2Z"/></svg></span><div style="flex:1;min-width:0"><span class="t-body">Removed content</span></div><span style="color:var(--tx3)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14.6 5.4 8 12l6.6 6.6"/></svg></span></div>
    <div style="padding:18px 0 30px;display:flex;flex-direction:column;gap:10px">
      <span class="t-caption" style="text-align:center;color:var(--tx);border:1.5px solid var(--strong);
        border-radius:var(--r-btn);padding:14px 0;font-weight:700">Sign out</span>
      <span class="t-caption" style="text-align:center;color:var(--danger);font-weight:700;
        min-height:44px;display:flex;align-items:center;justify-content:center">Delete account</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
