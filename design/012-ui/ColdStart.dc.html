<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
/* Tokens lifted verbatim from apps/mobile/src/ui/tokens.ts — not rounded. */
:root{
  --bg:#FBFAF8; --raised:#FFFFFF; --sunken:#F3F1EC;
  --tx:#16211A; --tx2:#43514A; --tx3:#606C66; --on-accent:#FFFFFF;
  --hair:#ECEAE4; --strong:#CFCABE;
  --accent:#1F6B3F; --danger:#C0392B;
  --r-card:14px; --r-btn:11px; --r-field:21px; --r-sheet:20px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none} a:hover{color:#17512F}
/* Type roles — exact values from tokens.ts */
.t-display{font-size:20px;line-height:26px;font-weight:700}
.t-title{font-size:18px;line-height:24px;font-weight:700}
.t-body{font-size:14px;line-height:21px;font-weight:400}
.t-label{font-size:13.5px;line-height:18px;font-weight:600}
.t-caption{font-size:12.5px;line-height:17px;font-weight:500}
.t-small{font-size:11.5px;line-height:16px;font-weight:500}
.t-tab{font-size:10.5px;line-height:14px;font-weight:600}
.phone{width:390px;height:844px;background:var(--bg);position:relative;overflow:hidden;
  display:flex;flex-direction:column}
/* No fake status bar — the real one paints here on a device. */
.safe-top{height:44px;flex:none}
.scroll{flex:1;overflow:hidden}
.nav{flex:none;background:var(--raised);border-top:1px solid var(--hair);
  padding:8px 8px 22px;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:44px;
  justify-content:center;color:var(--tx3)}
.nav-item.on{color:var(--accent)}
.compose{width:46px;height:34px;border-radius:var(--r-btn);background:var(--accent);
  display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:3px}
/* Photographic stand-ins: muted, natural, never a bright gradient. */
.ph{background-color:#C9C3B6;background-repeat:no-repeat;position:relative;overflow:hidden}
.ph-1{background-image:radial-gradient(120% 90% at 20% 15%,#8FA089 0%,#6E8270 45%,#43574B 100%)}
.ph-2{background-image:radial-gradient(110% 80% at 75% 20%,#D8C3A0 0%,#B79770 50%,#7E6242 100%)}
.ph-3{background-image:radial-gradient(120% 95% at 30% 80%,#A9B6C2 0%,#7B8C9C 50%,#4C5A69 100%)}
.ph-4{background-image:radial-gradient(100% 85% at 60% 25%,#C9A79A 0%,#A67E70 50%,#6F4F46 100%)}
.ph-5{background-image:radial-gradient(130% 90% at 25% 30%,#BFC7AE 0%,#93A17F 50%,#5D6B4C 100%)}
.ph-6{background-image:radial-gradient(110% 90% at 70% 70%,#C6B8C9 0%,#9A88A3 50%,#63566E 100%)}

  </style>
</helmet>
<div class="phone">
  <div class="safe-top"></div>
  <div style="flex:none;display:flex;align-items:center;justify-content:space-between;padding:2px 16px 14px">
    <span class="t-display">What are you into?</span>
    <span class="t-caption" style="color:var(--tx3);font-weight:600;min-height:44px;display:flex;align-items:center">Skip</span>
  </div>
  <div class="scroll" style="padding:0 16px">
    <div class="t-body" style="color:var(--tx2);margin-bottom:18px">
      Pick a few and your feed starts with something in it. You can change this whenever.</div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
      <div style="position:relative;background:var(--raised);border:2px solid #00798D;border-radius:var(--r-card);
      padding:14px 12px;min-height:44px;display:flex;align-items:center">
      <span class="t-label" style="color:#00798D">Birding</span><span style="position:absolute;top:7px;right:7px;color:#00798D"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m5.4 12.4 4.2 4.2 9-9.2"/></svg></span></div><div style="position:relative;background:var(--raised);border:1.5px solid var(--hair);border-radius:var(--r-card);
      padding:14px 12px;min-height:44px;display:flex;align-items:center">
      <span class="t-label" style="color:#A04D39">Ceramics</span></div><div style="position:relative;background:var(--raised);border:2px solid #2D7B44;border-radius:var(--r-card);
      padding:14px 12px;min-height:44px;display:flex;align-items:center">
      <span class="t-label" style="color:#2D7B44">Climbing</span><span style="position:absolute;top:7px;right:7px;color:#2D7B44"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m5.4 12.4 4.2 4.2 9-9.2"/></svg></span></div>
      <div style="position:relative;background:var(--raised);border:1.5px solid var(--hair);border-radius:var(--r-card);
      padding:14px 12px;min-height:44px;display:flex;align-items:center">
      <span class="t-label" style="color:#A14B46">Cooking</span></div><div style="position:relative;background:var(--raised);border:1.5px solid var(--hair);border-radius:var(--r-card);
      padding:14px 12px;min-height:44px;display:flex;align-items:center">
      <span class="t-label" style="color:#007C7D">Cycling</span></div><div style="position:relative;background:var(--raised);border:2px solid #617214;border-radius:var(--r-card);
      padding:14px 12px;min-height:44px;display:flex;align-items:center">
      <span class="t-label" style="color:#617214">Gardening</span><span style="position:absolute;top:7px;right:7px;color:#617214"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m5.4 12.4 4.2 4.2 9-9.2"/></svg></span></div>
      <div style="position:relative;background:var(--raised);border:1.5px solid var(--hair);border-radius:var(--r-card);
      padding:14px 12px;min-height:44px;display:flex;align-items:center">
      <span class="t-label" style="color:#7458A1">Music</span></div><div style="position:relative;background:var(--raised);border:1.5px solid var(--hair);border-radius:var(--r-card);
      padding:14px 12px;min-height:44px;display:flex;align-items:center">
      <span class="t-label" style="color:#964B78">Painting</span></div><div style="position:relative;background:var(--raised);border:1.5px solid var(--hair);border-radius:var(--r-card);
      padding:14px 12px;min-height:44px;display:flex;align-items:center">
      <span class="t-label" style="color:#4866AB">Photography</span></div>
      <div style="position:relative;background:var(--raised);border:1.5px solid var(--hair);border-radius:var(--r-card);
      padding:14px 12px;min-height:44px;display:flex;align-items:center">
      <span class="t-label" style="color:#A04A53">Running</span></div><div style="position:relative;background:var(--raised);border:1.5px solid var(--hair);border-radius:var(--r-card);
      padding:14px 12px;min-height:44px;display:flex;align-items:center">
      <span class="t-label" style="color:#0D70A4">Travel</span></div><div style="position:relative;background:var(--raised);border:1.5px solid var(--hair);border-radius:var(--r-card);
      padding:14px 12px;min-height:44px;display:flex;align-items:center">
      <span class="t-label" style="color:#9A541B">Baking</span></div>
    </div>
  </div>
  <div style="flex:none;padding:12px 16px 26px;background:var(--bg);border-top:1px solid var(--hair)">
    <div class="t-caption" style="text-align:center;color:var(--on-accent);background:var(--accent);
      border-radius:var(--r-btn);padding:15px 0;font-weight:700">Continue with 3</div>
  </div>
</div>
</x-dc>
</body>
</html>
